# Which runner size each job of the shared workflows gets: the ONE table.
#
#   <workflow>:            .github/workflows/<workflow>.yaml
#     <job>:               a job id in that workflow whose runs-on reads the table
#       <repository>|"*":  owner/name, or "*" for every repository; the fleets
#                          also take owner/* for every repository of one owner
#         <name>: <SIZE>   the recipe (check), the lane (integration), or the
#                          job id itself for a job with one name (pins, renovate, align)
#
# A size is a NAME, never a label: XSMALL, SMALL, MEDIUM, LARGE or XLARGE,
# or MEDIUM_SPOT, the MEDIUM shape on Fargate Spot (a trial: a job there
# can be stopped with two minutes' warning, so only work a rerun absorbs,
# and never the stable tier).
# The label comes from the caller's organisation variable
# CI_RUNNER_LABEL_<SIZE>, so the shapes and labels stay wiring (gitops) and
# this file stays mechanism. Resolution, per job:
#
#   1. the row for (repository, name), else (fleets only) the owner/* row,
#      else the "*" row for name, else MEDIUM;
#   2. vars.CI_RUNNER_LABEL_<SIZE>; when the organisation has no such
#      variable (XSMALL and XLARGE arrive later than the other three), the
#      caller's own `runner` input, exactly as before the table existed.
#
# The table applies only when the caller's `runner` IS one of its
# organisation's CI_RUNNER_LABEL_{XSMALL,SMALL,MEDIUM,LARGE,XLARGE} labels:
# the preview tier. A hosted label (every public repository), the stable
# tier's CI_RUNNER_LABEL_STABLE and any other label pass through untouched,
# so the public fence and the stable fence do not depend on this file.
#
# The rule for a row (2026-10-24, the owner's sizing decisions): sizes
# are memory first. A job moves to a bigger size only when its measured
# peak working set x 1.3 does not fit the smaller one (S 4, M 8, L 12,
# XL 16 GiB); never for speed. Jobs on LARGE before the table stay there
# until their measurements say otherwise. The evidence is the
# `grun.job.peak` record every Fargate job writes (and the peak line it
# prints); `hack/runner-sizes.sh` checks this file, and `just
# runner-sizes-audit` checks each name against its caller.
#
# Changing a row: edit here, run `just runner-sizes`, and cut a release.
# The workflows carry a rendered copy of their own rows in runs-on (an
# expression cannot read a file); CI fails when a copy differs from this
# file.

check:
  # The library's own `pins` job: seconds of work, 0.3 GiB at most.
  pins:
    "*":
      pins: XSMALL
  recipe:
    # The weekly security caller, everywhere: gitops 5.8 GiB, phoenix 4.9.
    "*":
      vuln: MEDIUM
    truvity/gitops:
      ci-verify: LARGE          # 7.5 GiB
      lint: LARGE               # 7.1 GiB
      ci-verify-guard: LARGE
      ci-verify-pins: LARGE
      # 5.8 GiB measured, but 12.5-13 GiB recorded while go1.27.1 had
      # reachable advisories (gitops security.yaml): 95% of MEDIUM is too tight.
      vuln: LARGE
    truvity/dms:
      test: LARGE               # 5.7 GiB
      test-sdk-java: MEDIUM     # 1.7 GiB, was LARGE
      # build (5.1) and lint (4.9) are MEDIUM, the default.
    truvity/eudi:
      build: LARGE
      test: LARGE
      lint: LARGE
    truvity/docs:
      build: LARGE              # 4.9 GiB
      lint: MEDIUM              # 2.8 GiB, was LARGE
      test: MEDIUM              # 2.8 GiB, was LARGE
    truvity/keycloak:
      charts: LARGE
      library: LARGE
    trust-form/wallet:
      ci: XLARGE                # 10.9 GiB: x 1.3 is over LARGE's 12
    trust-form/trustform-front:
      build: XLARGE             # 9.1 GiB, was MEDIUM
    trust-form/cra-ext-front:
      build: LARGE
      lint: LARGE
    trust-form/internal-dashboard-backend:
      build: LARGE
      test: LARGE
      lint: LARGE
    trust-form/internal-dashboard-frontend:
      build: LARGE
      typecheck: LARGE
      lint: LARGE
    trust-form/openapi-contracts:
      lint: LARGE
    trust-form/public-api:
      lint: LARGE
    trust-form/schemas-library:
      build: LARGE
      lint: LARGE
      test: LARGE
    trust-form/tf-bughunter:
      build: LARGE
    trust-form/tf-config:
      lint: LARGE
    trust-form/wallet-mobile:
      lint: LARGE
      test: LARGE

integration:
  suite:
    truvity/dms:
      dms: LARGE                # 7.0 GiB
      lib: LARGE
    truvity/eudi:
      eudi-vci: LARGE
      eudi-vp: LARGE

# The fleets key on the repository a matrix job works on, not the caller.
renovate-fleet:
  renovate:
    "*":
      renovate: MEDIUM          # 5.3 GiB at most (truvity/dms), was LARGE
    # The Fargate Spot trial (2026-10-25): trust-form's fleet, 3.9 GiB at
    # most. An organisation without CI_RUNNER_LABEL_MEDIUM_SPOT keeps the
    # caller's runner.
    trust-form/*:
      renovate: MEDIUM_SPOT

parity-fleet:
  align:
    "*":
      align: SMALL              # 2.0 GiB at most, was LARGE
