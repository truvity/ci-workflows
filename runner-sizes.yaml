# Which runner size each job of the shared workflows gets, where the caller
# does not say.
#
# The table names no repository. A caller of check.yaml, integration.yaml,
# renovate-fleet.yaml or parity-fleet.yaml names the size of each recipe,
# lane or job that needs more (or less) in its `runner-sizes` input, which
# is read before this table.
# `hack/runner-sizes.sh check` refuses a row that names one repository.
#
#   <workflow>:            .github/workflows/<workflow>.yaml
#     <job>:               a job id in that workflow whose runs-on reads the table
#       "*" | <owner>/*:   "*" for every repository; the fleets also take
#                          <owner>/* for every repository of the caller's owner
#         <name>: <SIZE>   the recipe (check), the lane (integration), or the
#                          job id itself for a job with one name (pins, renovate, align)
#
# A size is a NAME, never a label: XSMALL, SMALL, MEDIUM, LARGE or XLARGE.
# MEDIUM_SPOT, the MEDIUM shape on Fargate Spot (a trial: a job there can
# be stopped with two minutes' warning, so only work a rerun absorbs, and
# never the stable tier), is still a valid name but no row uses it (the
# trial ended 2026-10-28).
# The label comes from the caller's organisation variable
# CI_RUNNER_LABEL_<SIZE>, so the shapes and labels stay wiring and this
# file stays mechanism. Resolution, per job:
#
#   1. the caller's `runner-sizes` entry for name, else (fleets only)
#      the <owner>/* row, else the "*" row for name, else MEDIUM;
#   2. vars.CI_RUNNER_LABEL_<SIZE>; when the organisation has no such
#      variable (XSMALL and XLARGE arrive later than the other three), the
#      caller's own `runner` input, exactly as before the table existed.
#
# The table applies only when the caller's `runner` IS one of its
# organisation's CI_RUNNER_LABEL_{XSMALL,SMALL,MEDIUM,LARGE,XLARGE} labels:
# the preview tier. A hosted label (every public repository), the stable
# tier's CI_RUNNER_LABEL_STABLE and any other label pass through untouched,
# so the public fence and the stable fence do not depend on this file.
#
# The rule for a row (2026-10-24): sizes are memory first. A job moves to a
# bigger size only when its measured peak working set x 1.3 does not fit
# the smaller one (S 8, M 8, L 12, XL 20 GiB; S is 1 vCPU, M 2, L 4, XL 8);
# never for speed. The evidence is the `grun.job.peak` record every Fargate
# job writes (and the peak line it prints); `hack/runner-sizes.sh` checks
# this file.
#
# Changing a "*" row: edit here, run `just runner-sizes`, and cut a release.
# Changing one repository's size: its caller's `runner-sizes` input.
# The workflows carry a rendered copy of their own rows in runs-on (an
# expression cannot read a file); CI fails when a copy differs from this
# file.

check:
  # The library's own `pins` job: seconds of work, 0.3 GiB at most.
  pins:
    "*":
      pins: XSMALL
  recipe:
    # The weekly security caller, everywhere: 5.8 GiB at most measured.
    "*":
      vuln: MEDIUM

integration:
  # No "*" row: every lane is MEDIUM unless its caller names a size.
  suite: {}

# The fleets key on the caller's owner, not the caller.
renovate-fleet:
  renovate:
    "*":
      renovate: SMALL           # 4.65 GiB at most on 1 vCPU / 8 GiB (CPU average 0.5-0.9), was MEDIUM

parity-fleet:
  align:
    "*":
      align: MEDIUM             # 2.8 GiB at most; SMALL's one vCPU throttled it 35% of the time (was SMALL, before that LARGE)
