# govulncheck, on pull requests and daily.
#
# Deliberately ONE scanner, where the estate template ran two. The
# template also ran trivy in `scan-type: fs`, which on a Go repository
# reads go.mod/go.sum and reports dependency advisories — govulncheck's
# job, minus the part that makes it useful. govulncheck is
# REACHABILITY-AWARE: it reports an advisory only when the vulnerable
# symbol is actually callable from this module. That difference is why
# pulumi-zitadel is the only repo red on the 2026-08 Go stdlib
# advisories while all ten run the same 1.25.12 toolchain.
#
# SAST is not missing either — CodeQL default setup covers `go` and
# `actions` at the `extended` query suite, configured org-side, and it
# reports its own contexts.
#
# Where trivy WOULD earn a place is `scan-type: image` against a built
# image, catching base-image CVEs no Go tool can see. That belongs in
# the release path, where an image exists, not on every pull request.
name: security

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      packages:
        description: >-
          Go package pattern to scan. `./...` is right for almost
          everything; a repo with a nested module (pulumi-zitadel's
          provider/) names it instead.
        required: false
        type: string
        default: ./...
      timeout-minutes:
        required: false
        type: number
        default: 30

# No security-events: write, because nothing uploads SARIF any more.
# Adding a scanner that does means the CALLER must grant it — a reusable
# workflow cannot widen its caller's permissions.
permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: truvity/ci-workflows/.github/actions/setup-devbox@83db2219dc4de7c1cee3cd01e9c2cc85544e7fe9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: devbox run -- govulncheck "$PACKAGES"
        env:
          PACKAGES: ${{ inputs.packages }}
