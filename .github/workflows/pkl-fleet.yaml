# Move every consumer of a Pkl contracts library to its newest release, from
# ONE caller: one small job per consuming repository, one pull request each.
#
# Why this exists: a repository that consumes the packages declares them in a
# `PklProject` (`package://<host>/<owner>/<repo>/releases/download/v<ver>/
# <name>@<ver>`) and commits the `PklProject.deps.json` that records their
# checksums. Renovate has no Pkl manager, and even one that could rewrite the
# URI could not regenerate `deps.json`. So this job does what a person would:
# rewrite the URIs, run `pkl project resolve`, regenerate what is generated,
# open the pull request.
#
# DISCOVERY is the fleet's: an explicit enrolment list in the caller
# repository (`repositories-file`, `list`) narrowed by truvity/ci-actions'
# `fleet-discover` (archived repositories dropped, the App's reach checked,
# a required status check demanded). It is then narrowed once more by what a
# repository CONTAINS: the default branch's tree names every `PklProject`,
# each is read, and only a repository with a dependency URI into `source`
# that is not already at the target version gets a job. Not `gh search
# code`: code search is rate-limited, eventually consistent and blind to a
# repository it cannot index, and it would be a second, unreviewed notion of
# scope beside the enrolment list. A repository that is current costs one
# tree read and no runner, so a run that has nothing to do is cheap, which is
# what lets the caller poll.
#
# WHAT A JOB DOES, in the consumer's checkout and inside its devbox:
#   1. rewrite every `PklProject` and its `PklProject.deps.json` that name
#      `source` to the target version. Refused, before anything is written:
#      a URI under `source` that does not have the shape
#      `v<X>/<name>@<X>` (or the major-only `@<major>` key of deps.json), a
#      tag and an `@` version that disagree, and a downgrade;
#   2. `pkl project resolve`: the repository's own `resolve` recipe when it
#      has one (it knows which projects there are and which Pkl it pins),
#      else `pkl-command project resolve <dir>` for each rewritten project;
#   3. the repository's `generate` recipe when it has one, so committed
#      generated files follow the new contract in the same pull request;
#   4. one commit, one fixed branch (`<branch-prefix><version>`, force-pushed
#      only when its content changed), one pull request labelled
#      `dependencies` (and `major` when breaking). An open pull request for
#      an older version of the same library is closed as superseded.
#
# AUTO-MERGE is armed (rebase, as the other fleet jobs do) only for a bump
# that is not breaking, and only when `require-check` is on, so there is a
# green to wait for. Breaking is: a new major, a new MINOR while the major is
# 0 (semver promises nothing below 1.0), or a prerelease target. A breaking
# pull request carries the `major` label, which the fleet's approval step
# already refuses to approve, and is left for a human.
#
# `dry-run: true` does everything up to the push: it discovers, rewrites,
# resolves and generates, prints the diff, and opens nothing. Its tokens are
# read-only.
#
# TOKENS come from the same two sources as renovate-fleet and parity-fleet
# (`token-source`: `app-key` or `access-roster`). The App needs
# `contents: write` and `pull_requests: write` on every consumer; the same
# App parity-fleet uses has exactly that.
#
# THE TARGET is `version`, or, empty, the source's latest release. A version
# that is not a published release is refused.
#
# TRIGGER. Nothing here runs by itself: the caller decides. A schedule that
# polls is the simplest fit for the credential model, because a run needs no
# credential from the library's repository (a `repository_dispatch` into the
# caller would need a token able to write to the caller, held by the
# library's release workflow). Hourly is a latency of an hour, and an idle
# run is a few API reads. `workflow_dispatch` for a bump on demand.
#
#   on:
#     schedule:
#       - cron: "17 * * * *"
#     workflow_dispatch:
#       inputs:
#         version:  { description: "Release to move to (empty: the latest)", default: "" }
#         dry-run:  { description: "Rewrite and resolve, open nothing", type: boolean, default: false }
#   concurrency:
#     group: pkl-fleet
#     cancel-in-progress: false
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     pkl:
#       uses: truvity/ci-workflows/.github/workflows/pkl-fleet.yaml@<sha> # vX.Y.Z
#       with:
#         estate: public
#         list: pkl.public
#         version: ${{ inputs.version || '' }}
#         dry-run: ${{ inputs.dry-run || false }}
#         token-source: access-roster
#         access-roster-issuer: https://access.example
#         github-app: renovate-public
#         git-user: example-renovate-public[bot]
#
# or, with a key: `client-id` and the RENOVATE_APP_PRIVATE_KEY secret replace
# `token-source`, `access-roster-issuer` and `github-app`.
#
# The steps' rules (target version, consumer discovery, rewrite, resolve,
# pull request) are the ci-actions `pkl-fleet` action's, tested there.
name: pkl-fleet

on:
  workflow_call:
    inputs:
      estate:
        description: "`public` or `private` — the only visibility this run may touch."
        required: true
        type: string
      source:
        description: >-
          The repository that publishes the Pkl packages, `owner/name`.
          Dependency URIs into its release downloads are what gets
          rewritten.
        required: false
        type: string
        default: truvity/pkl-contracts
      version:
        description: >-
          The release to move to, `X.Y.Z` or `vX.Y.Z`. Empty (the default):
          the source's latest release. It must be a published release.
        required: false
        type: string
        default: ""
      dry-run:
        description: >-
          Discover, rewrite, resolve and generate, print the diff, and open
          nothing. The tokens asked for are read-only.
        required: false
        type: boolean
        default: false
      auto-merge:
        description: >-
          Arm auto-merge on a pull request that is not breaking. Never armed
          on a breaking one, and never when `require-check` is false.
        required: false
        type: boolean
        default: true
      branch-prefix:
        description: The pull request's branch is this plus the version.
        required: false
        type: string
        default: pkl-contracts-
      pkl-command:
        description: >-
          The Pkl executable, run in the consumer's devbox, for a repository
          that has no `resolve` recipe (`pkl`, or `bin/pkl` where the
          repository pins its own).
        required: false
        type: string
        default: pkl
      runner:
        description: Where each repository's job runs. GitHub-hosted for the public estate; the pool label for the private one.
        required: false
        type: string
        default: ubuntu-latest
      token-source:
        description: >-
          Where tokens come from: `app-key` (`client-id` and the
          RENOVATE_APP_PRIVATE_KEY secret) or `access-roster` (installation
          tokens of `github-app`, exchanged at `access-roster-issuer` for
          the job's GitHub OIDC token).
        required: false
        type: string
        default: app-key
      access-roster-issuer:
        description: The access-roster issuer URL. Required when token-source is `access-roster`.
        required: false
        type: string
        default: ""
      github-app:
        description: >-
          The App's catalogue id at the issuer — the identity that pushes
          the branch and opens the PR. Required when token-source is
          `access-roster`.
        required: false
        type: string
        default: ""
      client-id:
        description: >-
          The App's client id — the identity that pushes the branch and
          opens the PR. Required when token-source is `app-key`.
        required: false
        type: string
        default: ""
      require-check:
        description: >-
          Skip repositories whose default branch has no required status
          check, from either a ruleset or classic branch protection. Keep
          `true` wherever pull requests auto-merge: with nothing gating a
          merge, auto-merge lands immediately and unvalidated.
        required: false
        type: boolean
        default: true
      repositories-file:
        description: YAML file in the caller repository holding the enrolment lists.
        required: false
        type: string
        default: fleet.yaml
      list:
        description: >-
          Dotted path to this job's list inside repositories-file, e.g.
          `pkl.public`. Empty processes every repository the App can see.
        required: false
        type: string
        default: ""
      filter:
        description: RE2 over `owner/name`; only matches are processed.
        required: false
        type: string
        default: ""
      git-user:
        description: Commit author name — the App's bot login.
        required: true
        type: string
      git-email:
        description: >-
          Commit author email — the App's noreply address,
          `<bot user id>+<git-user>@users.noreply.github.com`. Empty looks
          the bot user id up from git-user.
        required: false
        type: string
        default: ""
      max-parallel:
        description: How many repositories are processed at once.
        required: false
        type: number
        default: 4
      timeout-minutes:
        description: Per repository.
        required: false
        type: number
        default: 30
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        description: The App's private key. Required when token-source is `app-key`.
        required: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # token-source access-roster
    outputs:
      version: ${{ steps.target.outputs.version }}
      repositories: ${{ steps.consumers.outputs.repositories }}
      count: ${{ steps.consumers.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.list != ''
        with:
          sparse-checkout: ${{ inputs.repositories-file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the enrolment list
        id: enrolled
        if: inputs.list != ''
        uses: truvity/ci-actions/enrolment-list@62eecede955676a2c0fb760dd185521528886d0b # v1.10.0
        with:
          file: ${{ inputs.repositories-file }}
          list: ${{ inputs.list }}

      - name: Check the token inputs
        uses: truvity/ci-actions/token-inputs@d0dc2123d0d698d205713525d84346fffcb86eb5 # v1.15.1
        with:
          source: ${{ inputs.token-source }}
          access-roster-issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          id: ${{ inputs.client-id }}
          id-name: client-id
          secret-name: RENOVATE_APP_PRIVATE_KEY
          has-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY != '' }}

      # The target version, from the source's releases. The job's own token
      # is enough: the source is public.
      - name: Resolve the target version
        id: target
        uses: truvity/ci-actions/pkl-fleet@d6beff8461642ddb082e218875fe9a8759dbacc2 # v1.13.0
        with:
          step: target
          version: ${{ inputs.version }}
          source: ${{ inputs.source }}
          api-url: ${{ github.api_url }}
          token: ${{ github.token }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Not narrowed: discovery lists every repository the App can see, and
      # the required-check rule's fallback answers for the viewer.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}

      - uses: truvity/ci-actions/fleet-discover@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        id: discover
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          estate: ${{ inputs.estate }}
          filter: ${{ inputs.filter }}
          repositories: ${{ steps.enrolled.outputs.names }}
          require-check: ${{ inputs.require-check && 'true' || 'false' }}

      # Which of those consume the source, and are not already current. One
      # tree read per repository, one file read per PklProject. A repository
      # that cannot be read, or has a PklProject but no devbox.json to run
      # its recipes in, is an error annotation and is left out; the rest
      # still run.
      - name: Find the consumers that need a bump
        id: consumers
        if: steps.discover.outputs.count != '0'
        uses: truvity/ci-actions/pkl-fleet@d6beff8461642ddb082e218875fe9a8759dbacc2 # v1.13.0
        with:
          step: consumers
          repositories: ${{ steps.discover.outputs.repositories }}
          source: ${{ inputs.source }}
          version: ${{ steps.target.outputs.version }}
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          api-url: ${{ github.api_url }}

  bump:
    needs: discover
    if: needs.discover.outputs.count != '' && needs.discover.outputs.count != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # token-source access-roster
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    name: ${{ matrix.repository }}
    steps:
      - name: Name the repository
        id: name
        env:
          REPO: ${{ matrix.repository }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      # A token for THIS repository only: the job holds no more reach than
      # the one repository it updates.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.name.outputs.name }}
          permission-contents: ${{ inputs.dry-run && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.dry-run && 'read' || 'write' }}

      # Push one branch, open and auto-merge one pull request: contents and
      # pull_requests, on this repository. A dry run only reads.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          repositories: ${{ steps.name.outputs.name }}
          permissions: ${{ inputs.dry-run && 'contents:read' || 'contents:write, pull_requests:write' }}

      - name: Resolve the commit author
        id: author
        if: ${{ !inputs.dry-run }}
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: commit-author
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          user-login: ${{ inputs.git-user }}
          email: ${{ inputs.git-email }}
          api-url: ${{ github.api_url }}

      - name: Read the default branch
        id: repo
        env:
          TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          REPO: ${{ matrix.repository }}
          API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          base=$(curl -fsS --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API/repos/$REPO" | jq -r '.default_branch')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "$REPO: default branch $base"

      # No credentials left in the checkout: the consumer's recipes run in
      # it, and must not be able to read the token. The push below
      # presents it by itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ steps.repo.outputs.base }}
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          persist-credentials: false

      - uses: truvity/ci-actions/setup-devbox@0fcf84dbeb8d406bce34d969e6cc32592af5cb5b # v1.15.0
        with:
          proto: "false"
          # The job's own read-only token (API rate limits), never the App's:
          # setup-devbox reads the consumer's tool config, and a token that
          # can push to the consumer has no business there.
          github-token: ${{ github.token }}

      - name: Rewrite the dependency URIs
        id: rewrite
        uses: truvity/ci-actions/pkl-fleet@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: rewrite
          target: ${{ needs.discover.outputs.version }}
          source: ${{ inputs.source }}
          dirs-file: ${{ runner.temp }}/pkl-projects.txt

      # Inside the consumer's devbox, so it is the consumer's Pkl, `just`
      # and generators. A failed resolve or generate fails the job and
      # pushes nothing.
      - name: Resolve and regenerate
        if: steps.rewrite.outputs.changed == 'true'
        uses: truvity/ci-actions/pkl-fleet@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: resolve
          dirs-file: ${{ runner.temp }}/pkl-projects.txt
          pkl-command: ${{ inputs.pkl-command }}

      - name: Open or update the pull request
        id: pr
        if: steps.rewrite.outputs.changed == 'true'
        uses: truvity/ci-actions/pkl-fleet@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: publish
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          repository: ${{ matrix.repository }}
          base: ${{ steps.repo.outputs.base }}
          api-url: ${{ github.api_url }}
          source: ${{ inputs.source }}
          version: ${{ needs.discover.outputs.version }}
          from: ${{ steps.rewrite.outputs.from }}
          breaking: ${{ steps.rewrite.outputs.breaking }}
          dirs-file: ${{ runner.temp }}/pkl-projects.txt
          branch-prefix: ${{ inputs.branch-prefix }}
          dry-run: ${{ inputs.dry-run }}
          auto-merge: ${{ inputs.auto-merge && inputs.require-check }}
          git-user: ${{ inputs.git-user }}
          git-email: ${{ steps.author.outputs.git-email }}
