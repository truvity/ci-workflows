# Move every consumer of a Pkl contracts library to its newest release, from
# ONE caller: one small job per consuming repository, one pull request each.
#
# Why this exists: a repository that consumes the packages declares them in a
# `PklProject` (`package://<host>/<owner>/<repo>/releases/download/v<ver>/
# <name>@<ver>`) and commits the `PklProject.deps.json` that records their
# checksums. Renovate has no Pkl manager, and even one that could rewrite the
# URI could not regenerate `deps.json`. So this job does what a person would:
# rewrite the URIs, run `pkl project resolve`, regenerate what is generated,
# open the pull request.
#
# DISCOVERY is the fleet's: an explicit enrolment list in the caller
# repository (`repositories-file`, `list`) narrowed by truvity/ci-actions'
# `fleet-discover` (archived repositories dropped, the App's reach checked,
# a required status check demanded). It is then narrowed once more by what a
# repository CONTAINS: the default branch's tree names every `PklProject`,
# each is read, and only a repository with a dependency URI into `source`
# that is not already at the target version gets a job. Not `gh search
# code`: code search is rate-limited, eventually consistent and blind to a
# repository it cannot index, and it would be a second, unreviewed notion of
# scope beside the enrolment list. A repository that is current costs one
# tree read and no runner, so a run that has nothing to do is cheap, which is
# what lets the caller poll.
#
# WHAT A JOB DOES, in the consumer's checkout and inside its devbox:
#   1. rewrite every `PklProject` and its `PklProject.deps.json` that name
#      `source` to the target version. Refused, before anything is written:
#      a URI under `source` that does not have the shape
#      `v<X>/<name>@<X>` (or the major-only `@<major>` key of deps.json), a
#      tag and an `@` version that disagree, and a downgrade;
#   2. `pkl project resolve`: the repository's own `resolve` recipe when it
#      has one (it knows which projects there are and which Pkl it pins),
#      else `pkl-command project resolve <dir>` for each rewritten project;
#   3. the repository's `generate` recipe when it has one, so committed
#      generated files follow the new contract in the same pull request;
#   4. one commit, one fixed branch (`<branch-prefix><version>`, force-pushed
#      only when its content changed), one pull request labelled
#      `dependencies` (and `major` when breaking). An open pull request for
#      an older version of the same library is closed as superseded.
#
# AUTO-MERGE is armed (rebase, as the other fleet jobs do) only for a bump
# that is not breaking, and only when `require-check` is on, so there is a
# green to wait for. Breaking is: a new major, a new MINOR while the major is
# 0 (semver promises nothing below 1.0), or a prerelease target. A breaking
# pull request carries the `major` label, which the fleet's approval step
# already refuses to approve, and is left for a human.
#
# `dry-run: true` does everything up to the push: it discovers, rewrites,
# resolves and generates, prints the diff, and opens nothing. Its tokens are
# read-only.
#
# TOKENS come from the same two sources as renovate-fleet and parity-fleet
# (`token-source`: `app-key` or `access-roster`). The App needs
# `contents: write` and `pull_requests: write` on every consumer; the same
# App parity-fleet uses has exactly that.
#
# THE TARGET is `version`, or, empty, the source's latest release. A version
# that is not a published release is refused.
#
# TRIGGER. Nothing here runs by itself: the caller decides. A schedule that
# polls is the simplest fit for the credential model, because a run needs no
# credential from the library's repository (a `repository_dispatch` into the
# caller would need a token able to write to the caller, held by the
# library's release workflow). Hourly is a latency of an hour, and an idle
# run is a few API reads. `workflow_dispatch` for a bump on demand.
#
#   on:
#     schedule:
#       - cron: "17 * * * *"
#     workflow_dispatch:
#       inputs:
#         version:  { description: "Release to move to (empty: the latest)", default: "" }
#         dry-run:  { description: "Rewrite and resolve, open nothing", type: boolean, default: false }
#   concurrency:
#     group: pkl-fleet
#     cancel-in-progress: false
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     pkl:
#       uses: truvity/ci-workflows/.github/workflows/pkl-fleet.yaml@<sha> # vX.Y.Z
#       with:
#         estate: public
#         list: pkl.public
#         version: ${{ inputs.version || '' }}
#         dry-run: ${{ inputs.dry-run || false }}
#         token-source: access-roster
#         access-roster-issuer: https://access.example
#         github-app: renovate-public
#         git-user: example-renovate-public[bot]
#
# or, with a key: `client-id` and the RENOVATE_APP_PRIVATE_KEY secret replace
# `token-source`, `access-roster-issuer` and `github-app`.
#
# The marked blocks (`>>> target`, `>>> consumers`, `>>> rewrite`,
# `>>> resolve`, `>>> publish`) are run by hack/pkl-fleet-cases.sh as
# written, against stubbed `curl`, `devbox`, `just` and Pkl.
name: pkl-fleet

on:
  workflow_call:
    inputs:
      estate:
        description: "`public` or `private` — the only visibility this run may touch."
        required: true
        type: string
      source:
        description: >-
          The repository that publishes the Pkl packages, `owner/name`.
          Dependency URIs into its release downloads are what gets
          rewritten.
        required: false
        type: string
        default: truvity/pkl-contracts
      version:
        description: >-
          The release to move to, `X.Y.Z` or `vX.Y.Z`. Empty (the default):
          the source's latest release. It must be a published release.
        required: false
        type: string
        default: ""
      dry-run:
        description: >-
          Discover, rewrite, resolve and generate, print the diff, and open
          nothing. The tokens asked for are read-only.
        required: false
        type: boolean
        default: false
      auto-merge:
        description: >-
          Arm auto-merge on a pull request that is not breaking. Never armed
          on a breaking one, and never when `require-check` is false.
        required: false
        type: boolean
        default: true
      branch-prefix:
        description: The pull request's branch is this plus the version.
        required: false
        type: string
        default: pkl-contracts-
      pkl-command:
        description: >-
          The Pkl executable, run in the consumer's devbox, for a repository
          that has no `resolve` recipe (`pkl`, or `bin/pkl` where the
          repository pins its own).
        required: false
        type: string
        default: pkl
      runner:
        description: Where each repository's job runs. GitHub-hosted for the public estate; the pool label for the private one.
        required: false
        type: string
        default: ubuntu-latest
      token-source:
        description: >-
          Where tokens come from: `app-key` (`client-id` and the
          RENOVATE_APP_PRIVATE_KEY secret) or `access-roster` (installation
          tokens of `github-app`, exchanged at `access-roster-issuer` for
          the job's GitHub OIDC token).
        required: false
        type: string
        default: app-key
      access-roster-issuer:
        description: The access-roster issuer URL. Required when token-source is `access-roster`.
        required: false
        type: string
        default: ""
      github-app:
        description: >-
          The App's catalogue id at the issuer — the identity that pushes
          the branch and opens the PR. Required when token-source is
          `access-roster`.
        required: false
        type: string
        default: ""
      client-id:
        description: >-
          The App's client id — the identity that pushes the branch and
          opens the PR. Required when token-source is `app-key`.
        required: false
        type: string
        default: ""
      require-check:
        description: >-
          Skip repositories whose default branch has no required status
          check, from either a ruleset or classic branch protection. Keep
          `true` wherever pull requests auto-merge: with nothing gating a
          merge, auto-merge lands immediately and unvalidated.
        required: false
        type: boolean
        default: true
      repositories-file:
        description: YAML file in the caller repository holding the enrolment lists.
        required: false
        type: string
        default: fleet.yaml
      list:
        description: >-
          Dotted path to this job's list inside repositories-file, e.g.
          `pkl.public`. Empty processes every repository the App can see.
        required: false
        type: string
        default: ""
      filter:
        description: RE2 over `owner/name`; only matches are processed.
        required: false
        type: string
        default: ""
      git-user:
        description: Commit author name — the App's bot login.
        required: true
        type: string
      git-email:
        description: >-
          Commit author email — the App's noreply address,
          `<bot user id>+<git-user>@users.noreply.github.com`. Empty looks
          the bot user id up from git-user.
        required: false
        type: string
        default: ""
      max-parallel:
        description: How many repositories are processed at once.
        required: false
        type: number
        default: 4
      timeout-minutes:
        description: Per repository.
        required: false
        type: number
        default: 30
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        description: The App's private key. Required when token-source is `app-key`.
        required: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # token-source access-roster
    outputs:
      version: ${{ steps.target.outputs.version }}
      repositories: ${{ steps.consumers.outputs.repositories }}
      count: ${{ steps.consumers.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.list != ''
        with:
          sparse-checkout: ${{ inputs.repositories-file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the enrolment list
        id: enrolled
        if: inputs.list != ''
        env:
          FILE: ${{ inputs.repositories-file }}
          LIST: ${{ inputs.list }}
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || { echo "::error::$FILE not found in the caller repository"; exit 1; }
          # yq ships on GitHub-hosted runners; this job always runs on one.
          names=$(yq -o=json -I=0 ".${LIST} // []" "$FILE")
          if [ "$(jq 'length' <<<"$names")" -eq 0 ]; then
            echo "::error::$FILE has no entries under $LIST"
            exit 1
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "$LIST: $(jq -r 'join(", ")' <<<"$names")"

      - name: Check the token inputs
        env:
          SOURCE: ${{ inputs.token-source }}
          ISSUER: ${{ inputs.access-roster-issuer }}
          APP: ${{ inputs.github-app }}
          CLIENT_ID: ${{ inputs.client-id }}
          HAS_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          fail=0
          case "$SOURCE" in
            app-key)
              [ -n "$CLIENT_ID" ] || { echo "::error::token-source app-key needs client-id"; fail=1; }
              [ "$HAS_KEY" = true ] || { echo "::error::token-source app-key needs the RENOVATE_APP_PRIVATE_KEY secret"; fail=1; }
              ;;
            access-roster)
              [ -n "$ISSUER" ] || { echo "::error::token-source access-roster needs access-roster-issuer"; fail=1; }
              [ -n "$APP" ] || { echo "::error::token-source access-roster needs github-app"; fail=1; }
              ;;
            *)
              echo "::error::token-source must be app-key or access-roster (got '$SOURCE')"; fail=1 ;;
          esac
          exit "$fail"

      # The target version, from the source's releases. The job's own token
      # is enough: the source is public.
      - name: Resolve the target version
        id: target
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.source }}
          API: ${{ github.api_url }}
          TOKEN: ${{ github.token }}
        run: |
          # >>> target (hack/pkl-fleet-cases.sh runs this block)
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          api() {
            curl -fsS --max-time 60 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          [[ $SOURCE =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "source '$SOURCE' is not owner/name"
          version="${VERSION#v}"
          if [ -z "$version" ]; then
            tag=$(api "$API/repos/$SOURCE/releases/latest" | jq -r '.tag_name // empty') \
              || fail "could not read the latest release of $SOURCE"
            [ -n "$tag" ] || fail "$SOURCE has no release"
            version="${tag#v}"
          fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || fail "'$version' is not a version (X.Y.Z, optionally -prerelease)"
          api "$API/repos/$SOURCE/releases/tags/v$version" >/dev/null \
            || fail "$SOURCE has no published release v$version — nothing to move to"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "moving consumers of $SOURCE to v$version"
          # <<< target

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Not narrowed: discovery lists every repository the App can see, and
      # the required-check rule's fallback answers for the viewer.
      - uses: truvity/ci-actions/token-exchange@30eef3fd427dc74723b6326c6dac7576e2f57894 # PR 43 head, bump to the released tag
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}

      - uses: truvity/ci-actions/fleet-discover@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        id: discover
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          estate: ${{ inputs.estate }}
          filter: ${{ inputs.filter }}
          repositories: ${{ steps.enrolled.outputs.names }}
          require-check: ${{ inputs.require-check && 'true' || 'false' }}

      # Which of those consume the source, and are not already current. One
      # tree read per repository, one file read per PklProject. A repository
      # that cannot be read, or has a PklProject but no devbox.json to run
      # its recipes in, is an error annotation and is left out; the rest
      # still run.
      - name: Find the consumers that need a bump
        id: consumers
        if: steps.discover.outputs.count != '0'
        env:
          REPOS: ${{ steps.discover.outputs.repositories }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ steps.target.outputs.version }}
          TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          API: ${{ github.api_url }}
        run: |
          # >>> consumers (hack/pkl-fleet-cases.sh runs this block)
          set -euo pipefail
          api() {
            curl -fsS --max-time 60 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: ${ACCEPT:-application/vnd.github+json}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          src_re=${SOURCE//./\\.}
          find_re="(project)?package://github\.com/${src_re}/releases/download/[^\"' #]*"
          out='[]'
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            if ! base=$(api "$API/repos/$repo" | jq -r '.default_branch') || [ -z "$base" ] || [ "$base" = null ]; then
              echo "::error::$repo: could not read the repository"; continue
            fi
            if ! tree=$(api "$API/repos/$repo/git/trees/$base?recursive=1"); then
              echo "::error::$repo: could not read the tree of $base"; continue
            fi
            if [ "$(jq -r '.truncated' <<<"$tree")" = true ]; then
              echo "::warning::$repo: the tree of $base is truncated; a PklProject may be missed"
            fi
            mapfile -t projects < <(jq -r '.tree[] | select(.type == "blob") | .path | select(test("(^|/)PklProject$"))' <<<"$tree")
            if [ "${#projects[@]}" -eq 0 ]; then
              echo "$repo: no PklProject"; continue
            fi
            uses=0; stale=0; unread=0
            for p in "${projects[@]}"; do
              enc=$(jq -rn --arg p "$p" '$p | split("/") | map(@uri) | join("/")')
              if ! body=$(ACCEPT=application/vnd.github.raw+json api "$API/repos/$repo/contents/$enc?ref=$base"); then
                echo "::error::$repo: could not read $p"; unread=1; break
              fi
              while IFS= read -r uri; do
                [ -n "$uri" ] || continue
                uses=$((uses + 1))
                [[ $uri == */v$VERSION/* ]] || stale=$((stale + 1))
              done < <(grep -oE "$find_re" <<<"$body" || true)
            done
            [ "$unread" = 0 ] || continue
            if [ "$uses" -eq 0 ]; then
              echo "$repo: PklProject files do not depend on $SOURCE"; continue
            fi
            if [ "$stale" -eq 0 ]; then
              echo "$repo: already at v$VERSION"; continue
            fi
            if ! jq -e '.tree[] | select(.path == "devbox.json")' <<<"$tree" >/dev/null; then
              echo "::error::$repo: depends on $SOURCE but has no devbox.json to run its recipes in"; continue
            fi
            echo "$repo: $stale of $uses dependency URIs to move"
            out=$(jq -c --arg r "$repo" '. + [$r]' <<<"$out")
          done < <(jq -r '.[]' <<<"$REPOS")
          echo "repositories=$out" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$out")" >> "$GITHUB_OUTPUT"
          # <<< consumers

  bump:
    needs: discover
    if: needs.discover.outputs.count != '' && needs.discover.outputs.count != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # token-source access-roster
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    name: ${{ matrix.repository }}
    steps:
      - name: Name the repository
        id: name
        env:
          REPO: ${{ matrix.repository }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      # A token for THIS repository only: the job holds no more reach than
      # the one repository it updates.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.name.outputs.name }}
          permission-contents: ${{ inputs.dry-run && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.dry-run && 'read' || 'write' }}

      # Push one branch, open and auto-merge one pull request: contents and
      # pull_requests, on this repository. A dry run only reads.
      - uses: truvity/ci-actions/token-exchange@30eef3fd427dc74723b6326c6dac7576e2f57894 # PR 43 head, bump to the released tag
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          repositories: ${{ steps.name.outputs.name }}
          permissions: ${{ inputs.dry-run && 'contents:read' || 'contents:write, pull_requests:write' }}

      - name: Resolve the commit author
        id: author
        if: ${{ !inputs.dry-run }}
        env:
          TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          USER_LOGIN: ${{ inputs.git-user }}
          EMAIL: ${{ inputs.git-email }}
          API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [ -z "$EMAIL" ]; then
            id=$(curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/users/$(jq -rn --arg u "$USER_LOGIN" '$u | @uri')" | jq -r '.id')
            EMAIL="$id+$USER_LOGIN@users.noreply.github.com"
          fi
          echo "git-email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "commits as $USER_LOGIN <$EMAIL>"

      - name: Read the default branch
        id: repo
        env:
          TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          REPO: ${{ matrix.repository }}
          API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          base=$(curl -fsS --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API/repos/$REPO" | jq -r '.default_branch')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "$REPO: default branch $base"

      # No credentials left in the checkout: the consumer's recipes run in
      # it, and must not be able to read the token. The push below
      # presents it by itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ steps.repo.outputs.base }}
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          persist-credentials: false

      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          proto: "false"
          # The job's own read-only token (API rate limits), never the App's:
          # setup-devbox reads the consumer's tool config, and a token that
          # can push to the consumer has no business there.
          github-token: ${{ github.token }}

      - name: Rewrite the dependency URIs
        id: rewrite
        env:
          TARGET: ${{ needs.discover.outputs.version }}
          SOURCE: ${{ inputs.source }}
          DIRS_FILE: ${{ runner.temp }}/pkl-projects.txt
        run: |
          # >>> rewrite (hack/pkl-fleet-cases.sh runs this block)
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ver_re='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
          [[ $TARGET =~ ^${ver_re}$ ]] || fail "target '$TARGET' is not a version (X.Y.Z, optionally -prerelease)"
          [[ $SOURCE =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "source '$SOURCE' is not owner/name"
          src_re=${SOURCE//./\\.}
          find_re="(project)?package://github\.com/${src_re}/releases/download/[^\"' #]*"
          uri_re="^(project)?package://github\.com/${src_re}/releases/download/v(${ver_re})/([A-Za-z0-9._-]+)@(${ver_re}|[0-9]+)\$"
          tcore=${TARGET%%-*}
          tmaj=${TARGET%%.*}
          tmin=${TARGET#*.}; tmin=${tmin%%.*}

          mapfile -t projects < <(git ls-files | awk -F/ '$NF == "PklProject"')
          [ "${#projects[@]}" -gt 0 ] || fail "no PklProject in this repository"

          # Pass one reads every file and refuses on any URI it cannot say
          # what to do with, before a single byte is written.
          bad=0
          declare -A stale=() olds=() dirs=()
          for p in "${projects[@]}"; do
            d=$(dirname "$p")
            for f in "$p" "$d/PklProject.deps.json"; do
              [ -f "$f" ] || continue
              while IFS=: read -r n uri; do
                if ! [[ $uri =~ $uri_re ]]; then
                  echo "::error file=$f,line=$n::'$uri' is a dependency into $SOURCE but not of the shape v<version>/<name>@<version> — refusing to guess"
                  bad=1; continue
                fi
                tag=${BASH_REMATCH[2]}; at=${BASH_REMATCH[5]}
                if [[ $at == *.* ]]; then
                  [ "$at" = "$tag" ] || { echo "::error file=$f,line=$n::'$uri' names release v$tag but package version $at"; bad=1; continue; }
                else
                  [ "$at" = "${tag%%.*}" ] || { echo "::error file=$f,line=$n::'$uri' has major $at but release v$tag"; bad=1; continue; }
                fi
                core=${tag%%-*}
                if [ "$core" != "$tcore" ] && [ "$(printf '%s\n%s\n' "$core" "$tcore" | sort -V | tail -n 1)" = "$core" ]; then
                  echo "::error file=$f,line=$n::v$tag is newer than the target v$TARGET — refusing to downgrade"
                  bad=1; continue
                fi
                if [ "$tag" != "$TARGET" ]; then
                  stale["$f"]=1; olds["$tag"]=1; dirs["$d"]=1
                fi
              done < <(grep -noE "$find_re" "$f" || true)
            done
          done
          [ "$bad" = 0 ] || exit 1

          if [ "${#stale[@]}" -eq 0 ]; then
            echo "already at v$TARGET — nothing to rewrite"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            : > "$DIRS_FILE"
            exit 0
          fi

          # `#` as the delimiter: it cannot be in SOURCE or in a version.
          # The full `@<version>` form first (PklProject, and the
          # `projectpackage://` values of deps.json), then the major-only
          # `@<major>` keys of deps.json, which only a different major moves.
          pre="(package://github\.com/${src_re}/releases/download/)"
          for f in "${!stale[@]}"; do
            sed -E -i \
              -e "s#${pre}v${ver_re}/([A-Za-z0-9._-]+)@${ver_re}#\1v${TARGET}/\3@${TARGET}#g" \
              -e "s#${pre}v${ver_re}/([A-Za-z0-9._-]+)@[0-9]+([\"' #]|\$)#\1v${TARGET}/\3@${tmaj}\4#g" \
              "$f"
          done
          printf '%s\n' "${!dirs[@]}" | LC_ALL=C sort > "$DIRS_FILE"

          breaking=false
          [[ $TARGET == *-* ]] && breaking=true
          for old in "${!olds[@]}"; do
            omaj=${old%%.*}; omin=${old#*.}; omin=${omin%%.*}
            if [ "$omaj" != "$tmaj" ]; then breaking=true
            elif [ "$omaj" = 0 ] && [ "$omin" != "$tmin" ]; then breaking=true; fi
          done
          from=$(printf '%s\n' "${!olds[@]}" | sort -V | paste -sd, -)
          {
            echo "changed=true"
            echo "breaking=$breaking"
            echo "from=$from"
          } >> "$GITHUB_OUTPUT"
          echo "moved $(wc -l < "$DIRS_FILE" | tr -d ' ') project(s) from v${from//,/, v} to v$TARGET (breaking: $breaking)"
          # <<< rewrite

      # Inside the consumer's devbox, so it is the consumer's Pkl, `just`
      # and generators. A failed resolve or generate fails the job and
      # pushes nothing.
      - name: Resolve and regenerate
        if: steps.rewrite.outputs.changed == 'true'
        env:
          DIRS_FILE: ${{ runner.temp }}/pkl-projects.txt
          PKL_COMMAND: ${{ inputs.pkl-command }}
        run: |
          # >>> resolve (hack/pkl-fleet-cases.sh runs this block)
          set -euo pipefail
          inbox() { devbox run -- "$@"; }
          recipes=$(inbox just --summary 2>/dev/null || true)
          has() { [[ " $recipes " == *" $1 "* ]]; }
          if has resolve; then
            echo "resolving with the repository's resolve recipe"
            inbox just resolve
          else
            read -ra pkl <<<"$PKL_COMMAND"
            while IFS= read -r d; do
              [ -n "$d" ] || continue
              echo "resolving $d with ${pkl[*]}"
              inbox "${pkl[@]}" project resolve "$d"
            done < "$DIRS_FILE"
          fi
          if has generate; then
            echo "regenerating with the repository's generate recipe"
            inbox just generate
          fi
          # <<< resolve

      - name: Open or update the pull request
        id: pr
        if: steps.rewrite.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          REPO: ${{ matrix.repository }}
          BASE: ${{ steps.repo.outputs.base }}
          API: ${{ github.api_url }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ needs.discover.outputs.version }}
          FROM: ${{ steps.rewrite.outputs.from }}
          BREAKING: ${{ steps.rewrite.outputs.breaking }}
          DIRS_FILE: ${{ runner.temp }}/pkl-projects.txt
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
          DRY_RUN: ${{ inputs.dry-run }}
          AUTO_MERGE: ${{ inputs.auto-merge && inputs.require-check }}
          GIT_USER: ${{ inputs.git-user }}
          GIT_EMAIL: ${{ steps.author.outputs.git-email }}
        run: |
          # >>> publish (hack/pkl-fleet-cases.sh runs this block)
          set -euo pipefail
          api() {
            curl -fsS --max-time 60 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          name=${SOURCE#*/}
          branch="${BRANCH_PREFIX}${VERSION}"

          if [ -z "$(git status --porcelain)" ]; then
            echo "the tree is unchanged — nothing to propose"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: would push $branch and open a pull request with:"
            git status --short
            git diff --stat
            echo "- $REPO: dry run, ${FROM:-?} -> $VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The token is presented to git for these commands only, through
          # the environment: it is in no config file and no argument.
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          gitx() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" git "$@"
          }

          title="chore(deps): update $name to v$VERSION"
          git checkout -q -B "$branch"
          git add -A
          git -c user.name="$GIT_USER" -c user.email="$GIT_EMAIL" commit -q \
            -m "$title" -m "Moves the dependencies on $SOURCE from v${FROM//,/, v} to v$VERSION, resolves PklProject.deps.json and regenerates what the repository generates."

          # Push only when the content differs from the branch already
          # there, so a poll that finds an open pull request does not force
          # a new commit under it, and its checks, every hour.
          if gitx fetch -q --depth=1 origin "refs/heads/$branch" 2>/dev/null \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "$branch already holds exactly this change — not pushed again"
          else
            gitx push -q --force origin "HEAD:refs/heads/$branch"
          fi

          label() { # <name> <colour> <description>
            api -X POST "$API/repos/$REPO/labels" \
              -d "$(jq -nc --arg n "$1" --arg c "$2" --arg d "$3" '{name: $n, color: $c, description: $d}')" \
              >/dev/null 2>&1 || true   # 422: it exists
          }
          labels='["dependencies"]'
          label dependencies 0366d6 "Dependency updates"
          if [ "$BREAKING" = true ]; then
            labels='["dependencies","major"]'
            label major b60205 "Major version update"
          fi

          body="Moves the Pkl contracts packages ($SOURCE) from v${FROM//,/, v} to **v$VERSION** in:"$'\n\n'
          while IFS= read -r d; do [ -n "$d" ] && body+="- \`$d\`"$'\n'; done < "$DIRS_FILE"
          body+=$'\n'"\`PklProject.deps.json\` is resolved again, and the repository's \`generate\` recipe has run where it has one, so committed generated files follow the new contract."$'\n\n'
          body+="Release notes: https://github.com/$SOURCE/releases/tag/v$VERSION"$'\n\n'
          if [ "$BREAKING" = true ]; then
            body+="This bump is **breaking** (a new major, or a new minor below 1.0): it is not auto-merged. Read the release notes' breaking entries, fix what they name, and merge by hand."
          elif [ "$AUTO_MERGE" = true ]; then
            body+="Not breaking: auto-merge is armed and GitHub still holds the merge until every required check passes."
          else
            body+="Not breaking, but auto-merge is not armed on this run: merge when the checks are green."
          fi
          body+=$'\n\n'"Opened by the fleet's pkl job."

          owner=${REPO%/*}
          existing=$(api "$API/repos/$REPO/pulls?state=open&head=$owner:$branch&per_page=100" | jq -c '.[0] // empty')
          if [ -n "$existing" ]; then
            number=$(jq -r '.number' <<<"$existing")
            api -X PATCH "$API/repos/$REPO/pulls/$number" \
              -d "$(jq -nc --arg t "$title" --arg b "$body" '{title: $t, body: $b}')" >/dev/null
            pr=$existing
            echo "pull request #$number for $branch updated"
          else
            pr=$(api -X POST "$API/repos/$REPO/pulls" \
              -d "$(jq -nc --arg t "$title" --arg b "$body" --arg h "$branch" --arg base "$BASE" \
                    '{title: $t, body: $b, head: $h, base: $base}')")
            echo "pull request opened: $(jq -r '.html_url' <<<"$pr")"
          fi
          number=$(jq -r '.number' <<<"$pr")
          url=$(jq -r '.html_url' <<<"$pr")
          api -X POST "$API/repos/$REPO/issues/$number/labels" -d "$(jq -nc --argjson l "$labels" '{labels: $l}')" >/dev/null

          # Auto-merge only where there is a green to wait for, and never
          # for a breaking bump. A refusal (auto-merge off in the
          # repository's settings) leaves the pull request for a human.
          if [ "$BREAKING" != true ] && [ "$AUTO_MERGE" = true ]; then
            # shellcheck disable=SC2016  # $id is a GraphQL variable
            res=$(jq -nc --arg id "$(jq -r '.node_id' <<<"$pr")" \
              '{query: "mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:REBASE}){clientMutationId}}", variables: {id: $id}}' \
              | api -X POST "$API/graphql" -d @-)
            if jq -e '.errors' <<<"$res" >/dev/null; then
              echo "::warning::$REPO#$number: auto-merge could not be armed: $(jq -c '.errors[0].message' <<<"$res")"
            else
              echo "auto-merge armed on #$number"
            fi
          else
            echo "auto-merge not armed on #$number"
          fi

          # An open pull request for an older version of the same library
          # is superseded by this one.
          while read -r old oldref; do
            [ -n "$old" ] || continue
            api -X POST "$API/repos/$REPO/issues/$old/comments" \
              -d "$(jq -nc --arg b "Superseded by #$number (v$VERSION)." '{body: $b}')" >/dev/null
            api -X PATCH "$API/repos/$REPO/pulls/$old" -d '{"state":"closed"}' >/dev/null
            api -X DELETE "$API/repos/$REPO/git/refs/heads/$oldref" >/dev/null || true
            echo "closed #$old ($oldref), superseded"
          done < <(api "$API/repos/$REPO/pulls?state=open&per_page=100" \
            | jq -r --arg p "$BRANCH_PREFIX" --arg b "$branch" --arg r "$REPO" \
                '.[] | select(.head.repo.full_name == $r and (.head.ref | startswith($p)) and .head.ref != $b) | "\(.number) \(.head.ref)"')

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- $REPO: $url" >> "$GITHUB_STEP_SUMMARY"
          # <<< publish
