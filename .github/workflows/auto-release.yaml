# The last mile of the automatic chain, shared: when
# renovate's automerged bumps have moved master past the latest
# release, cut the next patch tag — which the repo's Release workflow
# turns into artifacts, and a consumer's renovate turns into a pin PR.
#
# The CALLER carries the policy:
#
#   on:
#     schedule:
#       - cron: "23 5 * * 1"   # STAGGER per repo — six repos tagging in
#     workflow_dispatch:        # the same minute means six downstream pin
#     push:                     # PRs racing each other
#       branches: [master]      # security lane: see below
#   permissions:
#     contents: read
#
# The push trigger carries two IMMEDIATE lanes; everything else exits
# quietly and waits for the weekly batch:
#
#   security  renovate labels vulnerability-alert PRs `security` and
#             automerges them; a push whose merged PR carries that label
#             releases at once (2026-08-27).
#   fix       a push whose merged change is a hand-written conventional
#             `fix:`, `fix(scope):` or `fix!:` releases at once. The PR
#             TITLE is the source of truth (a squash merge writes it, a
#             reviewer read it); a title with no conventional prefix
#             defers to the PR's commits, any one of which being a fix
#             releases (a rebase merge). Renovate PRs never take this
#             lane, so `fix(deps)` bumps batch. A revert titled
#             `Revert "fix: ..."` is not a fix and batches. The bump is
#             still one patch, `fix!` included.
#
# Callers without the push trigger simply keep the weekly-only behavior.
#
# TOKENS come from one of two sources (`token-source`), the same two the
# fleet workflows take:
#
#   app-key        the caller holds the App's private key as a secret and
#                  the job mints with actions/create-github-app-token.
#                  For an estate with no issuer to exchange at.
#   access-roster  the caller holds no key. The job exchanges its own
#                  GitHub OIDC identity token at an access-roster issuer
#                  for an installation token of a catalogue App, narrowed
#                  to this repository, and the issuer's grants decide.
#                  Nothing to rotate, nothing to leak from the caller.
#
# `app-key` is the DEFAULT because it is the answer that needs no issuer,
# not because it is the better one. Naming the source explicitly is the
# point: a caller that falls into app-key by omission is one whose key
# nobody decided to keep. This estate names access-roster everywhere and
# has held no CI_AUTOMATION_PRIVATE_KEY since 2026-09-20.
#
#   jobs:
#     tag:
#       # DOUBLY GUARDED, off by default: the App credentials must be
#       # configured AND vars.AUTO_RELEASE must be "true" — flipping it
#       # is the deliberate policy act.
#       if: vars.AUTO_RELEASE == 'true' && vars.CI_AUTOMATION_APP_ID != ''
#       uses: truvity/ci-workflows/.github/workflows/auto-release.yaml@<sha> # vX.Y.Z
#       with:
#         app-id: ${{ vars.CI_AUTOMATION_APP_ID }}
#       secrets:
#         CI_AUTOMATION_PRIVATE_KEY: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY }}
#
# or, with no key anywhere:
#
#   permissions:
#     contents: read
#     id-token: write           # the exchange needs it
#   jobs:
#     tag:
#       if: vars.AUTO_RELEASE == 'true'
#       uses: truvity/ci-workflows/.github/workflows/auto-release.yaml@<sha> # vX.Y.Z
#       with:
#         token-source: access-roster
#         access-roster-issuer: https://access.example
#         github-app: ci-automation
#
# Secrets are passed explicitly, always: a caller in another organisation
# cannot inherit, and a same-org caller holds exactly what it passes.
#
# WHY TWO TAG JOBS, one per source, with the same steps twice: a job's
# `permissions` are static, and a called workflow's job that asks for
# more than its caller granted FAILS THE RUN rather than getting less.
# One job declaring `id-token: write` would therefore break every caller
# still on `app-key` the moment renovate bumps its pin — a dozen
# repositories whose auto-release would go red on a schedule nobody
# watches. A SKIPPED job asks for nothing, so the source that needs the
# permission carries it and the source that does not is untouched. The
# duplication is the price of that; keep the two step lists identical.
#
# THE CHANGELOG HEADING. A patch cut while the changelog still says
# `## Unreleased` ships changes under a heading that names no version, and
# a consumer reading the pin bump cannot find what they are moving to. So
# before it tags vX.Y.Z the job writes the heading itself:
#
#   - a first `## Unreleased` with entries becomes `## vX.Y.Z` (with
#     ` — YYYY-MM-DD`, UTC, only if the newest version heading carries a
#     date);
#   - with nothing under Unreleased (a dependency-only patch) nothing is
#     written, because the policy checker's C5 asks no heading of an
#     automatic patch on a line a hand-cut vX.Y.0 already announced —
#     UNLESS the repository's newest patch tag has its own heading, which
#     shows it keeps one per tag; then `## vX.Y.Z` with "Dependency
#     updates." is added (`changelog-heading: always` forces it);
#   - a `## vX.Y.Z` heading already there is never rewritten, so a re-run
#     changes nothing.
#
# The default branch is protected (a pull request and its required checks)
# and the estate gives this App no branch bypass, so the heading goes in as
# a pull request: the job pushes `auto-release/changelog-vX.Y.Z`, opens the
# PR, arms auto-merge, waits for it, and tags the MERGED commit — the tag
# names the commit that carries its own heading. A run that times out
# (slow checks, or a ruleset that wants an approval) fails red with no tag
# and the PR left open; the next run resumes that PR. While a PR titled
# `docs(changelog): heading for the vX.Y.0 release` is open the job stands
# aside entirely: a person is preparing that heading and the two would race
# over the same line. Needs the repository's auto-merge setting on and the
# App's `pull_requests: write` (the access-roster grant must name it).
# `changelog-heading: never` opts out and restores the old behaviour.
#
# THE VERSION BUMP. A repository that declares its version in files (a Pkl
# package, a manifest) cannot be tagged from master as it stands: the
# tag would name a commit whose files declare the previous version.
# `version-bump-command` closes that: a shell command run in the caller's
# checkout, inside devbox (set up only when the input is set), with
# `VERSION` (X.Y.Z, no prefix) and `TAG` (vX.Y.Z) in its environment. It
# runs after the heading is written and before the commit, so the heading
# PR carries the bump and the tag names the merge commit that has both.
#
#   - it must change something, or the run fails: a bump that bumps
#     nothing is a misconfiguration;
#   - a resumed open heading PR is trusted as it stands, not re-bumped;
#   - a heading that already exists was written by a person, whose own
#     release PR carried the bump, so the tag is cut as it stands. (If
#     they forgot, the repo's release workflow refuses a tag that is not
#     the declared version, loudly);
#   - with a bump set, a dependency-only patch gets its heading PR too
#     (the bump needs a PR to ride in), whatever the heading convention;
#   - `changelog-heading: never` is refused: the bump cannot land without
#     a pull request.
#
# A Pkl repository whose version is `version = "X.Y.Z"` in
# packages/Release.pkl and whose PklProject.deps.json files `just resolve`
# refreshes:
#
#   with:
#     version-bump-command: >-
#       sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packages/Release.pkl
#       && just resolve
#
# Two estate-side prerequisites per adopting repo, or the tag push is
# rejected / the secrets arrive empty:
#   - the repo's v* tag ruleset carries the App that cuts the tag as a
#     bypass actor (github-structure's `bypass_apps`,
#     github-structure >= v0.2.0). The two sources are two DIFFERENT
#     Apps with different ids, so a repository switching source needs
#     the new App's id there first.
#   - `app-key`: CI_AUTOMATION_APP_ID (org var) and
#     CI_AUTOMATION_PRIVATE_KEY (org secret) are entitlement-scoped to
#     the repo. `access-roster`: the issuer grants this
#     repository's auto-release job a token of `github-app`.
name: auto-release

on:
  workflow_call:
    inputs:
      token-source:
        description: >-
          Where the token comes from: `app-key` (the App key passed as
          the CI_AUTOMATION_PRIVATE_KEY secret, with `app-id`) or
          `access-roster` (an installation token exchanged at
          `access-roster-issuer` for the job's GitHub OIDC token, with
          `github-app`).
        required: false
        type: string
        default: app-key
      app-id:
        description: GitHub App id that cuts the tag (from the caller's vars). Required when token-source is `app-key`.
        required: false
        type: string
        default: ""
      access-roster-issuer:
        description: The access-roster issuer URL. Required when token-source is `access-roster`.
        required: false
        type: string
        default: ""
      github-app:
        description: >-
          The tagging App's catalogue id at the issuer. Required when
          token-source is `access-roster`.
        required: false
        type: string
        default: ""
      tag-prefix:
        description: >-
          Release tag prefix; the newest tag matching <prefix>* is
          patch-incremented. The default suits the estate's bare-semver
          `v` scheme.
        required: false
        type: string
        default: v
      changelog-heading:
        description: >-
          Whether the workflow writes the CHANGELOG heading before it
          tags. `auto` (default): rename a first `## Unreleased` that
          has entries to `## vX.Y.Z`, and give a dependency-only patch a
          `## vX.Y.Z` heading ("Dependency updates.") only where the
          newest patch tag has its own heading. `always`: write the
          dependency-only heading whatever the history says. `never`:
          the old behaviour exactly — tag, touch nothing, ask the issuer
          for no pull-request write.
        required: false
        type: string
        default: auto
      changelog-path:
        description: The changelog file, relative to the repository root.
        required: false
        type: string
        default: CHANGELOG.md
      changelog-wait-minutes:
        description: >-
          How long to wait for the heading's pull request to merge before
          the run fails red and leaves it for the next run to resume. Keep
          it well under the job's 45 minute limit.
        required: false
        type: string
        default: "20"
      version-bump-command:
        description: >-
          For a repository that declares its version in files: a shell
          command run in the caller's checkout, inside devbox, with
          `VERSION` (X.Y.Z, no prefix) and `TAG` (the tag, e.g. vX.Y.Z)
          in its environment. It runs after the CHANGELOG heading is
          written and before the commit, and every file it changes goes
          into the same heading commit and pull request, so the tagged
          merge commit carries both. It must change something, or the run
          fails. It is skipped when the pull request is resumed or the
          heading is already there (a person prepared that release), and
          it cannot be combined with `changelog-heading: never`. Empty
          (default): nothing runs and devbox is not set up.
        required: false
        type: string
        default: ""
    secrets:
      CI_AUTOMATION_PRIVATE_KEY:
        description: The App's private key. Required when token-source is `app-key`.
        required: false

permissions:
  contents: read

jobs:
  # Before either tag job, and outside both: a token-source neither job
  # matches would otherwise skip both and report success.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the token inputs
        uses: truvity/ci-actions/token-inputs@62eecede955676a2c0fb760dd185521528886d0b # v1.10.0
        with:
          source: ${{ inputs.token-source }}
          access-roster-issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          id: ${{ inputs.app-id }}
          id-name: app-id
          secret-name: CI_AUTOMATION_PRIVATE_KEY
          has-key: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY != '' }}
          warn-app-key-if: ${{ format('{0}{1}', inputs.access-roster-issuer, inputs.github-app) }}
          warn-app-key: access-roster-issuer and github-app are read only with token-source access-roster
          warn-access-roster-if: ${{ inputs.app-id }}
          warn-access-roster: app-id is read only with token-source app-key

  # ── token-source: app-key ────────────────────────────────────────────
  tag:
    needs: preflight
    if: inputs.token-source == 'app-key'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Queue, never cancel: two near-simultaneous security merges must
    # tag two DIFFERENT patch versions, so the second run has to see
    # the first one's tag rather than race it. The group is shared with
    # the access-roster job below — one repository, one tagger.
    concurrency:
      group: auto-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY }}

      # The release gate: a push releases only when the commit's merged
      # PR is `security`-labeled or a hand-written fix (see the header).
      # Rebase merges map every pushed commit to its PR, so the
      # association lookup holds across the estate's merge method.
      # Other pushes exit quietly here — the weekly schedule remains
      # their lane. The rules are the ci-actions `auto-release` action's, tested there.
      - name: Release security and fix pushes
        id: gate
        if: github.event_name == 'push'
        uses: truvity/ci-actions/auto-release@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          step: gate
          token: ${{ steps.token.outputs.token }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag list and the ancestry comparison both need history.
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # Only when the caller declares a version-bump-command: the bump runs in
      # the caller's devbox. No input, no extra setup.
      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        if: steps.gate.outputs.skip != 'true' && inputs.version-bump-command != ''
        with:
          github-token: ${{ github.token }}

      - name: Cut the next patch tag if master moved
        if: steps.gate.outputs.skip != 'true'
        uses: truvity/ci-actions/auto-release@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          step: tag
          token: ${{ steps.token.outputs.token }}
          repository: ${{ github.repository }}
          tag-prefix: ${{ inputs.tag-prefix }}
          bot: ${{ steps.token.outputs.app-slug }}
          base: ${{ github.event.repository.default_branch }}
          changelog-heading: ${{ inputs.changelog-heading }}
          changelog-path: ${{ inputs.changelog-path }}
          changelog-wait-minutes: ${{ inputs.changelog-wait-minutes }}
          version-bump-command: ${{ inputs.version-bump-command }}

  # ── token-source: access-roster ──────────────────────────────────────
  # The same steps, minting differently. See the note at the top of the
  # file for why this is a second job and not a second `if:`.
  tag-roster:
    needs: preflight
    if: inputs.token-source == 'access-roster'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # the exchange
    concurrency:
      group: auto-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Name this repository
        id: repo
        env:
          REPO: ${{ github.repository }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      # THIS repository only, and the permissions the steps below use:
      # `contents: write` pushes the tag and the heading branch,
      # `pull_requests: read` is what the release gate reads the merged
      # PR's labels, title and commits with, and `pull_requests: write`
      # (unless the caller said `changelog-heading: never`) opens and arms
      # the heading's pull request. The issuer's grant must name it too:
      # the grant is the ceiling, this input only narrows. The
      # installation reaches the organisation; this token reaches one
      # repository.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: token
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          repositories: ${{ steps.repo.outputs.name }}
          permissions: ${{ inputs.changelog-heading == 'never' && 'contents:write,pull_requests:read' || 'contents:write,pull_requests:write' }}

      - name: Release security and fix pushes
        id: gate
        if: github.event_name == 'push'
        uses: truvity/ci-actions/auto-release@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          step: gate
          token: ${{ steps.token.outputs.github-token }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.github-token }}

      # Only when the caller declares a version-bump-command: the bump runs in
      # the caller's devbox. No input, no extra setup.
      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        if: steps.gate.outputs.skip != 'true' && inputs.version-bump-command != ''
        with:
          github-token: ${{ github.token }}

      - name: Cut the next patch tag if master moved
        if: steps.gate.outputs.skip != 'true'
        uses: truvity/ci-actions/auto-release@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          step: tag
          token: ${{ steps.token.outputs.github-token }}
          repository: ${{ github.repository }}
          tag-prefix: ${{ inputs.tag-prefix }}
          bot: ${{ inputs.github-app }}
          base: ${{ github.event.repository.default_branch }}
          changelog-heading: ${{ inputs.changelog-heading }}
          changelog-path: ${{ inputs.changelog-path }}
          changelog-wait-minutes: ${{ inputs.changelog-wait-minutes }}
          version-bump-command: ${{ inputs.version-bump-command }}
