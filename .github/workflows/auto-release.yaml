# The last mile of the automatic chain, shared: when
# renovate's automerged bumps have moved master past the latest
# release, cut the next patch tag — which the repo's Release workflow
# turns into artifacts, and a consumer's renovate turns into a pin PR.
#
# The CALLER carries the policy:
#
#   on:
#     schedule:
#       - cron: "23 5 * * 1"   # STAGGER per repo — six repos tagging in
#     workflow_dispatch:        # the same minute means six downstream pin
#     push:                     # PRs racing each other
#       branches: [master]      # security lane: see below
#   permissions:
#     contents: read
#
# The push trigger carries two IMMEDIATE lanes; everything else exits
# quietly and waits for the weekly batch:
#
#   security  renovate labels vulnerability-alert PRs `security` and
#             automerges them; a push whose merged PR carries that label
#             releases at once (2026-08-27).
#   fix       a push whose merged change is a hand-written conventional
#             `fix:`, `fix(scope):` or `fix!:` releases at once. The PR
#             TITLE is the source of truth (a squash merge writes it, a
#             reviewer read it); a title with no conventional prefix
#             defers to the PR's commits, any one of which being a fix
#             releases (a rebase merge). Renovate PRs never take this
#             lane, so `fix(deps)` bumps batch. A revert titled
#             `Revert "fix: ..."` is not a fix and batches. The bump is
#             still one patch, `fix!` included.
#
# Callers without the push trigger simply keep the weekly-only behavior.
#
# TOKENS come from one of two sources (`token-source`), the same two the
# fleet workflows take:
#
#   app-key        the caller holds the App's private key as a secret and
#                  the job mints with actions/create-github-app-token.
#                  For an estate with no issuer to exchange at.
#   access-roster  the caller holds no key. The job exchanges its own
#                  GitHub OIDC identity token at an access-roster issuer
#                  for an installation token of a catalogue App, narrowed
#                  to this repository, and the issuer's grants decide.
#                  Nothing to rotate, nothing to leak from the caller.
#
# `app-key` is the DEFAULT because it is the answer that needs no issuer,
# not because it is the better one. Naming the source explicitly is the
# point: a caller that falls into app-key by omission is one whose key
# nobody decided to keep. This estate names access-roster everywhere and
# has held no CI_AUTOMATION_PRIVATE_KEY since 2026-09-20.
#
#   jobs:
#     tag:
#       # DOUBLY GUARDED, off by default: the App credentials must be
#       # configured AND vars.AUTO_RELEASE must be "true" — flipping it
#       # is the deliberate policy act.
#       if: vars.AUTO_RELEASE == 'true' && vars.CI_AUTOMATION_APP_ID != ''
#       uses: truvity/ci-workflows/.github/workflows/auto-release.yaml@<sha> # vX.Y.Z
#       with:
#         app-id: ${{ vars.CI_AUTOMATION_APP_ID }}
#       secrets:
#         CI_AUTOMATION_PRIVATE_KEY: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY }}
#
# or, with no key anywhere:
#
#   permissions:
#     contents: read
#     id-token: write           # the exchange needs it
#   jobs:
#     tag:
#       if: vars.AUTO_RELEASE == 'true'
#       uses: truvity/ci-workflows/.github/workflows/auto-release.yaml@<sha> # vX.Y.Z
#       with:
#         token-source: access-roster
#         access-roster-issuer: https://access.example
#         github-app: ci-automation
#
# Secrets are passed explicitly, always: a caller in another organisation
# cannot inherit, and a same-org caller holds exactly what it passes.
#
# WHY TWO TAG JOBS, one per source, with the same steps twice: a job's
# `permissions` are static, and a called workflow's job that asks for
# more than its caller granted FAILS THE RUN rather than getting less.
# One job declaring `id-token: write` would therefore break every caller
# still on `app-key` the moment renovate bumps its pin — a dozen
# repositories whose auto-release would go red on a schedule nobody
# watches. A SKIPPED job asks for nothing, so the source that needs the
# permission carries it and the source that does not is untouched. The
# duplication is the price of that; keep the two step lists identical.
#
# THE CHANGELOG HEADING. A patch cut while the changelog still says
# `## Unreleased` ships changes under a heading that names no version, and
# a consumer reading the pin bump cannot find what they are moving to. So
# before it tags vX.Y.Z the job writes the heading itself:
#
#   - a first `## Unreleased` with entries becomes `## vX.Y.Z` (with
#     ` — YYYY-MM-DD`, UTC, only if the newest version heading carries a
#     date);
#   - with nothing under Unreleased (a dependency-only patch) nothing is
#     written, because the policy checker's C5 asks no heading of an
#     automatic patch on a line a hand-cut vX.Y.0 already announced —
#     UNLESS the repository's newest patch tag has its own heading, which
#     shows it keeps one per tag; then `## vX.Y.Z` with "Dependency
#     updates." is added (`changelog-heading: always` forces it);
#   - a `## vX.Y.Z` heading already there is never rewritten, so a re-run
#     changes nothing.
#
# The default branch is protected (a pull request and its required checks)
# and the estate gives this App no branch bypass, so the heading goes in as
# a pull request: the job pushes `auto-release/changelog-vX.Y.Z`, opens the
# PR, arms auto-merge, waits for it, and tags the MERGED commit — the tag
# names the commit that carries its own heading. A run that times out
# (slow checks, or a ruleset that wants an approval) fails red with no tag
# and the PR left open; the next run resumes that PR. While a PR titled
# `docs(changelog): heading for the vX.Y.0 release` is open the job stands
# aside entirely: a person is preparing that heading and the two would race
# over the same line. Needs the repository's auto-merge setting on and the
# App's `pull_requests: write` (the access-roster grant must name it).
# `changelog-heading: never` opts out and restores the old behaviour.
#
# THE VERSION BUMP. A repository that declares its version in files (a Pkl
# package, a manifest) cannot be tagged from master as it stands: the
# tag would name a commit whose files declare the previous version.
# `version-bump-command` closes that: a shell command run in the caller's
# checkout, inside devbox (set up only when the input is set), with
# `VERSION` (X.Y.Z, no prefix) and `TAG` (vX.Y.Z) in its environment. It
# runs after the heading is written and before the commit, so the heading
# PR carries the bump and the tag names the merge commit that has both.
#
#   - it must change something, or the run fails: a bump that bumps
#     nothing is a misconfiguration;
#   - a resumed open heading PR is trusted as it stands, not re-bumped;
#   - a heading that already exists was written by a person, whose own
#     release PR carried the bump, so the tag is cut as it stands. (If
#     they forgot, the repo's release workflow refuses a tag that is not
#     the declared version, loudly);
#   - with a bump set, a dependency-only patch gets its heading PR too
#     (the bump needs a PR to ride in), whatever the heading convention;
#   - `changelog-heading: never` is refused: the bump cannot land without
#     a pull request.
#
# A Pkl repository whose version is `version = "X.Y.Z"` in
# packages/Release.pkl and whose PklProject.deps.json files `just resolve`
# refreshes:
#
#   with:
#     version-bump-command: >-
#       sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packages/Release.pkl
#       && just resolve
#
# Two estate-side prerequisites per adopting repo, or the tag push is
# rejected / the secrets arrive empty:
#   - the repo's v* tag ruleset carries the App that cuts the tag as a
#     bypass actor (github-structure's `bypass_apps`,
#     github-structure >= v0.2.0). The two sources are two DIFFERENT
#     Apps with different ids, so a repository switching source needs
#     the new App's id there first.
#   - `app-key`: CI_AUTOMATION_APP_ID (org var) and
#     CI_AUTOMATION_PRIVATE_KEY (org secret) are entitlement-scoped to
#     the repo. `access-roster`: the issuer grants this
#     repository's auto-release job a token of `github-app`.
name: auto-release

on:
  workflow_call:
    inputs:
      token-source:
        description: >-
          Where the token comes from: `app-key` (the App key passed as
          the CI_AUTOMATION_PRIVATE_KEY secret, with `app-id`) or
          `access-roster` (an installation token exchanged at
          `access-roster-issuer` for the job's GitHub OIDC token, with
          `github-app`).
        required: false
        type: string
        default: app-key
      app-id:
        description: GitHub App id that cuts the tag (from the caller's vars). Required when token-source is `app-key`.
        required: false
        type: string
        default: ""
      access-roster-issuer:
        description: The access-roster issuer URL. Required when token-source is `access-roster`.
        required: false
        type: string
        default: ""
      github-app:
        description: >-
          The tagging App's catalogue id at the issuer. Required when
          token-source is `access-roster`.
        required: false
        type: string
        default: ""
      tag-prefix:
        description: >-
          Release tag prefix; the newest tag matching <prefix>* is
          patch-incremented. The default suits the estate's bare-semver
          `v` scheme.
        required: false
        type: string
        default: v
      changelog-heading:
        description: >-
          Whether the workflow writes the CHANGELOG heading before it
          tags. `auto` (default): rename a first `## Unreleased` that
          has entries to `## vX.Y.Z`, and give a dependency-only patch a
          `## vX.Y.Z` heading ("Dependency updates.") only where the
          newest patch tag has its own heading. `always`: write the
          dependency-only heading whatever the history says. `never`:
          the old behaviour exactly — tag, touch nothing, ask the issuer
          for no pull-request write.
        required: false
        type: string
        default: auto
      changelog-path:
        description: The changelog file, relative to the repository root.
        required: false
        type: string
        default: CHANGELOG.md
      changelog-wait-minutes:
        description: >-
          How long to wait for the heading's pull request to merge before
          the run fails red and leaves it for the next run to resume. Keep
          it well under the job's 45 minute limit.
        required: false
        type: string
        default: "20"
      version-bump-command:
        description: >-
          For a repository that declares its version in files: a shell
          command run in the caller's checkout, inside devbox, with
          `VERSION` (X.Y.Z, no prefix) and `TAG` (the tag, e.g. vX.Y.Z)
          in its environment. It runs after the CHANGELOG heading is
          written and before the commit, and every file it changes goes
          into the same heading commit and pull request, so the tagged
          merge commit carries both. It must change something, or the run
          fails. It is skipped when the pull request is resumed or the
          heading is already there (a person prepared that release), and
          it cannot be combined with `changelog-heading: never`. Empty
          (default): nothing runs and devbox is not set up.
        required: false
        type: string
        default: ""
    secrets:
      CI_AUTOMATION_PRIVATE_KEY:
        description: The App's private key. Required when token-source is `app-key`.
        required: false

permissions:
  contents: read

jobs:
  # Before either tag job, and outside both: a token-source neither job
  # matches would otherwise skip both and report success.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the token inputs
        env:
          SOURCE: ${{ inputs.token-source }}
          APP_ID: ${{ inputs.app-id }}
          HAS_KEY: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY != '' }}
          ISSUER: ${{ inputs.access-roster-issuer }}
          APP: ${{ inputs.github-app }}
        run: |
          set -euo pipefail
          fail=0
          case "$SOURCE" in
            app-key)
              [ -n "$APP_ID" ] || { echo "::error::token-source app-key needs app-id"; fail=1; }
              [ "$HAS_KEY" = true ] || { echo "::error::token-source app-key needs the CI_AUTOMATION_PRIVATE_KEY secret"; fail=1; }
              if [ -n "$ISSUER$APP" ]; then
                echo "::warning::access-roster-issuer and github-app are read only with token-source access-roster"
              fi
              ;;
            access-roster)
              [ -n "$ISSUER" ] || { echo "::error::token-source access-roster needs access-roster-issuer"; fail=1; }
              [ -n "$APP" ] || { echo "::error::token-source access-roster needs github-app"; fail=1; }
              if [ -n "$APP_ID" ]; then
                echo "::warning::app-id is read only with token-source app-key"
              fi
              ;;
            *)
              echo "::error::token-source must be app-key or access-roster (got '$SOURCE')"; fail=1 ;;
          esac
          exit "$fail"

  # ── token-source: app-key ────────────────────────────────────────────
  tag:
    needs: preflight
    if: inputs.token-source == 'app-key'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Queue, never cancel: two near-simultaneous security merges must
    # tag two DIFFERENT patch versions, so the second run has to see
    # the first one's tag rather than race it. The group is shared with
    # the access-roster job below — one repository, one tagger.
    concurrency:
      group: auto-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY }}

      # The release gate: a push releases only when the commit's merged
      # PR is `security`-labeled or a hand-written fix (see the header).
      # Rebase merges map every pushed commit to its PR, so the
      # association lookup holds across the estate's merge method.
      # Other pushes exit quietly here — the weekly schedule remains
      # their lane. Both jobs' blocks are tested by hack/auto-release-cases.sh.
      - name: Release security and fix pushes
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Context reaches the script through env, never inline
          # interpolation into the shell text (CodeQL actions/code
          # injection — alerts 26/27; repository and sha are benign
          # here, but the hygiene is uniform on purpose).
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # >>> gate (hack/auto-release-cases.sh runs this block; keep both jobs identical)
          release() { echo "$1 — releasing outside the weekly batch" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          batch() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$1 — Monday's batch carries it" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          conv='^[A-Za-z]+(\([^)]*\))?!?: '
          fix='^fix(\([^)]*\))?!?: '
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls")
          n=$(jq 'length' <<<"$prs")
          if [ "$n" -gt 0 ]; then
            # Security lane, unchanged: any associated PR labelled `security`.
            if jq -e 'any(.[]; any(.labels[]; .name == "security"))' <<<"$prs" >/dev/null; then
              release "security-labeled merge"
            fi
            # Fix lane. For each associated PR that renovate did not open
            # (a Bot login containing "renovate", or the preset's
            # `dependencies` label): the PR TITLE is the source of truth,
            # since it is what a squash merge writes and what a reviewer
            # read. A conventional title decides alone, so a `feat:` title
            # over a fix commit batches. Only a title with no conventional
            # prefix defers to the PR's commits, any one of which being a
            # fix releases (rebase merges of several commits).
            while IFS=$'\t' read -r num title; do
              if [[ "$title" =~ $fix ]]; then
                release "fix merge (#$num)"
              elif [[ "$title" =~ $conv ]]; then
                continue
              fi
              subjects=$(gh api "repos/$REPO/pulls/$num/commits" --paginate \
                --jq '.[].commit.message | split("\n")[0]')
              while IFS= read -r subject; do
                if [[ "$subject" =~ $fix ]]; then
                  release "fix commit in unconventionally titled merge (#$num)"
                fi
              done <<<"$subjects"
            done < <(jq -r '.[]
              | select(((.user.type == "Bot" and (.user.login | test("renovate"; "i")))
                        or any(.labels[]; .name == "dependencies")) | not)
              | [.number, .title] | @tsv' <<<"$prs")
          else
            # No PR (direct push): the head commit's subject, same rules.
            head=$(gh api "repos/$REPO/commits/$SHA")
            subject=$(jq -r '.commit.message | split("\n")[0]' <<<"$head")
            if [[ "$subject" =~ $fix ]] \
               && ! jq -e '(.author.type == "Bot" and (.author.login | test("renovate"; "i")))' <<<"$head" >/dev/null; then
              release "fix commit pushed directly"
            fi
          fi
          batch "push without a security label or a hand-written fix"
          # <<< gate

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag list and the ancestry comparison both need history.
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # Only when the caller declares a version-bump-command: the bump runs in
      # the caller's devbox. No input, no extra setup.
      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        if: steps.gate.outputs.skip != 'true' && inputs.version-bump-command != ''
        with:
          github-token: ${{ github.token }}

      - name: Cut the next patch tag if master moved
        if: steps.gate.outputs.skip != 'true'
        env:
          PREFIX: ${{ inputs.tag-prefix }}
          BOT: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          HEADING_MODE: ${{ inputs.changelog-heading }}
          CHANGELOG: ${{ inputs.changelog-path }}
          WAIT_MINUTES: ${{ inputs.changelog-wait-minutes }}
          VERSION_BUMP_COMMAND: ${{ inputs.version-bump-command }}
        run: |
          set -euo pipefail
          # >>> tag (hack/auto-release-cases.sh runs this block; keep both jobs identical)
          summary() { echo "$*" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          CHANGELOG=${CHANGELOG:-CHANGELOG.md}
          HEADING_MODE=${HEADING_MODE:-auto}
          WAIT_MINUTES=${WAIT_MINUTES:-20}
          BASE=${BASE:-master}
          VERSION_BUMP_COMMAND=${VERSION_BUMP_COMMAND:-}

          # A bump lands in the heading's pull request, so it cannot land with
          # no pull request at all.
          if [ -n "$VERSION_BUMP_COMMAND" ] && [ "$HEADING_MODE" = never ]; then
            echo "::error::version-bump-command needs the heading pull request to carry the bump, so it cannot be combined with changelog-heading: never"
            exit 1
          fi

          LATEST=$(git tag --list "${PREFIX}*" --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            summary "no ${PREFIX}* releases yet — a human cuts the first one"
            exit 0
          fi
          if [ "$(git rev-parse "$LATEST^{commit}")" = "$(git rev-parse HEAD)" ]; then
            summary "master == $LATEST — nothing to release"
            exit 0
          fi
          NEXT=$(echo "$LATEST" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          git config user.name "${BOT}[bot]"
          git config user.email "${BOT}[bot]@users.noreply.github.com"

          # has_heading FILE TAG: a `## TAG` heading, bare or followed by a date.
          has_heading() { awk -v t="$2" '$1 == "##" && $2 == t { f = 1 } END { exit !f }' "$1"; }

          # ── The CHANGELOG heading, so the tag never ships under `## Unreleased` ──
          # TARGET is the commit the tag will name. It stays HEAD unless the heading
          # has to be written, in which case it becomes the commit that wrote it.
          TARGET=$(git rev-parse HEAD)
          edit=""
          if [ "$HEADING_MODE" != never ] && [ -f "$CHANGELOG" ]; then
            # A release PR a person is preparing: do not race it.
            waiting=$(gh pr list --repo "$REPO" --state open --limit 100 --json title \
              --jq '[.[] | select(.title | test("^docs\\(changelog\\): heading for the v[0-9]+\\.[0-9]+\\.0 release"))] | length')
            if [ "${waiting:-0}" != 0 ]; then
              summary "a changelog-heading PR for a minor or major release is open — leaving $NEXT to it"
              exit 0
            fi

            if has_heading "$CHANGELOG" "$NEXT"; then
              summary "$CHANGELOG already has a heading for $NEXT — tagging as it stands"
            else
              first=$(grep -m1 '^## ' "$CHANGELOG" || true)
              entries=$(awk '/^## /{ n++; next } n == 1 && NF && !/^#/ { c++ } END { print c + 0 }' "$CHANGELOG")
              if [[ $first != "## Unreleased"* ]] && grep -q '^## Unreleased' "$CHANGELOG"; then
                echo "::warning::$CHANGELOG has an Unreleased heading that is not the first — leaving it alone"
                HEADING_MODE=never
              elif [[ $first == "## Unreleased"* ]] && [ "$entries" -gt 0 ]; then
                edit=rename
              fi
            fi
          fi

          if [ "$HEADING_MODE" != never ] && [ -f "$CHANGELOG" ] && [ -z "$edit" ] && ! has_heading "$CHANGELOG" "$NEXT"; then
            # Nothing under Unreleased: a dependency-only patch. C5 exempts it when
            # the repo has not been writing patch headings; write one only where it
            # has (the newest patch tag has its heading) or the caller asked.
            patch=$(git tag --list "${PREFIX}*" --sort=-version:refname \
              | grep -E '^[^.]*[0-9]+\.[0-9]+\.[0-9]+$' | awk -F. '$3 + 0 > 0' | head -1 || true)
            if [ "$HEADING_MODE" = always ] || [ -n "$VERSION_BUMP_COMMAND" ] || { [ -n "$patch" ] && has_heading "$CHANGELOG" "$patch"; }; then
              edit=dependency
            else
              summary "no entries under Unreleased and no patch heading convention — $NEXT needs none (C5's automatic-patch case)"
            fi
          fi

          if [ -n "$edit" ]; then
            # The newest version heading says whether this repo dates its headings.
            newest=$(awk '$1 == "##" && $2 ~ /^v[0-9]/ { print; exit }' "$CHANGELOG")
            title="## $NEXT"
            dated=' — [0-9]{4}-[0-9]{2}-[0-9]{2}$'
            if [[ $newest =~ $dated ]]; then
              title="$title — $(date -u +%F)"
            fi
            tmp=$(mktemp)
            if [ "$edit" = rename ]; then
              awk -v h="$title" '!done && /^## Unreleased/ { print h; done = 1; next } { print }' "$CHANGELOG" > "$tmp"
            else
              awk -v h="$title" '
                !done && /^## / && !/^## Unreleased/ { print h; print ""; print "- Dependency updates."; print ""; done = 1 }
                { print }
                END { exit !done }' "$CHANGELOG" > "$tmp" || { summary "$CHANGELOG has no version heading to place $NEXT above — tagging as it stands"; edit=""; }
            fi
            if [ -n "$edit" ]; then
              cat "$tmp" > "$CHANGELOG"
            fi
            rm -f "$tmp"
          fi

          # With a bump configured, a tag no pull request prepared would name a
          # commit whose files still declare the old version. A heading already
          # there means a person prepared the release (bump included), so it is
          # tagged as it stands; anything else that leaves no pull request to
          # carry the bump is a configuration the run cannot honour.
          if [ -n "$VERSION_BUMP_COMMAND" ] && [ -z "$edit" ]; then
            if [ -f "$CHANGELOG" ] && has_heading "$CHANGELOG" "$NEXT"; then
              summary "version-bump-command skipped: $CHANGELOG already has the $NEXT heading, so a person prepared this release and the bump is theirs"
            else
              echo "::error::version-bump-command is set but no heading pull request can carry the bump ($CHANGELOG missing, misplaced, or without a version heading to place $NEXT above) — no tag cut"
              exit 1
            fi
          fi

          if [ -n "$edit" ]; then
            # Master is protected: the heading goes in by pull request, and the tag
            # waits for the merge so that it names the commit that carries it.
            BRANCH="auto-release/changelog-$NEXT"
            N=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$N" ]; then
              git checkout -q -- "$CHANGELOG"
              summary "resuming #$N, the heading PR an earlier run opened for $NEXT"
            else
              git checkout -q -b "$BRANCH"
              git add -- "$CHANGELOG"
              if [ -n "$VERSION_BUMP_COMMAND" ]; then
                # The caller's bump, in the caller's devbox, after the heading is
                # staged: whatever it changes beyond that is its own work. It rides
                # in this one commit, so the tagged merge commit carries both.
                VERSION=${NEXT#"$PREFIX"} TAG=$NEXT devbox run -- bash -e -o pipefail -c "$VERSION_BUMP_COMMAND"
                if [ -z "$(git diff --name-only; git ls-files --others --exclude-standard)" ]; then
                  echo "::error::version-bump-command changed nothing — a bump that bumps nothing is a misconfiguration; no PR opened, no tag cut"
                  exit 1
                fi
                git add -A
              fi
              git commit -q -m "docs(changelog): heading for the $NEXT release" \
                -m "Written by the shared auto-release workflow so that the tag names the commit that carries its own heading.${VERSION_BUMP_COMMAND:+ It also carries the version bump of the version-bump-command input.}"
              git push -q --force origin "$BRANCH"
              URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
                --title "docs(changelog): heading for the $NEXT release" \
                --body "The shared auto-release workflow is about to cut $NEXT. This gives the CHANGELOG its heading first, and the tag follows the merge, so a release never ships under \`## Unreleased\`.${VERSION_BUMP_COMMAND:+ The version-bump-command input ran in the same commit, so the tagged commit declares the version it is tagged as.}")
              N=${URL##*/}
              method=$(gh api "repos/$REPO" \
                --jq 'if .allow_rebase_merge then "rebase" elif .allow_squash_merge then "squash" else "merge" end')
              gh pr merge "$N" --repo "$REPO" --auto "--$method" \
                || gh pr merge "$N" --repo "$REPO" "--$method" \
                || { echo "::error::could not arm or perform the merge of #$N"; exit 1; }
              summary "opened #$N for the $NEXT heading and armed its merge"
            fi

            deadline=$((SECONDS + WAIT_MINUTES * 60))
            while :; do
              state=$(gh pr view "$N" --repo "$REPO" --json state --jq .state)
              [ "$state" != MERGED ] || break
              if [ "$state" = CLOSED ]; then
                echo "::error::#$N was closed without merging — no tag cut; the next run opens a fresh one"
                exit 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::#$N did not merge within ${WAIT_MINUTES} minutes (checks, or a review the ruleset wants) — no tag cut; the next run resumes it"
                exit 1
              fi
              sleep "${POLL_SECONDS:-30}"
            done
            TARGET=$(gh pr view "$N" --repo "$REPO" --json mergeCommit --jq .mergeCommit.oid)
            git fetch -q origin "$BASE"
            if ! git merge-base --is-ancestor "$TARGET" "origin/$BASE" \
               || ! git show "$TARGET:$CHANGELOG" | has_heading /dev/stdin "$NEXT"; then
              echo "::error::the merge commit $TARGET of #$N is not on $BASE with the $NEXT heading — no tag cut"
              exit 1
            fi
            git push -q origin --delete "$BRANCH" 2>/dev/null || true
          fi

          git tag -a "$NEXT" "$TARGET" -m "$NEXT — automatic release: master moved past $LATEST (renovate automerge)"
          git push origin "$NEXT"
          summary "released $NEXT"
          # <<< tag

  # ── token-source: access-roster ──────────────────────────────────────
  # The same steps, minting differently. See the note at the top of the
  # file for why this is a second job and not a second `if:`.
  tag-roster:
    needs: preflight
    if: inputs.token-source == 'access-roster'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # the exchange
    concurrency:
      group: auto-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Name this repository
        id: repo
        env:
          REPO: ${{ github.repository }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      # THIS repository only, and the permissions the steps below use:
      # `contents: write` pushes the tag and the heading branch,
      # `pull_requests: read` is what the release gate reads the merged
      # PR's labels, title and commits with, and `pull_requests: write`
      # (unless the caller said `changelog-heading: never`) opens and arms
      # the heading's pull request. The issuer's grant must name it too:
      # the grant is the ceiling, this input only narrows. The
      # installation reaches the organisation; this token reaches one
      # repository.
      - uses: truvity/access-roster@ee6588973567a514663b5ad559141c2313621fc3 # v1.39.1
        id: token
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          repositories: ${{ steps.repo.outputs.name }}
          permissions: ${{ inputs.changelog-heading == 'never' && 'contents:write,pull_requests:read' || 'contents:write,pull_requests:write' }}

      - name: Release security and fix pushes
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.token.outputs.github-token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # >>> gate (hack/auto-release-cases.sh runs this block; keep both jobs identical)
          release() { echo "$1 — releasing outside the weekly batch" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          batch() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$1 — Monday's batch carries it" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          conv='^[A-Za-z]+(\([^)]*\))?!?: '
          fix='^fix(\([^)]*\))?!?: '
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls")
          n=$(jq 'length' <<<"$prs")
          if [ "$n" -gt 0 ]; then
            # Security lane, unchanged: any associated PR labelled `security`.
            if jq -e 'any(.[]; any(.labels[]; .name == "security"))' <<<"$prs" >/dev/null; then
              release "security-labeled merge"
            fi
            # Fix lane. For each associated PR that renovate did not open
            # (a Bot login containing "renovate", or the preset's
            # `dependencies` label): the PR TITLE is the source of truth,
            # since it is what a squash merge writes and what a reviewer
            # read. A conventional title decides alone, so a `feat:` title
            # over a fix commit batches. Only a title with no conventional
            # prefix defers to the PR's commits, any one of which being a
            # fix releases (rebase merges of several commits).
            while IFS=$'\t' read -r num title; do
              if [[ "$title" =~ $fix ]]; then
                release "fix merge (#$num)"
              elif [[ "$title" =~ $conv ]]; then
                continue
              fi
              subjects=$(gh api "repos/$REPO/pulls/$num/commits" --paginate \
                --jq '.[].commit.message | split("\n")[0]')
              while IFS= read -r subject; do
                if [[ "$subject" =~ $fix ]]; then
                  release "fix commit in unconventionally titled merge (#$num)"
                fi
              done <<<"$subjects"
            done < <(jq -r '.[]
              | select(((.user.type == "Bot" and (.user.login | test("renovate"; "i")))
                        or any(.labels[]; .name == "dependencies")) | not)
              | [.number, .title] | @tsv' <<<"$prs")
          else
            # No PR (direct push): the head commit's subject, same rules.
            head=$(gh api "repos/$REPO/commits/$SHA")
            subject=$(jq -r '.commit.message | split("\n")[0]' <<<"$head")
            if [[ "$subject" =~ $fix ]] \
               && ! jq -e '(.author.type == "Bot" and (.author.login | test("renovate"; "i")))' <<<"$head" >/dev/null; then
              release "fix commit pushed directly"
            fi
          fi
          batch "push without a security label or a hand-written fix"
          # <<< gate

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.github-token }}

      # Only when the caller declares a version-bump-command: the bump runs in
      # the caller's devbox. No input, no extra setup.
      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        if: steps.gate.outputs.skip != 'true' && inputs.version-bump-command != ''
        with:
          github-token: ${{ github.token }}

      - name: Cut the next patch tag if master moved
        if: steps.gate.outputs.skip != 'true'
        env:
          PREFIX: ${{ inputs.tag-prefix }}
          # The catalogue id, which is the App's name at the issuer; the
          # App's login on GitHub may carry a suffix. It names the tagger
          # on an annotated tag and nothing else — GitHub attributes the
          # push to the App whose token pushed it.
          BOT: ${{ inputs.github-app }}
          GH_TOKEN: ${{ steps.token.outputs.github-token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          HEADING_MODE: ${{ inputs.changelog-heading }}
          CHANGELOG: ${{ inputs.changelog-path }}
          WAIT_MINUTES: ${{ inputs.changelog-wait-minutes }}
          VERSION_BUMP_COMMAND: ${{ inputs.version-bump-command }}
        run: |
          set -euo pipefail
          # >>> tag (hack/auto-release-cases.sh runs this block; keep both jobs identical)
          summary() { echo "$*" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          CHANGELOG=${CHANGELOG:-CHANGELOG.md}
          HEADING_MODE=${HEADING_MODE:-auto}
          WAIT_MINUTES=${WAIT_MINUTES:-20}
          BASE=${BASE:-master}
          VERSION_BUMP_COMMAND=${VERSION_BUMP_COMMAND:-}

          # A bump lands in the heading's pull request, so it cannot land with
          # no pull request at all.
          if [ -n "$VERSION_BUMP_COMMAND" ] && [ "$HEADING_MODE" = never ]; then
            echo "::error::version-bump-command needs the heading pull request to carry the bump, so it cannot be combined with changelog-heading: never"
            exit 1
          fi

          LATEST=$(git tag --list "${PREFIX}*" --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            summary "no ${PREFIX}* releases yet — a human cuts the first one"
            exit 0
          fi
          if [ "$(git rev-parse "$LATEST^{commit}")" = "$(git rev-parse HEAD)" ]; then
            summary "master == $LATEST — nothing to release"
            exit 0
          fi
          NEXT=$(echo "$LATEST" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          git config user.name "${BOT}[bot]"
          git config user.email "${BOT}[bot]@users.noreply.github.com"

          # has_heading FILE TAG: a `## TAG` heading, bare or followed by a date.
          has_heading() { awk -v t="$2" '$1 == "##" && $2 == t { f = 1 } END { exit !f }' "$1"; }

          # ── The CHANGELOG heading, so the tag never ships under `## Unreleased` ──
          # TARGET is the commit the tag will name. It stays HEAD unless the heading
          # has to be written, in which case it becomes the commit that wrote it.
          TARGET=$(git rev-parse HEAD)
          edit=""
          if [ "$HEADING_MODE" != never ] && [ -f "$CHANGELOG" ]; then
            # A release PR a person is preparing: do not race it.
            waiting=$(gh pr list --repo "$REPO" --state open --limit 100 --json title \
              --jq '[.[] | select(.title | test("^docs\\(changelog\\): heading for the v[0-9]+\\.[0-9]+\\.0 release"))] | length')
            if [ "${waiting:-0}" != 0 ]; then
              summary "a changelog-heading PR for a minor or major release is open — leaving $NEXT to it"
              exit 0
            fi

            if has_heading "$CHANGELOG" "$NEXT"; then
              summary "$CHANGELOG already has a heading for $NEXT — tagging as it stands"
            else
              first=$(grep -m1 '^## ' "$CHANGELOG" || true)
              entries=$(awk '/^## /{ n++; next } n == 1 && NF && !/^#/ { c++ } END { print c + 0 }' "$CHANGELOG")
              if [[ $first != "## Unreleased"* ]] && grep -q '^## Unreleased' "$CHANGELOG"; then
                echo "::warning::$CHANGELOG has an Unreleased heading that is not the first — leaving it alone"
                HEADING_MODE=never
              elif [[ $first == "## Unreleased"* ]] && [ "$entries" -gt 0 ]; then
                edit=rename
              fi
            fi
          fi

          if [ "$HEADING_MODE" != never ] && [ -f "$CHANGELOG" ] && [ -z "$edit" ] && ! has_heading "$CHANGELOG" "$NEXT"; then
            # Nothing under Unreleased: a dependency-only patch. C5 exempts it when
            # the repo has not been writing patch headings; write one only where it
            # has (the newest patch tag has its heading) or the caller asked.
            patch=$(git tag --list "${PREFIX}*" --sort=-version:refname \
              | grep -E '^[^.]*[0-9]+\.[0-9]+\.[0-9]+$' | awk -F. '$3 + 0 > 0' | head -1 || true)
            if [ "$HEADING_MODE" = always ] || [ -n "$VERSION_BUMP_COMMAND" ] || { [ -n "$patch" ] && has_heading "$CHANGELOG" "$patch"; }; then
              edit=dependency
            else
              summary "no entries under Unreleased and no patch heading convention — $NEXT needs none (C5's automatic-patch case)"
            fi
          fi

          if [ -n "$edit" ]; then
            # The newest version heading says whether this repo dates its headings.
            newest=$(awk '$1 == "##" && $2 ~ /^v[0-9]/ { print; exit }' "$CHANGELOG")
            title="## $NEXT"
            dated=' — [0-9]{4}-[0-9]{2}-[0-9]{2}$'
            if [[ $newest =~ $dated ]]; then
              title="$title — $(date -u +%F)"
            fi
            tmp=$(mktemp)
            if [ "$edit" = rename ]; then
              awk -v h="$title" '!done && /^## Unreleased/ { print h; done = 1; next } { print }' "$CHANGELOG" > "$tmp"
            else
              awk -v h="$title" '
                !done && /^## / && !/^## Unreleased/ { print h; print ""; print "- Dependency updates."; print ""; done = 1 }
                { print }
                END { exit !done }' "$CHANGELOG" > "$tmp" || { summary "$CHANGELOG has no version heading to place $NEXT above — tagging as it stands"; edit=""; }
            fi
            if [ -n "$edit" ]; then
              cat "$tmp" > "$CHANGELOG"
            fi
            rm -f "$tmp"
          fi

          # With a bump configured, a tag no pull request prepared would name a
          # commit whose files still declare the old version. A heading already
          # there means a person prepared the release (bump included), so it is
          # tagged as it stands; anything else that leaves no pull request to
          # carry the bump is a configuration the run cannot honour.
          if [ -n "$VERSION_BUMP_COMMAND" ] && [ -z "$edit" ]; then
            if [ -f "$CHANGELOG" ] && has_heading "$CHANGELOG" "$NEXT"; then
              summary "version-bump-command skipped: $CHANGELOG already has the $NEXT heading, so a person prepared this release and the bump is theirs"
            else
              echo "::error::version-bump-command is set but no heading pull request can carry the bump ($CHANGELOG missing, misplaced, or without a version heading to place $NEXT above) — no tag cut"
              exit 1
            fi
          fi

          if [ -n "$edit" ]; then
            # Master is protected: the heading goes in by pull request, and the tag
            # waits for the merge so that it names the commit that carries it.
            BRANCH="auto-release/changelog-$NEXT"
            N=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$N" ]; then
              git checkout -q -- "$CHANGELOG"
              summary "resuming #$N, the heading PR an earlier run opened for $NEXT"
            else
              git checkout -q -b "$BRANCH"
              git add -- "$CHANGELOG"
              if [ -n "$VERSION_BUMP_COMMAND" ]; then
                # The caller's bump, in the caller's devbox, after the heading is
                # staged: whatever it changes beyond that is its own work. It rides
                # in this one commit, so the tagged merge commit carries both.
                VERSION=${NEXT#"$PREFIX"} TAG=$NEXT devbox run -- bash -e -o pipefail -c "$VERSION_BUMP_COMMAND"
                if [ -z "$(git diff --name-only; git ls-files --others --exclude-standard)" ]; then
                  echo "::error::version-bump-command changed nothing — a bump that bumps nothing is a misconfiguration; no PR opened, no tag cut"
                  exit 1
                fi
                git add -A
              fi
              git commit -q -m "docs(changelog): heading for the $NEXT release" \
                -m "Written by the shared auto-release workflow so that the tag names the commit that carries its own heading.${VERSION_BUMP_COMMAND:+ It also carries the version bump of the version-bump-command input.}"
              git push -q --force origin "$BRANCH"
              URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
                --title "docs(changelog): heading for the $NEXT release" \
                --body "The shared auto-release workflow is about to cut $NEXT. This gives the CHANGELOG its heading first, and the tag follows the merge, so a release never ships under \`## Unreleased\`.${VERSION_BUMP_COMMAND:+ The version-bump-command input ran in the same commit, so the tagged commit declares the version it is tagged as.}")
              N=${URL##*/}
              method=$(gh api "repos/$REPO" \
                --jq 'if .allow_rebase_merge then "rebase" elif .allow_squash_merge then "squash" else "merge" end')
              gh pr merge "$N" --repo "$REPO" --auto "--$method" \
                || gh pr merge "$N" --repo "$REPO" "--$method" \
                || { echo "::error::could not arm or perform the merge of #$N"; exit 1; }
              summary "opened #$N for the $NEXT heading and armed its merge"
            fi

            deadline=$((SECONDS + WAIT_MINUTES * 60))
            while :; do
              state=$(gh pr view "$N" --repo "$REPO" --json state --jq .state)
              [ "$state" != MERGED ] || break
              if [ "$state" = CLOSED ]; then
                echo "::error::#$N was closed without merging — no tag cut; the next run opens a fresh one"
                exit 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::#$N did not merge within ${WAIT_MINUTES} minutes (checks, or a review the ruleset wants) — no tag cut; the next run resumes it"
                exit 1
              fi
              sleep "${POLL_SECONDS:-30}"
            done
            TARGET=$(gh pr view "$N" --repo "$REPO" --json mergeCommit --jq .mergeCommit.oid)
            git fetch -q origin "$BASE"
            if ! git merge-base --is-ancestor "$TARGET" "origin/$BASE" \
               || ! git show "$TARGET:$CHANGELOG" | has_heading /dev/stdin "$NEXT"; then
              echo "::error::the merge commit $TARGET of #$N is not on $BASE with the $NEXT heading — no tag cut"
              exit 1
            fi
            git push -q origin --delete "$BRANCH" 2>/dev/null || true
          fi

          git tag -a "$NEXT" "$TARGET" -m "$NEXT — automatic release: master moved past $LATEST (renovate automerge)"
          git push origin "$NEXT"
          summary "released $NEXT"
          # <<< tag
