# Tag-triggered release of a repository's Pkl packages as GitHub Release
# assets, for the PUBLIC estate.
#
# A Pkl package is not an OCI artifact: `package://github.com/<owner>/<repo>/
# releases/download/v<ver>/<name>@<ver>` resolves by an HTTPS GET of that
# path (the metadata) and then of the `.zip` beside it, so the release's
# assets ARE the registry, and their names (the `@` included) are part of the
# URI. This workflow builds them with the caller's own recipe, publishes them
# under their exact names, and then resolves them from github.com the way a
# consumer will.
#
# The caller carries the recipe and the version; this workflow carries the
# order of operations and the refusals.
#
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: read
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: truvity/ci-workflows/.github/workflows/release-pkl.yaml@<sha> # vX.Y.Z
#       with:
#         version-command: sed -n 's/^version = "\(.*\)"$/\1/p' packages/Release.pkl
#         pkl-command: bin/pkl
#         smoke-import: contracts.vocab#/Vocab.pkl
#
# THE ASSETS. The recipe (`package-recipe`, default `package`) writes them
# under `output-dir` (default `.out`), in that directory or any depth below
# it: `pkl project package --output-path '.out/%{name}@%{version}'` puts the
# four files of a package in a directory of their own. Every file under
# `output-dir` is uploaded, by its BASENAME, so two files with one basename
# are refused. Each asset that is not a `.sha256` needs a `<asset>.sha256`
# beside it holding that asset's checksum, and every name carries
# `@<version>`.
#
# THE VERSION. `version-command` is a shell command, run inside the caller's
# devbox, whose last line of stdout is the version the repository declares
# (`0.1.0`, no `v`). A command rather than a file path because the declared
# version lives in a Pkl module, a manifest, a Justfile variable: no file
# format is common to them, and every one is a one-line `sed`, `jq`, `just`
# or `pkl eval`. The tag must be `v` plus exactly that. Left empty (the
# default) nothing is declared and the tag is the only source: the version is
# the tag without its `v`; it must still look like a version, and the names
# of the assets must still carry it.
#
# RE-RUNS are safe, because a tag push is the only way in and a failed run is
# re-run, not retried by hand:
#   - no release for the tag: create it and upload everything;
#   - a release with SOME of the assets: upload the missing ones and go on.
#     The assets a package is made of are reproducible, so an asset that is
#     already there is compared to the local one by checksum;
#   - a release with an asset the build does not produce, or one of the same
#     name with different bytes: REFUSE. A published asset is what consumers
#     have pinned a checksum of; replacing it (`--clobber`) would break them
#     silently, and a half-different release is a decision for a person, who
#     deletes the release and re-runs, or cuts the next version.
# The smoke test runs every time, so a re-run after a failed smoke test
# re-checks the release as published.
#
# The release is published, not drafted: a package URI resolves only from a
# published release, and the smoke test must resolve the real URIs. If the
# smoke test fails the release stays up and the job is red; delete the
# release and the tag (nobody can have pinned a version that never resolved)
# or fix forward with the next version.
#
# The rules are the ci-actions `release-pkl` action's, tested there.
name: release-pkl

on:
  workflow_call:
    inputs:
      package-recipe:
        description: The `just` recipe that builds the packages into `output-dir`.
        required: false
        type: string
        default: package
      output-dir:
        description: >-
          Where the recipe writes the assets, relative to the repository
          root. Every file below it is released.
        required: false
        type: string
        default: .out
      version-command:
        description: >-
          A shell command, run in the caller's devbox from the repository
          root, whose last stdout line is the declared version without the
          `v`. The tag must equal `v` plus it. Empty (the default): nothing
          is declared and the version is the tag without its `v`.
        required: false
        type: string
        default: ""
      pkl-command:
        description: >-
          The Pkl executable for the smoke test, run in the caller's devbox
          (`pkl`, or `bin/pkl` where the repository pins its own).
        required: false
        type: string
        default: pkl
      smoke-import:
        description: >-
          Newline-separated `<package name>#/<module path>` entries, for
          example `contracts.vocab#/Vocab.pkl`. After the packages are
          resolved from github.com, each is imported by its published URI
          and evaluated. Empty (the default): the resolve alone, which
          already fetches every package's metadata and zip and checks the
          checksum the metadata records.
        required: false
        type: string
        default: ""
      changelog-path:
        description: The changelog file, relative to the repository root.
        required: false
        type: string
        default: CHANGELOG.md
      runner:
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        default: 20

# A reusable workflow can only NARROW what the caller granted, never widen
# it, so this is a floor and the caller must grant `contents: write`. It is
# the only permission: the release and its assets are all this writes.
permissions:
  contents: write

jobs:
  # A public repository runs on GitHub-hosted runners, always; see the same
  # job in release-public.yaml for why this hard-codes its own runner.
  runners:
    name: runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: truvity/ci-actions/public-runners@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          runners: ${{ inputs.runner }}
          visibility: ${{ github.event.repository.visibility }}

  release:
    needs: runners
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Queue, never cancel: cancelling mid-upload is how a release is left
    # with some of its assets. One group per ref, so two tags run side by
    # side and a re-run of one waits for the first.
    concurrency:
      group: release-pkl-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # What the repository says its version is. Empty `version-command`
      # declares nothing. Only the last line counts, so a tool that prints a
      # banner does not become part of the version; the next step judges the
      # value.
      - name: Read the declared version
        id: declared
        uses: truvity/ci-actions/release-pkl@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: declared
          version-command: ${{ inputs.version-command }}

      - name: Refuse a tag that is not the declared version, or has no changelog heading
        id: checks
        uses: truvity/ci-actions/release-pkl@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: checks
          ref-type: ${{ github.ref_type }}
          tag: ${{ github.ref_name }}
          declared: ${{ steps.declared.outputs.version }}
          changelog: ${{ inputs.changelog-path }}
          notes-file: ${{ runner.temp }}/release-notes.md

      - name: Build the packages
        env:
          RECIPE: ${{ inputs.package-recipe }}
        run: devbox run -- just "$RECIPE"

      - name: Check the assets
        id: assets
        uses: truvity/ci-actions/release-pkl@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: assets
          output-dir: ${{ inputs.output-dir }}
          version: ${{ steps.checks.outputs.version }}
          manifest: ${{ runner.temp }}/assets.txt

      - name: Publish the release
        uses: truvity/ci-actions/release-pkl@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: publish
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          version: ${{ steps.checks.outputs.version }}
          manifest: ${{ runner.temp }}/assets.txt
          notes-file: ${{ runner.temp }}/release-notes.md
          work: ${{ runner.temp }}/release-remote

      # The release is up; resolve it from github.com the way a consumer
      # will. A fresh cache, so nothing is answered locally. The URIs come
      # from the assets: every one named `<name>@<version>` with no suffix
      # is a package's metadata.
      - name: Smoke test the published packages
        uses: truvity/ci-actions/release-pkl@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: smoke
          pkl-command: devbox run -- ${{ inputs.pkl-command }}
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          version: ${{ steps.checks.outputs.version }}
          manifest: ${{ runner.temp }}/assets.txt
          smoke-import: ${{ inputs.smoke-import }}
          smoke-dir: ${{ runner.temp }}/release-smoke
