# Tag-triggered release for the PUBLIC estate: goreleaser, then any
# Helm charts, both to GHCR.
#
# "public" is in the name because the private half is a different
# workflow, not a flag on this one — ECR instead of GHCR, ARC runners
# instead of hosted, and a different identity to reach either. A repo
# publishing to ECR shares almost nothing with this but the word
# "release". That workflow arrives when it has a consumer; writing it
# now would ship untested release machinery, and release machinery can
# only be tested by a real tag.
#
# NO `secrets: inherit` is needed. Every public repo's release runs
# plain goreleaser (goreleaser-pro is release-private's) and pushes with
# the automatic GITHUB_TOKEN. The caller does need to grant the
# permissions below, because a reusable workflow cannot widen them.
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#         packages: write
#       uses: truvity/ci-workflows/.github/workflows/release-public.yaml@<sha>
#       with:
#         charts: '["github-roster"]'
#         nix-flakes: '["github-roster"]'
#
#   A repository whose chart lives inside the thing it deploys names the
#   directory rather than moving the chart out of it:
#
#         charts: '["url-shortener"]'
#         chart-root: examples/url-shortener/charts
#
#   A chart that is shared by several others, or that belongs to the
#   repository rather than to any one component, is named by its path from
#   the repository root. An entry with a `/` is that path, `chart-root` does
#   not apply to it, and the chart is published under its last element:
#
#         charts: '["url-shortener", "charts/service-lib"]'
#         chart-root: examples/url-shortener/charts
#
#   A web application's source maps are pushed after goreleaser, in the
#   same job, with the same `packages: write`:
#
#         sourcemaps-image: web
#         sourcemaps-dir: dist-sourcemaps
#         sourcemaps-app: url-shortener   # when the image is named `web`
name: release-public

on:
  workflow_call:
    inputs:
      charts:
        description: >-
          JSON array of charts to publish. A plain entry (`url-shortener`) is
          a chart directory name under `chart-root` (`charts/` by default),
          as it always was. An entry containing a `/`
          (`charts/service-lib`) is a path from the REPOSITORY ROOT:
          `chart-root` does not apply to it, which is how a chart that
          lives somewhere other than `chart-root` is published by the same
          call, under the same tag, as the ones that do. Either way the chart
          is packaged, pushed and named by the last element of its path, so
          two entries with the same last element are refused, as is a path
          that is absolute, contains `..`, `.` or an empty element, or whose
          name is not a lowercase chart name. Empty for binaries only
          (ocictl, pulumi-zitadel). More than one is normal —
          zitadel-operator ships its CRDs as a second chart.
        required: false
        type: string
        default: '[]'
      chart-root:
        description: >-
          The directory the plain `charts` names are relative to. An entry
          with a `/` is a repository-root path and ignores it.

          The default suits a repository whose charts are its own. A
          repository whose chart belongs to something INSIDE it — a worked
          example, a subproject — names that directory here, rather than
          moving the chart away from the component it deploys and leaving
          the two to be read in different places.
        required: false
        type: string
        default: charts
      chart-images:
        description: >-
          Where the charts' image values come from. `goreleaser` derives
          them from `dist/artifacts.json` — the digests of what GoReleaser
          just built and pushed in this same job — via
          `helmctl goreleaser-manifest`, and packages each chart from that.
          Empty (the default) packages from the tag, as before.

          This is what makes the ordering impossible to get wrong. A digest
          exists only once the image is built, so a release that packaged
          charts in an earlier job published them with their image values
          empty: it rendered, it pushed, the run was green, and the chart
          could not install. One job, and the charts are packaged from a
          file that does not exist until the images are pushed.

          The manifest describes the BUILD, so it names every image the
          run produced — but each chart is given only the ones it
          DECLARES, and a chart that declares no `images:` key of its own
          is given none. That matters for a repository publishing more
          than one chart, where an application ships beside the data
          resources it runs against: before helmctl 0.6.1 the second
          chart received the first one's images, and a values.schema.json
          with additionalProperties:false then refused every install of
          it, including one passing no values at all. It packaged, it
          pushed, the run was green, and the artifact was broken for
          everyone who pulled it.
        required: false
        type: string
        default: ""
      image-repo:
        description: >-
          Passed to GoReleaser as IMAGE_REPO, for a configuration whose
          image destination is templated. ONE destination per repository —
          public to ghcr, private to ECR — so that local, CI and release
          differ only in this value and never in what is built.
        required: false
        type: string
        default: ""
      require-image-digests:
        description: >-
          Refuse to package a chart unless every entry under its top-level
          `images:` map carries a digest.

          READ THIS BEFORE TURNING IT ON: the check looks for `images:`
          and nothing else. A chart that spells its images some other way
          has no entries to check, passes, and publishes mutable
          references under a flag that says otherwise — a guard that
          silently does not guard. Adopt the shape first, then set this.
        required: false
        type: boolean
        default: false
      chart-registry:
        required: false
        type: string
        default: oci://ghcr.io/truvity/charts
      chart-app-version:
        description: >-
          What to write as each chart's appVersion. Default "release"
          stamps the release version, which is right for a repo that
          ships the application it builds — chart and app move together.
          Use "chart" for charts packaging SOFTWARE WE DO NOT BUILD: it
          leaves each Chart.yaml's own appVersion intact, so the chart
          version can move for chart-only fixes while appVersion keeps
          recording the upstream release. Getting this wrong is silent
          at publish time and only breaks at `helm install`, because
          charts commonly default the image tag to .Chart.AppVersion.
        required: false
        type: string
        default: release
      nix-flakes:
        description: >-
          JSON array of goreleaser ARCHIVE ids to publish as Nix flakes,
          one release asset each: <id>_<version>_nix-flake.tar.gz. It is
          how a CLI reaches other repositories' devbox without nixpkgs:
          devbox.json names the asset URL with #<id>, and devbox.lock
          pins its hash. The flake fetches this release's own archives
          by sha256, so nothing is rebuilt and nothing needs updating
          between releases. Empty publishes none.
        required: false
        type: string
        default: '[]'
      sourcemaps-image:
        description: >-
          Push a web application's JavaScript source maps as an OCI
          artifact, with `smctl` (from truvity/ocictl), right after
          GoReleaser and in the same job. The value is the GoReleaser image
          to take the maps for: its repository, `registry/repository` or
          last path segment, as `smctl push --image` reads it from
          `dist/artifacts.json`. Empty (the default) turns the feature off.

          Same job, after the images are pushed, is the whole point: the
          version and the registry come from GoReleaser's dist/, so maps are
          pushed only for a version whose image was actually published, from
          the same build. A failed push fails the release. The artifact is
          `application/vnd.ocictl.sourcemaps.v1`, tagged with the release
          version, in `{registry}/{owner}/sourcemaps/{app}` (`{app}` is the
          image's last path segment); it is pushed with GITHUB_TOKEN, so the
          caller's `packages: write` is enough.

          The configuration must leave the maps in `sourcemaps-dir` and out
          of the image; see docs/sourcemaps.md in truvity/ocictl.
        required: false
        type: string
        default: ""
      sourcemaps-dir:
        description: >-
          The directory holding the `.map` files, searched recursively, as
          written by the GoReleaser configuration. Only used with
          `sourcemaps-image`. The push is refused if it holds no `.map`
          file.
        required: false
        type: string
        default: dist-sourcemaps
      sourcemaps-app:
        description: >-
          The `{app}` of `{registry}/{owner}/sourcemaps/{app}`: the name the
          source-map server is configured with for this application
          (`apps[].name`), which is the first path segment of the URL it
          serves maps under. Empty (the default) is the last path segment
          of `sourcemaps-image`; set it when the image is named differently
          from the application (an image `web` for the app `url-shortener`).
          Only used with `sourcemaps-image`.
        required: false
        type: string
        default: ""
      ko-docker-repo:
        required: false
        type: string
        default: ghcr.io/truvity
      runner:
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        default: 30

# A reusable workflow can only NARROW what the caller granted, never
# widen it — so this block is a floor, not a formality. It previously
# read `contents: read`, which silently dropped the `packages: write`
# every caller was told to grant: ko then failed with "DENIED:
# installation not allowed to Write organization package", two minutes
# into the first release that ever called this workflow. It shipped
# that way because it had no callers to expose it.
#
# What the job actually needs: contents:write for the GitHub Release
# goreleaser creates, packages:write for the ko image and the chart
# push. Callers must grant at least these.
permissions:
  contents: write
  packages: write

jobs:
  # A public repository runs on GitHub-hosted runners, always. This refuses
  # anything else BEFORE a job could land on the estate's own infrastructure,
  # which is why it hard-codes its own runner rather than taking the caller's.
  #
  # The runner group's "allow public repositories" setting is the hard stop
  # and stays off; this is the second lock, and it exists because the way a
  # public repository ends up on a self-hosted tier is not malice — it is
  # copying a private repository's caller, which currently succeeds silently.
  # A private caller passes immediately and pays a few seconds.
  runners:
    name: runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: truvity/ci-actions/public-runners@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          runners: ${{ inputs.runner }}
          visibility: ${{ github.event.repository.visibility }}

  release:
    needs: runners
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the changelog from history; a shallow
          # clone gives it nothing to derive from.
          fetch-depth: 0

      - uses: truvity/ci-actions/setup-devbox@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}

      # dockers_v2 builds multi-platform images with buildx; the default
      # docker driver cannot.
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # IMAGE_TAG is the version WITHOUT the leading v. The git tag is
      # `v0.4.2` and the image tag is `0.4.2`; passing github.ref_name
      # straight through published `…:v0.4.2`, which is a different image
      # from every one that came before it.
      - name: The version
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: GoReleaser
        run: devbox run -- goreleaser release --clean
        env:
          # For a configuration whose image destination, tag and release
          # switch are templated — one file, three loops. A configuration
          # naming none of them ignores all three, so every existing caller
          # renders byte-identically.
          IMAGE_REPO: ${{ inputs.image-repo }}
          GITHUB_RELEASE_DISABLED: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `image-repo` wins where it is given, because KO_DOCKER_REPO
          # OVERRIDES a `repositories:` in the configuration — quietly.
          # A release published every image to the bare default and only
          # failed afterwards, writing an SBOM to a repository that was
          # never meant to hold one.
          KO_DOCKER_REPO: ${{ inputs.image-repo || inputs.ko-docker-repo }}

      # The git tag is the sole version authority: a chart's own version
      # field is a placeholder that never moves, and is stamped here.
      #
      # helmctl (from truvity/ocictl) instead of `helm package`+`helm push`:
      # it repacks the tgz deterministically on push (epoch timestamps,
      # sorted entries, zeroed owners) and hand-builds the OCI manifest
      # without a `created` annotation — identical chart content therefore
      # always lands as the identical registry digest, which is what makes
      # immutable chart tags trustworthy across re-releases. It shells out
      # to `helm package` internally, so it runs under devbox where helm is
      # on PATH, and authenticates to ghcr with GITHUB_TOKEN directly — no
      # registry login step.
      - name: Package and push charts
        if: inputs.charts != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARTS: ${{ inputs.charts }}
          CHART_ROOT: ${{ inputs.chart-root }}
          REGISTRY: ${{ inputs.chart-registry }}
          APP_VERSION_MODE: ${{ inputs.chart-app-version }}
          CHART_IMAGES: ${{ inputs.chart-images }}
          REQUIRE_IMAGE_DIGESTS: ${{ inputs.require-image-digests }}
          # renovate: datasource=github-releases depName=truvity/ocictl
          HELMCTL_VERSION: "0.8.0"
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          arch="$(uname -m)"
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/helmctl"
          gh release download "v${HELMCTL_VERSION}" --repo truvity/ocictl \
            --pattern "helmctl_${HELMCTL_VERSION}_linux_${arch}.tar.gz" \
            --output - | tar -xz -C "$RUNNER_TEMP/helmctl" helmctl

          # chart-registry arrives as one oci:// URL; helmctl push takes
          # the registry host and the full chart path separately.
          ref="${REGISTRY#oci://}"
          registry="${ref%%/*}"
          repo_prefix="${ref#*/}"

          # >>> charts
          # One line per chart, `<directory><TAB><name>`. A plain entry is
          # under CHART_ROOT; an entry with a `/` is a path from the
          # repository root. The name is the last element either way, and
          # it is what helmctl packages, pushes and tags. Everything wrong
          # is refused HERE, before anything is built or pushed, because a
          # chart published under the wrong name cannot be taken back.
          # A command substitution and not `mapfile < <(...)`: the latter
          # discards the exit status, so a refusal would be a warning.
          resolved="$(python3 - <<'PY'
          import json, os, re, sys

          def refuse(msg):
              print("::error::charts: " + msg, file=sys.stderr)
              sys.exit(1)

          try:
              entries = json.loads(os.environ["CHARTS"])
          except ValueError as e:
              refuse("not a JSON array: %s" % e)
          if not isinstance(entries, list):
              refuse("not a JSON array")

          root = os.environ["CHART_ROOT"].rstrip("/")
          name_re = re.compile(r"^[a-z0-9]+([._-][a-z0-9]+)*$")
          seen = {}
          for entry in entries:
              if not isinstance(entry, str) or not entry:
                  refuse("%r is not a non-empty string" % (entry,))
              if entry.startswith("/"):
                  refuse("%r is absolute: a chart path is from the repository root" % entry)
              parts = entry.split("/")
              if any(p in ("", ".", "..") for p in parts):
                  refuse("%r has an empty, `.` or `..` element: name the chart, not a way to it" % entry)
              name = parts[-1]
              if not name_re.match(name):
                  refuse("%r: the chart name %r is not a lowercase chart name (letters, digits, `-`, `.`, `_`)" % (entry, name))
              if name in seen:
                  refuse("%r and %r are both published as %r: a chart is packaged, pushed and named by its last path element" % (seen[name], entry, name))
              seen[name] = entry
              directory = entry if "/" in entry else "%s/%s" % (root, entry)
              print("%s\t%s" % (directory, name))
          PY
          )"
          charts=()
          if [ -n "$resolved" ]; then mapfile -t charts <<<"$resolved"; fi
          # <<< charts

          for entry in "${charts[@]}"; do
            chart_dir="${entry%%$'\t'*}"
            chart="${entry##*$'\t'}"
            echo "::group::${chart} ${version}"
            # helmctl's --app-version is optional: omitting it leaves the
            # chart's declared appVersion untouched. Reject anything we do
            # not recognise rather than falling back to "release" — a typo
            # would otherwise reproduce exactly the silent mis-stamp this
            # option exists to prevent.
            case "$APP_VERSION_MODE" in
              release) app_version_args=(--app-version "$version") ;;
              chart)   app_version_args=() ;;
              *) echo "::error::chart-app-version must be 'release' or 'chart', got '${APP_VERSION_MODE}'"; exit 1 ;;
            esac
            # A manifest carries the version, the appVersion and the
            # values to bake in, so it REPLACES the two version flags
            # rather than sitting beside them. A chart with no manifest is
            # packaged exactly as it was before this input existed.
            if [ "$CHART_IMAGES" = "goreleaser" ]; then
              # The digests of what GoReleaser pushed MINUTES AGO, in this
              # same job. helmctl reads its dist/ and writes the manifest;
              # the chart is packaged from that rather than from the tag,
              # so its image values cannot be empty.
              manifest="$RUNNER_TEMP/${chart}-manifest.yaml"
              "$RUNNER_TEMP/helmctl/helmctl" goreleaser-manifest \
                --goreleaser-dist dist --output "$manifest"
              package_args=(--manifest "$manifest")
            else
              package_args=(--version "$version" "${app_version_args[@]}")
            fi
            if [ "$REQUIRE_IMAGE_DIGESTS" = "true" ]; then
              package_args+=(--require-image-digests)
            fi
            devbox run -- "$RUNNER_TEMP/helmctl/helmctl" package \
              --chart "${chart_dir}" \
              "${package_args[@]}" \
              --output dist/
            "$RUNNER_TEMP/helmctl/helmctl" push \
              --tgz "dist/${chart}-${version}.tgz" \
              --registry "$registry" \
              --repository "${repo_prefix}/${chart}" \
              --name "$chart" --version "$version"
            echo "::endgroup::"
          done

      # Source maps, right after the images they belong to. Same shape as
      # the helmctl step above: a pinned smctl from truvity/ocictl, run in
      # this job. smctl reads dist/ (GoReleaser's own record of what it
      # just published) for the version and the image's registry, so a
      # release that did not publish has nothing to push maps for, and the
      # maps are the ones built with that image. It authenticates to ghcr
      # with GITHUB_TOKEN directly; no extra login. Not `|| true`: maps for
      # a shipped image are part of the release.
      - name: Push source maps
        if: inputs.sourcemaps-image != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCEMAPS_IMAGE: ${{ inputs.sourcemaps-image }}
          SOURCEMAPS_DIR: ${{ inputs.sourcemaps-dir }}
          SOURCEMAPS_APP: ${{ inputs.sourcemaps-app }}
          # renovate: datasource=github-releases depName=truvity/ocictl
          SMCTL_VERSION: "0.7.1"
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/smctl"
          gh release download "v${SMCTL_VERSION}" --repo truvity/ocictl \
            --pattern "smctl_${SMCTL_VERSION}_linux_${arch}.tar.gz" \
            --output - | tar -xz -C "$RUNNER_TEMP/smctl" smctl

          args=(--goreleaser-dist dist --image "$SOURCEMAPS_IMAGE" --maps "$SOURCEMAPS_DIR")
          if [ -n "$SOURCEMAPS_APP" ]; then
            args+=(--app "$SOURCEMAPS_APP")
          fi
          "$RUNNER_TEMP/smctl/smctl" push "${args[@]}"

      # Last, so a flake that fails never keeps a chart from shipping.
      #
      # Each flake wraps the archives goreleaser just uploaded: fetchurl
      # by URL and sha256, then install the archive's binaries. Built from
      # the archives rather than from source, because a from-source
      # derivation carries a vendorHash that every renovate go.sum bump
      # breaks, and the release would find out at the tag. The nixpkgs it
      # evaluates with is the caller's own devbox pin. Before upload it is
      # locked, evaluated for every system, and built and installed for
      # the runner's own.
      - name: Publish Nix flakes
        if: inputs.nix-flakes != '[]'
        uses: truvity/ci-actions/publish-nix-flakes@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          flakes: ${{ inputs.nix-flakes }}
          flake-dir: ${{ runner.temp }}/nix-flakes
          token: ${{ secrets.GITHUB_TOKEN }}
