# Tag-triggered release for the PUBLIC estate: goreleaser, then any
# Helm charts, both to GHCR.
#
# "public" is in the name because the private half is a different
# workflow, not a flag on this one — ECR instead of GHCR, ARC runners
# instead of hosted, and a different identity to reach either. A repo
# publishing to ECR shares almost nothing with this but the word
# "release". That workflow arrives when it has a consumer; writing it
# now would ship untested release machinery, and release machinery can
# only be tested by a real tag.
#
# NO `secrets: inherit` is needed. Every public repo's release runs
# plain goreleaser (not goreleaser-pro, which is bar's) and pushes with
# the automatic GITHUB_TOKEN. The caller does need to grant the
# permissions below, because a reusable workflow cannot widen them.
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#         packages: write
#       uses: truvity/ci-workflows/.github/workflows/release-public.yaml@<sha>
#       with:
#         charts: '["github-roster"]'
#         nix-flakes: '["github-roster"]'
name: release-public

on:
  workflow_call:
    inputs:
      charts:
        description: >-
          JSON array of chart directory names under charts/. Empty for
          binaries only (ocictl, pulumi-zitadel). More than one is
          normal — zitadel-operator ships its CRDs as a second chart.
        required: false
        type: string
        default: '[]'
      chart-registry:
        required: false
        type: string
        default: oci://ghcr.io/truvity/charts
      chart-app-version:
        description: >-
          What to write as each chart's appVersion. Default "release"
          stamps the release version, which is right for a repo that
          ships the application it builds — chart and app move together.
          Use "chart" for charts packaging SOFTWARE WE DO NOT BUILD: it
          leaves each Chart.yaml's own appVersion intact, so the chart
          version can move for chart-only fixes while appVersion keeps
          recording the upstream release. Getting this wrong is silent
          at publish time and only breaks at `helm install`, because
          charts commonly default the image tag to .Chart.AppVersion.
        required: false
        type: string
        default: release
      nix-flakes:
        description: >-
          JSON array of goreleaser ARCHIVE ids to publish as Nix flakes,
          one release asset each: <id>_<version>_nix-flake.tar.gz. It is
          how a CLI reaches other repositories' devbox without nixpkgs:
          devbox.json names the asset URL with #<id>, and devbox.lock
          pins its hash. The flake fetches this release's own archives
          by sha256, so nothing is rebuilt and nothing needs updating
          between releases. Empty publishes none.
        required: false
        type: string
        default: '[]'
      ko-docker-repo:
        required: false
        type: string
        default: ghcr.io/truvity
      runner:
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        default: 30

# A reusable workflow can only NARROW what the caller granted, never
# widen it — so this block is a floor, not a formality. It previously
# read `contents: read`, which silently dropped the `packages: write`
# every caller was told to grant: ko then failed with "DENIED:
# installation not allowed to Write organization package", two minutes
# into the first release that ever called this workflow. It shipped
# that way because it had no callers to expose it.
#
# What the job actually needs: contents:write for the GitHub Release
# goreleaser creates, packages:write for the ko image and the chart
# push. Callers must grant at least these.
permissions:
  contents: write
  packages: write

jobs:
  # A public repository runs on GitHub-hosted runners, always. This refuses
  # anything else BEFORE a job could land on the estate's own infrastructure,
  # which is why it hard-codes its own runner rather than taking the caller's.
  #
  # The runner group's "allow public repositories" setting is the hard stop
  # and stays off; this is the second lock, and it exists because the way a
  # public repository ends up on a self-hosted tier is not malice — it is
  # copying a private repository's caller, which currently succeeds silently.
  # A private caller passes immediately and pays a few seconds.
  runners:
    name: runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: truvity/ci-workflows/.github/actions/public-runners@abc7684848bd753e607c7d9eaea34af719b7637f # v3.3.0
        with:
          runners: ${{ inputs.runner }}
          visibility: ${{ github.event.repository.visibility }}

  release:
    needs: runners
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the changelog from history; a shallow
          # clone gives it nothing to derive from.
          fetch-depth: 0

      - uses: truvity/ci-workflows/.github/actions/setup-devbox@c52097531a80e9c02ee47c725b24f4e527914363 # v3.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}

      - name: GoReleaser
        run: devbox run -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ${{ inputs.ko-docker-repo }}

      # The git tag is the sole version authority: a chart's own version
      # field is a placeholder that never moves, and is stamped here.
      #
      # helmctl (from truvity/ocictl) instead of `helm package`+`helm push`:
      # it repacks the tgz deterministically on push (epoch timestamps,
      # sorted entries, zeroed owners) and hand-builds the OCI manifest
      # without a `created` annotation — identical chart content therefore
      # always lands as the identical registry digest, which is what makes
      # immutable chart tags trustworthy across re-releases. It shells out
      # to `helm package` internally, so it runs under devbox where helm is
      # on PATH, and authenticates to ghcr with GITHUB_TOKEN directly — no
      # registry login step.
      - name: Package and push charts
        if: inputs.charts != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARTS: ${{ inputs.charts }}
          REGISTRY: ${{ inputs.chart-registry }}
          APP_VERSION_MODE: ${{ inputs.chart-app-version }}
          # renovate: datasource=github-releases depName=truvity/ocictl
          HELMCTL_VERSION: "0.5.1"
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          arch="$(uname -m)"
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/helmctl"
          gh release download "v${HELMCTL_VERSION}" --repo truvity/ocictl \
            --pattern "helmctl_${HELMCTL_VERSION}_linux_${arch}.tar.gz" \
            --output - | tar -xz -C "$RUNNER_TEMP/helmctl" helmctl

          # chart-registry arrives as one oci:// URL; helmctl push takes
          # the registry host and the full chart path separately.
          ref="${REGISTRY#oci://}"
          registry="${ref%%/*}"
          repo_prefix="${ref#*/}"

          mapfile -t charts < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["CHARTS"])))')

          for chart in "${charts[@]}"; do
            echo "::group::${chart} ${version}"
            # helmctl's --app-version is optional: omitting it leaves the
            # chart's declared appVersion untouched. Reject anything we do
            # not recognise rather than falling back to "release" — a typo
            # would otherwise reproduce exactly the silent mis-stamp this
            # option exists to prevent.
            case "$APP_VERSION_MODE" in
              release) app_version_args=(--app-version "$version") ;;
              chart)   app_version_args=() ;;
              *) echo "::error::chart-app-version must be 'release' or 'chart', got '${APP_VERSION_MODE}'"; exit 1 ;;
            esac
            devbox run -- "$RUNNER_TEMP/helmctl/helmctl" package \
              --chart "charts/${chart}" \
              --version "$version" "${app_version_args[@]}" \
              --output dist/
            "$RUNNER_TEMP/helmctl/helmctl" push \
              --tgz "dist/${chart}-${version}.tgz" \
              --registry "$registry" \
              --repository "${repo_prefix}/${chart}" \
              --name "$chart" --version "$version"
            echo "::endgroup::"
          done

      # Last, so a flake that fails never keeps a chart from shipping.
      #
      # Each flake wraps the archives goreleaser just uploaded: fetchurl
      # by URL and sha256, then install the archive's binaries. Built from
      # the archives rather than from source, because a from-source
      # derivation carries a vendorHash that every renovate go.sum bump
      # breaks, and the release would find out at the tag. The nixpkgs it
      # evaluates with is the caller's own devbox pin. Before upload it is
      # locked, evaluated for every system, and built and installed for
      # the runner's own.
      - name: Publish Nix flakes
        if: inputs.nix-flakes != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAKES: ${{ inputs.nix-flakes }}
          FLAKE_DIR: ${{ runner.temp }}/nix-flakes
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          # goreleaser os/arch -> Nix system. Anything else has no Nix system and
          # is left out: windows, 386, arm/v6 -- and darwin/amd64, which
          # nixpkgs-unstable dropped in 26.11, so a flake offering it fails to
          # evaluate there.
          SYSTEMS = {
              ("linux", "amd64"): "x86_64-linux",
              ("linux", "arm64"): "aarch64-linux",
              ("darwin", "arm64"): "aarch64-darwin",
          }

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          ids = json.loads(os.environ["FLAKES"])
          out = os.environ["FLAKE_DIR"]

          # The nixpkgs the flake builds with: the caller's own devbox pin when it
          # has one, so the release runner and most consumers already hold it.
          nixpkgs = "github:NixOS/nixpkgs/nixpkgs-unstable"
          try:
              with open("devbox.lock") as f:
                  for name, entry in json.load(f).get("packages", {}).items():
                      if name.startswith("github:NixOS/nixpkgs/"):
                          resolved = entry.get("resolved", "").split("?")[0]
                          if re.fullmatch(r"github:NixOS/nixpkgs/[0-9a-f]{40}", resolved):
                              nixpkgs = resolved
                              break
          except FileNotFoundError:
              pass

          with open("dist/artifacts.json") as f:
              artifacts = json.load(f)


          def nix_string(value):
              return json.dumps(value)  # a JSON string literal is a valid Nix string


          for archive_id in ids:
              sources = {}
              binaries = None
              wrapped = None
              for art in artifacts:
                  extra = art.get("extra") or {}
                  if art.get("type") != "Archive" or extra.get("ID") != archive_id:
                      continue
                  system = SYSTEMS.get((art.get("goos"), art.get("goarch")))
                  if system is None or art.get("goamd64", "v1") != "v1":
                      continue
                  if extra.get("Format") not in ("tar.gz", "tgz", "tar.xz", "tar.zst", "zip"):
                      sys.exit(f"::error::archive {art['name']} is {extra.get('Format')}; a flake needs an archive, not a bare binary")
                  if binaries is None:
                      binaries, wrapped = extra.get("Binaries") or [], extra.get("WrappedIn") or ""
                  elif (extra.get("Binaries") or []) != binaries or (extra.get("WrappedIn") or "") != wrapped:
                      sys.exit(f"::error::archive {archive_id} holds different binaries per platform")
                  with open(art["path"], "rb") as f:
                      sha256 = hashlib.sha256(f.read()).hexdigest()
                  sources[system] = {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{art['name']}",
                      "sha256": sha256,
                  }

              if not sources:
                  sys.exit(f"::error::no linux or darwin archive with id {archive_id} in dist/artifacts.json")
              if not binaries:
                  sys.exit(f"::error::archive {archive_id} lists no binaries")

              main = archive_id if archive_id in binaries else binaries[0]
              lines = [
                  f"# {archive_id} {version} from {repo}, as released at {tag}.",
                  "# Generated by truvity/ci-workflows release-public; do not edit.",
                  "#",
                  "# devbox.json:",
                  f'#   "https://github.com/{repo}/releases/download/{tag}/{archive_id}_{version}_nix-flake.tar.gz#{archive_id}": ""',
                  "{",
                  f"  description = {nix_string(f'{archive_id} {version} ({repo} {tag})')};",
                  "",
                  f"  inputs.nixpkgs.url = {nix_string(nixpkgs)};",
                  "",
                  "  outputs = { self, nixpkgs }:",
                  "    let",
                  f"      version = {nix_string(version)};",
                  "      sources = {",
              ]
              for system in sorted(sources):
                  src = sources[system]
                  lines.append(f"        {nix_string(system)} = {{ url = {nix_string(src['url'])}; sha256 = {nix_string(src['sha256'])}; }};")
              lines += [
                  "      };",
                  "      package = system:",
                  "        let pkgs = nixpkgs.legacyPackages.${system};",
                  "        in pkgs.stdenvNoCC.mkDerivation {",
                  f"          pname = {nix_string(archive_id)};",
                  "          inherit version;",
                  "          src = pkgs.fetchurl sources.${system};",
                  f"          sourceRoot = {nix_string(wrapped or '.')};",
                  "          dontConfigure = true;",
                  "          dontBuild = true;",
                  "          installPhase = ''",
                  "            runHook preInstall",
              ]
              for binary in binaries:
                  lines.append(f"            install -Dm755 \"{binary}\" \"$out/bin/{binary}\"")
              lines += [
                  "            runHook postInstall",
                  "          '';",
                  f"          meta.mainProgram = {nix_string(main)};",
                  "        };",
                  "    in {",
                  "      packages = nixpkgs.lib.genAttrs (builtins.attrNames sources) (system: {",
                  f"        {nix_string(archive_id)} = package system;",
                  "        default = package system;",
                  "      });",
                  "    };",
                  "}",
              ]

              flake_dir = os.path.join(out, f"{archive_id}_{version}_nix-flake")
              os.makedirs(flake_dir, exist_ok=True)
              with open(os.path.join(flake_dir, "flake.nix"), "w") as f:
                  f.write("\n".join(lines) + "\n")
              print(f"{flake_dir}: {', '.join(sorted(sources))} with {nixpkgs}")
          PY

          nix=(nix --extra-experimental-features "nix-command flakes")
          cd "$FLAKE_DIR"
          for dir in */; do
            dir="${dir%/}"
            id="${dir%_*_nix-flake}"
            echo "::group::${dir}"
            "${nix[@]}" flake lock "path:$PWD/$dir"
            "${nix[@]}" flake check --no-build --all-systems "path:$PWD/$dir"
            out="$("${nix[@]}" build --no-link --print-out-paths "path:$PWD/$dir#$id")"
            ls -l "$out/bin"
            # Deterministic, so re-running a release uploads the same bytes
            # and a consumer's locked narHash still matches.
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - "$dir" | gzip -n > "$dir.tar.gz"
            gh release upload "$GITHUB_REF_NAME" "$dir.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
            echo "::endgroup::"
          done
