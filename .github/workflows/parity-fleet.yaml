# Version parity for a whole estate from ONE job: devbox leads, the other
# manifests follow, one pull request per repository that moved.
#
# Until v3.0.0 this ran from a workflow inside each repository, which
# meant every repository needed its own way to reach an App key. Here the
# caller repository holds the key once; discovery lists every repository
# the App is installed on that carries a devbox.json and a required
# status check; and the devbox-parity action runs once per repository as
# a matrix job. The pairs (go toolchain, playwright) and the rules are in
# docs/fleet.md and docs/devbox-update.md.
#
# The run's `mode` is a default: a repository that needs another one
# declares it in its own `.devbox-parity.json`, so an estate whose
# repositories disagree about full updates is still ONE run.
#
# `caller-parity: true` adds a second, read-only check over the same
# estate: the shared caller workflows every repository carries
# (`security.yaml`, `auto-release.yaml`) against the canonical copies in
# truvity/ci-actions caller-parity/kits. It REPORTS — no branch, no pull
# request — because the estate has to see what would change before
# anything changes it. Off by default.
#
# Tokens come from App keys the caller passes (`token-source: app-key`) or
# from an access-roster issuer the job exchanges its GitHub OIDC token at
# (`token-source: access-roster`) — see renovate-fleet.yaml. Either way the
# caller grants `id-token: write`.
#
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     parity:
#       uses: truvity/ci-workflows/.github/workflows/parity-fleet.yaml@<sha> # vX.Y.Z
#       with:
#         estate: private
#         runner: ${{ vars.CI_RUNNER_LABEL_LARGE }}
#         token-source: access-roster
#         access-roster-issuer: https://access.example
#         github-app: renovate-private
#         git-user: example-renovate-private[bot]
#
# or, with a key:
#
#       with:
#         client-id: ${{ vars.RENOVATE_PRIVATE_CLIENT_ID }}
#         git-user: renovate-private[bot]
#       secrets:
#         RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_PRIVATE_PRIVATE_KEY }}
name: parity-fleet

on:
  workflow_call:
    inputs:
      estate:
        description: "`public` or `private` — the only visibility this run may touch."
        required: true
        type: string
      runner:
        description: >-
          Where each repository's alignment runs. The private estate wants
          the pool: the repository's pre-push hook compiles the module.
        required: false
        type: string
        default: ubuntu-latest
      token-source:
        description: >-
          Where tokens come from: `app-key` (`client-id` and the
          RENOVATE_APP_PRIVATE_KEY secret) or `access-roster` (installation
          tokens of `github-app`, exchanged at `access-roster-issuer` for
          the job's GitHub OIDC token).
        required: false
        type: string
        default: app-key
      access-roster-issuer:
        description: The access-roster issuer URL. Required when token-source is `access-roster`.
        required: false
        type: string
        default: ""
      github-app:
        description: >-
          The App's catalogue id at the issuer — the identity that pushes
          the branch and opens the PR. Required when token-source is
          `access-roster`.
        required: false
        type: string
        default: ""
      debug-oidc-claims:
        description: >-
          Print the discover job's GitHub OIDC claims (repository, ref,
          ref_type, event_name, workflow_ref, job_workflow_ref, sha) —
          never the token — to check them against an issuer's matchers.
        required: false
        type: boolean
        default: false
      client-id:
        description: >-
          The App's client id — the identity that pushes the branch and
          opens the PR. Required when token-source is `app-key`.
        required: false
        type: string
        default: ""
      mode:
        description: >-
          `auto` (full devbox update on full-update-day, align only
          otherwise), `full`, or `align` — for every repository that does
          not declare a `mode` of its own in `.devbox-parity.json`.
        required: false
        type: string
        default: auto
      full-update-day:
        description: ISO weekday (1 = Monday) on which `auto` runs the full devbox update.
        required: false
        type: string
        default: "1"
      require-check:
        description: >-
          Skip repositories whose default branch has no required status
          check — from EITHER a repository ruleset or classic branch
          protection; either one counts, and a source that cannot be read
          leaves the rule undecided and the repository kept. Keep `true`
          wherever the repositories automerge: with nothing gating a
          merge, auto-merge lands immediately and unvalidated. `false`
          suits an estate whose repositories do not automerge yet and
          review every dependency PR by hand.
        required: false
        type: boolean
        default: true
      caller-parity:
        description: >-
          Also compare each enrolled repository's shared caller
          workflows (`security.yaml`, `auto-release.yaml`) against the
          canonical copies this library ships, and REPORT the
          differences in the run summary. Opens nothing and rewrites
          nothing. Off by default: it is a new check over an estate
          nobody has cleaned yet, and a scheduled run that suddenly
          grows a table is a surprise.
        required: false
        type: boolean
        default: false
      caller-parity-list:
        description: >-
          Dotted path to the caller-parity enrolment list inside
          repositories-file, e.g. `caller-parity.public`. Empty uses
          `list` — the same repositories version parity aligns.
        required: false
        type: string
        default: ""
      caller-parity-kits:
        description: >-
          Directory in the CALLER repository holding that estate's own
          canonical copies, one file per caller workflow. Empty uses the
          copies in this library, which are the truvity estate's.
        required: false
        type: string
        default: ""
      caller-parity-fail-on-diff:
        description: >-
          Fail the caller-parity job when a repository differs. The lever
          for turning the report into a gate once the estate is clean.
        required: false
        type: boolean
        default: false
      repositories-file:
        description: YAML file in the caller repository holding the enrolment lists.
        required: false
        type: string
        default: fleet.yaml
      list:
        description: >-
          Dotted path to this job's list inside repositories-file, e.g.
          `parity.private`. Empty processes every repository the App can see.
        required: false
        type: string
        default: ""
      filter:
        description: RE2 over `owner/name`; only matches are processed.
        required: false
        type: string
        default: ""
      git-user:
        description: Commit author name — the App's bot login.
        required: true
        type: string
      git-email:
        description: >-
          Commit author email — the App's noreply address,
          `<bot user id>+<git-user>@users.noreply.github.com`. Empty looks
          the bot user id up from git-user.
        required: false
        type: string
        default: ""
      max-parallel:
        description: How many repositories are aligned at once.
        required: false
        type: number
        default: 4
      timeout-minutes:
        description: Per repository.
        required: false
        type: number
        default: 30
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        description: The App's private key. Required when token-source is `app-key`.
        required: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # token-source access-roster, and debug-oidc-claims
    outputs:
      repositories: ${{ steps.discover.outputs.repositories }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.list != ''
        with:
          sparse-checkout: ${{ inputs.repositories-file }}
          sparse-checkout-cone-mode: false

      - name: Read the enrolment list
        id: enrolled
        if: inputs.list != ''
        uses: truvity/ci-actions/enrolment-list@62eecede955676a2c0fb760dd185521528886d0b # v1.10.0
        with:
          file: ${{ inputs.repositories-file }}
          list: ${{ inputs.list }}

      # Once, here: every other job needs this one.
      - name: Check the token inputs
        uses: truvity/ci-actions/token-inputs@d0dc2123d0d698d205713525d84346fffcb86eb5 # v1.15.1
        with:
          source: ${{ inputs.token-source }}
          access-roster-issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          id: ${{ inputs.client-id }}
          id-name: client-id
          secret-name: RENOVATE_APP_PRIVATE_KEY
          has-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY != '' }}

      # What an issuer's `github` matchers compare, as GitHub put it in
      # this job's identity token. The token is minted for a throwaway
      # audience, so it is good for nothing if it ever leaked, and only
      # its claims are printed.
      - name: Print this job's OIDC claims
        if: inputs.debug-oidc-claims
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: oidc-claims

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Not narrowed: discovery has to see every repository to list them,
      # and the required-check rule's fallback (GraphQL's refUpdateRule)
      # answers for the viewer, so a weaker token than the matrix jobs'
      # could miss a required check they have.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}

      - uses: truvity/ci-actions/fleet-discover@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        id: discover
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          estate: ${{ inputs.estate }}
          filter: ${{ inputs.filter }}
          repositories: ${{ steps.enrolled.outputs.names }}
          require-check: ${{ inputs.require-check && 'true' || 'false' }}
          require-file: devbox.json

  # The OTHER kind of parity: not the pins inside a repository, but the
  # shared caller workflows every repository carries. `security.yaml`
  # and `auto-release.yaml` are one kit in substance across the estate,
  # and nothing asserted it until a repository quietly lost a trigger.
  #
  # Read-only, and one job rather than a matrix: two API reads per
  # repository, whose whole output is ONE table of the estate — the same
  # reason renovate-fleet's `majors` job is one job. Hosted, like
  # `discover` and for the same reason: a public repository must never
  # be touched from a self-hosted runner, and there is nothing here to
  # build.
  #
  # `needs: discover` for its token-input check, not for its list: this
  # check has its own enrolment and its own discovery rules.
  caller-parity:
    needs: discover
    if: inputs.caller-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # token-source access-roster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.list != '' || inputs.caller-parity-list != '' || inputs.caller-parity-kits != ''
        with:
          # The enrolment list, and the estate's own canonical copies
          # when it keeps them itself.
          sparse-checkout: |
            ${{ inputs.repositories-file }}
            ${{ inputs.caller-parity-kits }}
          sparse-checkout-cone-mode: false

      - name: Read the enrolment list
        id: enrolled
        if: inputs.list != '' || inputs.caller-parity-list != ''
        uses: truvity/ci-actions/enrolment-list@62eecede955676a2c0fb760dd185521528886d0b # v1.10.0
        with:
          file: ${{ inputs.repositories-file }}
          list: ${{ inputs.caller-parity-list || inputs.list }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Every enrolled repository, because one table covers the estate —
      # but reading is all this job does, so `contents:read` is all it
      # asks the issuer for.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          permissions: contents:read

      # Its own discovery, with two rules relaxed on purpose:
      #
      #   require-check  exists because the fleet's other jobs merge on
      #                  green and need a green to wait for. This one
      #                  opens nothing, so a repository without a merge
      #                  gate is still worth reporting on.
      #   require-file   the subject here is the caller workflows
      #                  themselves; a repository that carries no
      #                  devbox.json still carries them.
      - uses: truvity/ci-actions/fleet-discover@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        id: discover-callers
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          estate: ${{ inputs.estate }}
          filter: ${{ inputs.filter }}
          repositories: ${{ steps.enrolled.outputs.names }}
          require-check: "false"
          require-file: ""

      - uses: truvity/ci-actions/caller-parity@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        if: steps.discover-callers.outputs.count != '0'
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          repositories: ${{ steps.discover-callers.outputs.repositories }}
          kits-dir: ${{ inputs.caller-parity-kits && format('{0}/{1}', github.workspace, inputs.caller-parity-kits) || '' }}
          fail-on-diff: ${{ inputs.caller-parity-fail-on-diff && 'true' || 'false' }}

  align:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # token-source access-roster
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    name: ${{ matrix.repository }}
    steps:
      # A token for THIS repository only: the matrix job holds no more
      # reach than the one repository it aligns.
      - name: Name the repository
        id: name
        env:
          REPO: ${{ matrix.repository }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.name.outputs.name }}

      # Push one branch, open and auto-merge one PR: contents and
      # pull_requests, on this repository.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          repositories: ${{ steps.name.outputs.name }}
          permissions: contents:write, pull_requests:write

      - name: Resolve the commit author
        id: author
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: commit-author
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          user-login: ${{ inputs.git-user }}
          email: ${{ inputs.git-email }}
          api-url: ${{ github.api_url }}

      - name: Read the default branch and parity settings
        id: repo
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: parity-settings
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          repository: ${{ matrix.repository }}
          api-url: ${{ github.api_url }}
          run-mode: ${{ inputs.mode }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ steps.repo.outputs.base }}
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}

      - uses: truvity/ci-actions/setup-devbox@0fcf84dbeb8d406bce34d969e6cc32592af5cb5b # v1.15.0
        with:
          proto: "false"
          github-token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}

      - uses: truvity/ci-actions/devbox-parity@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        id: parity
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          base: ${{ steps.repo.outputs.base }}
          mode: ${{ steps.repo.outputs.mode }}
          full-update-day: ${{ inputs.full-update-day }}
          module-dirs: ${{ steps.repo.outputs.module-dirs }}
          git-user: ${{ inputs.git-user }}
          git-email: ${{ steps.author.outputs.git-email }}

      - name: Summary
        env:
          REPO: ${{ matrix.repository }}
          CHANGED: ${{ steps.parity.outputs.changed }}
          URL: ${{ steps.parity.outputs.pull-request }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "- $REPO: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- $REPO: at parity" >> "$GITHUB_STEP_SUMMARY"
          fi
