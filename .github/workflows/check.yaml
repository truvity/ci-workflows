# The workhorse. One reusable workflow for every repository in both
# organizations, every language, either task runner, either runner flow.
#
# ONE JOB PER RECIPE, in parallel. This shape was argued both ways in one
# day and the numbers settled it (2026-08-16). Measured on one caller:
# lint 119s, test 95s, build 76s, drift-check 42s, two trivial linters
# 36s each. Parallel is max ≈ 2min; the same recipes in sequence are
# sum ≈ 5min.
#
# Parallel costs MORE runner-minutes — the ~36s bootstrap and the module
# download are paid per job rather than once — and buys less wall-clock
# per pull request. That trade is worth it for a second reason that
# matters more as the estate grows: a job that does ONE thing can be
# sized for that one thing. A single job must be sized for the union of
# every recipe's peak CPU and peak memory at once, and six narrow
# runners pack onto nodes far better than one wide one.
#
# The counter-argument — six runners is six NODES — holds only while ARC
# is one-runner-per-node. It stops holding the moment density
# lands, which is why this is the shape to build toward.
#
# It serves `moon` repositories too: a monorepo is `command: moon`,
# `recipes: '["ci"]'`, `fetch-depth: 0` — one job, because moon's task
# graph decides its own parallelism.
name: check

on:
  workflow_call:
    inputs:
      lfs:
        description: >-
          Fetch Git LFS objects at checkout (needs git-lfs on the runner: the
          ARC image has it since ci-plane v6.7.0; GitHub-hosted runners have
          it). Set false for a repository whose LFS objects are not needed by
          this job.
        required: false
        type: boolean
        default: true
      recipes:
        description: >-
          JSON array of recipes. Each becomes its OWN job, running in
          parallel and reporting under its own name, so a red mark says
          "lint" rather than "something". The working tree is checked for
          modifications after each one.
        required: true
        type: string
      command:
        description: Task runner in front of each recipe — just, moon.
        required: false
        type: string
        default: just
      devbox-config:
        description: >-
          Directory, relative to the workspace, that holds its own
          devbox.json and devbox.lock: a second, smaller devbox
          environment than the repository's own, so the job downloads
          that closure instead of the full one. Passed to setup-devbox
          and to every recipe as `devbox run -c <dir>`, which makes that
          directory devbox's project root; `just` still finds the
          Justfile by searching parent directories, so recipes run from
          the repository root. Must be a relative path inside the
          workspace with a devbox.json in it. A second environment that
          ships no proto also needs `proto: "false"`. Empty (the
          default) uses the repository's own devbox.json, unchanged.
        required: false
        type: string
        default: ""
      npm-registry:
        description: >-
          Address of the CI plane's npm read-through registry, an
          http(s) URL with no query. Empty falls back to the CALLER's
          `vars.CI_NPM_REGISTRY` (a reusable workflow reads the caller
          repository's variables). It is probed with a 2s ping and used
          only when it answers. LEGACY: while both are empty the previous
          in-cluster address is probed instead, so a runner pool that
          has not yet been given the variable behaves exactly as before.
          A runner that exports `CI_RUNNER_NPM_REGISTRY` overrides both:
          its own value wins over this input and the variable.
        required: false
        type: string
        default: ''
      node-cache:
        description: >-
          Probe the CI plane's npm read-through cache (`npm-registry`
          or `vars.CI_NPM_REGISTRY`) and point npm and yarn at
          it for the job when it answers; when it does not, leave the
          defaults so a down cache degrades CI to slow, never to
          broken. Acts only on self-hosted (ARC) runners: on a
          GitHub-hosted runner the in-cluster name cannot resolve, so
          the probe is skipped there. Default true, which makes it a
          no-op for repositories without Node and for hosted runners.
        required: false
        type: boolean
        default: true
      runner:
        description: >-
          Runner label. Hosted repos leave the default; ARC callers pass
          their scale-set name (vars.CI_RUNNER_LABEL_LARGE).

          When this is one of the organisation's CI_RUNNER_LABEL_<SIZE>
          labels (the preview tier), it only says "size me": every recipe
          and the pins job get the size runner-sizes.yaml names for them
          (MEDIUM when it names none), as the label in
          CI_RUNNER_LABEL_<SIZE>. No caller passes sizes; a row in that
          table, and a release of this library, moves a job.

          Any other label (hosted, the stable tier) is used as it is, and
          so is this label for a size whose variable the organisation does
          not have. There the old rule still holds: this is the runner
          every recipe gets unless it is named in `small-recipes` or
          `medium-recipes`, and it should be the BIG one, since a recipe
          too small for its runner is OOM-killed, uploads no log and reads
          as a hang.
        required: false
        type: string
        default: ubuntu-latest
      small-recipes:
        description: >-
          JSON array of recipes that run on `small-runner` instead. Opt
          DOWN, never up: list only recipes whose peak memory you have
          measured, and leave anything unproven on the default.

          Recipes are not one population. On one caller the three linters
          peak at a flat ~4.0Gi while build and lint want 13-20Gi, so a
          single profile means an actionlint job over a handful of YAML
          files holds an entire 32Gi node for 34 seconds. The
          peak-memory line each job prints is the evidence for moving
          one here.

          Deprecated: on the preview tier runner-sizes.yaml decides, and
          this is read only off it (or where the organisation has no
          variable for the size the table names). Leave it out.
        required: false
        type: string
        default: '[]'
      small-runner:
        description: >-
          Scale-set label for `small-recipes` (vars.CI_RUNNER_LABEL_SMALL).
          Defaults to `runner`, so listing recipes without setting this
          changes nothing.

          Deprecated: on the preview tier runner-sizes.yaml decides, and
          this is read only off it (or where the organisation has no
          variable for the size the table names). Leave it out.
        required: false
        type: string
        default: ""
      medium-recipes:
        description: >-
          JSON array of recipes that run on `medium-runner` — the
          measured middle (2026-08-27 fleet survey): jobs peaking
          10-13.4Gi that held a 24Gi runner at ~50%. Same opt-DOWN
          rule as small-recipes: measured peaks only, promotion
          evidence is the peak line each job prints. A recipe listed
          in BOTH small and medium goes small (small wins ties).

          Deprecated: on the preview tier runner-sizes.yaml decides, and
          this is read only off it (or where the organisation has no
          variable for the size the table names). Leave it out.
        required: false
        type: string
        default: '[]'
      medium-runner:
        description: >-
          Scale-set label for `medium-recipes`
          (vars.CI_RUNNER_LABEL_MEDIUM). Defaults to `runner`, so
          listing recipes without setting this changes nothing.

          Deprecated: on the preview tier runner-sizes.yaml decides, and
          this is read only off it (or where the organisation has no
          variable for the size the table names). Leave it out.
        required: false
        type: string
        default: ""
      fetch-depth:
        description: >-
          0 for repositories whose task runner compares against the base
          ref — moon decides what is affected that way, and a shallow
          clone silently makes it run everything.
        required: false
        type: number
        default: 1
      lint-recipe:
        description: >-
          Which recipe gets the golangci-lint cache. Only that job
          restores and saves it, instead of every job restoring a blob
          most of them never read.
        required: false
        type: string
        default: lint
      proto:
        description: auto | true | false. Leave it alone; the action detects .prototools.
        required: false
        type: string
        default: auto
      aws-config-file:
        description: >-
          Workspace-relative path to a CI-shaped AWS config (e.g.
          aws-ci.ini). Resolved to an absolute path INSIDE the action,
          which is the only place that can: the github.workspace context
          is EMPTY when a caller evaluates it in `with:`.
        required: false
        type: string
        default: ''
      go-cache-bucket:
        description: >-
          ARC only — from the caller's org variable, never hard-coded here.
          Pass it only together with an ARC runner label: on a
          GitHub-hosted runner it must be empty, or the cache is tried
          there for nothing. The CALLER passes every cache input, and there is deliberately
          NO fallback to an org variable inside this workflow: a caller's
          security workflow passes none on purpose and once got one
          anyway, on a GitHub-hosted runner that could reach neither the
          binary nor the service.
        required: false
        type: string
        default: ''
      go-cache-region:
        required: false
        type: string
        default: ''
      go-cache-endpoint:
        description: >-
          S3 endpoint URL for the Go cache, for an S3-compatible store that
          is not AWS (Cloudflare R2, MinIO). From the caller's org
          variable; empty keeps the AWS default. Meaningful only alongside
          go-cache-bucket, like the rest of the cache wiring.
        required: false
        type: string
        default: ''
      go-cache-path-style:
        description: >-
          Address the cache bucket path-style rather than virtual-hosted.
          "true" to enable.
        required: false
        type: string
        default: ''
      go-private:
        description: >-
          Module path prefix to fetch directly over git rather than
          through the proxy — e.g. "github.com/truvity". Requires the
          module-app-client-id input and module-app-private-key
          secret.
        required: false
        type: string
        default: ''
      codeartifact-domain:
        description: >-
          CodeArtifact domain to log into before any recipe runs, e.g.
          "truvity". Empty skips the login entirely, which is right for
          the many repositories whose npm dependencies are all public.
        required: false
        type: string
        default: ''
      codeartifact-domain-owner:
        description: Account owning the CodeArtifact domain.
        required: false
        type: string
        default: ''
      codeartifact-region:
        description: >-
          Region the domain lives in — not necessarily the build's own
          region. truvity domain is eu-west-1 while the cluster is
          eu-central-1.
        required: false
        type: string
        default: ''
      module-app-client-id:
        description: >-
          Client id of a GitHub App with contents:read on the private
          module repositories. Public App metadata, hence an input.
          Required when go-private is set.
        required: false
        type: string
        default: ''
      goproxy:
        description: >-
          Go module proxy for recipes. Empty falls back to the CALLER's
          `vars.CI_GOPROXY` (a reusable workflow reads the caller
          repository's variables); both empty leaves Go's default. Applied
          only alongside go-cache-bucket, like the rest of the cache wiring.
          A runner that exports `CI_RUNNER_GOPROXY` overrides both.
        required: false
        type: string
        default: ''
      bazel-remote-cache:
        description: >-
          gRPC address of the CI plane's bazel-remote (moon's and bazel's
          task cache). Empty falls back to the CALLER's
          `vars.CI_BAZEL_REMOTE_CACHE`; both empty leaves it empty. Exported
          to every recipe as CI_BAZEL_REMOTE_CACHE for the project's own
          tooling to read; this workflow wires nothing else with it and
          never carries a literal address.
          A runner that exports `CI_RUNNER_BAZEL_REMOTE_CACHE` overrides both
          (setup-devbox exports the winner as CI_BAZEL_REMOTE_CACHE).
        required: false
        type: string
        default: ''
      remote-builder-recipes:
        description: >-
          JSON array of recipes that build container images through the CI
          plane's shared BuildKit builders (the `image` recipe of a
          repository that validates its Dockerfile). OPT-IN: empty (the
          default) changes nothing for any other recipe or caller. A
          listed recipe gets the remote buildx builder registered
          (docker/setup-buildx-action with the remote driver, builder `ci`,
          exported as BUILDX_BUILDER), the registry login for
          `ecr-registries`, and CI_BUILDX_CACHE in its environment; the
          recipe's own `docker build` adds `--cache-from/--cache-to`
          from it. CI-PLANE RUNNERS ONLY: the builders resolve nowhere else,
          so the caller passes `remote-builders` together with an ARC
          runner label, and a listed recipe with no `remote-builders`
          fails loudly, before anything is built. Validation only -- nothing here pushes an
          image; the cache push is the only registry write.
        required: false
        type: string
        default: '[]'
      remote-builders:
        description: >-
          The CI plane's BuildKit nodes, `platforms=endpoint` entries
          separated by whitespace (the caller passes
          vars.CI_REMOTE_BUILDERS). Required by every recipe listed in
          `remote-builder-recipes`; ignored otherwise. No fallback to an
          org variable inside this workflow, like every cache input. A
          runner that exports `CI_RUNNER_REMOTE_BUILDERS` (same format)
          overrides WHICH nodes are registered; whether builders are used
          is still the caller's choice, by passing a non-empty value.
        required: false
        type: string
        default: ''
      buildx-cache:
        description: >-
          Registry reference of the BuildKit warm cache (the caller passes
          vars.CI_BUILDX_CACHE); exported to the listed recipes as
          CI_BUILDX_CACHE. A runner that exports `CI_RUNNER_BUILDX_CACHE`
          wins over it. Empty means no cache flags: slow, not broken.
        required: false
        type: string
        default: ''
      ecr-registries:
        description: >-
          ECR account ids to log into before a `remote-builder-recipes`
          recipe builds (base images come through the account's
          pull-through prefixes; the warm cache is pushed there). Empty
          means the account named by `buildx-cache`'s host (its first
          DNS label), so a caller passing the two org variables needs
          nothing else; empty with an empty `buildx-cache` skips the
          login.
        required: false
        type: string
        default: ''
      cache-paths:
        description: >-
          Files or directories to keep between runs in the CI cache bucket,
          one per line (`~` is the home directory, no globs), for a build
          that has no cache of its own on the runner, such as `~/.gradle/caches`.
          Restored after the toolchain is set up and before the recipe runs,
          saved after it (also when it failed) when the exact key was missing.
          Each recipe job has its own cache. Empty (the default) caches nothing
          and changes nothing for a caller. It rides `go-cache-bucket` and
          `go-cache-region` through truvity/ci-actions `s3-cache`; with no
          bucket, or a runner without credentials for it, the same step uses
          GitHub's cache. Pass it only from a job that may read and write the
          CI plane's caches: a stable runner passes none.
        required: false
        type: string
        default: ''
      cache-key-files:
        description: >-
          Files whose content names the `cache-paths` cache, one glob per line
          (`**` works), hashed with `hashFiles`; a change in any of them starts
          a new cache and the previous one is the fallback. Empty, or globs that
          match nothing, use the usual lockfiles: `**/gradle.lockfile`, `**/yarn.lock`,
          `**/package-lock.json`, `**/pnpm-lock.yaml`, `**/go.sum` and
          `devbox.lock`. Ignored without `cache-paths`.
        required: false
        type: string
        default: ''
      env-json:
        description: >-
          Extra environment as a JSON object, for repo-specific values the
          shared workflow should not know about.
        required: false
        type: string
        default: '{}'
      timeout-minutes:
        required: false
        type: number
        default: 30
      stable-mtimes:
        description: >-
          Right after the checkout, give every tracked file a modification
          time derived from its content (truvity/ci-actions stable-mtimes),
          so Go's test cache can hit. Go keys a cached test result on the
          size and mtime of every file the test opened; a fresh checkout
          stamps them all "now", so every test that reads repository files
          missed the cache although the content was unchanged. ON by default.
          Set false for a repository whose CI relies on make-style timestamp
          ordering (a committed generated file judged newer than its source).
        required: false
        type: boolean
        default: true
      policy-conformance:
        description: >-
          Run the `policy-conformance` job: truvity/ci-actions'
          policy-conformance action, which checks this repository against
          the component contract's rules C1-C12 (truvity/policy
          docs/contracts/component.md) and prints one line per rule.
          Report-only unless policy-conformance-strict is also true. OFF by
          default: a repository opts in when it is a component the
          contract applies to.
        required: false
        type: boolean
        default: false
      policy-conformance-strict:
        description: >-
          With policy-conformance, fail the job on any failed rule instead
          of reporting it as a warning. Turn it on once the repository
          passes, so it stays passing.
        required: false
        type: boolean
        default: false
    secrets:
      gitlab-token:
        description: >-
          Read-only GitLab deploy token, exported to recipes as
          GITLAB_TOKEN. For repositories whose dependencies still live in
          GitLab's package or container registry while CI/CD is mid-move.

          OPTIONAL, and unset for every Truvity caller: a caller that
          passes nothing leaves it empty, which is indistinguishable from
          how recipes behaved before it existed. Only the trust-form
          organization supplies it today.
        required: false
      module-app-private-key:
        description: >-
          Private key for module-app-client-id. Declared explicitly
          rather than relying on `secrets: inherit`: the existing callers
          do not inherit, and a called workflow receives no secret it has
          not declared.
        required: false

# NO permissions block, deliberately. A reusable workflow's permissions
# block is a ceiling, not a floor: it CAPS what the caller grants and can
# never widen it. The `contents: read` that used to sit here silently
# stripped the `id-token: write` an AWS-touching caller granted, so
# zcbctl found no ACTIONS_ID_TOKEN_REQUEST_URL, decided it was on a
# laptop, and went looking for a kubeconfig that does not exist on a
# runner (go-core, 2026-08-20 — the same ceiling bug release-public
# shipped, one workflow over).
#
# With no block here, jobs inherit exactly what the caller grants, and
# the caller is the right owner of that decision: it knows whether it is
# public and whether its recipes reach AWS or the cluster. Callers
# declare, at workflow level:
#
#   permissions:
#     contents: read     # always — checkout
#     id-token: write    # ONLY if recipes reach AWS/k8s through sluisctl
#     packages: read     # ONLY if it installs @truvity packages from GitHub Packages
#
# Public repositories omit id-token: fork PRs never receive it, and
# nothing in a public repository's recipes should want it. A caller with
# NO permissions block hands its org-default token to every recipe —
# declare the block.

jobs:
  # A public repository runs on GitHub-hosted runners, always. This refuses
  # anything else BEFORE a job could land on the estate's own infrastructure,
  # which is why it hard-codes its own runner rather than taking the caller's.
  #
  # The runner group's "allow public repositories" setting is the hard stop
  # and stays off; this is the second lock, and it exists because the way a
  # public repository ends up on a self-hosted tier is not malice — it is
  # copying a private repository's caller, which currently succeeds silently.
  # Every runner input the caller can set is checked, not only the default.
  #
  # SKIPPED for a private caller. The rule can only refuse a public
  # repository, so for a private one the job proved nothing -- and it
  # still cost a hosted job, which a private repository pays for at the
  # 1-minute minimum, on every CI and security run. Only an explicit
  # `private` skips: an event whose payload carries no visibility (a
  # `schedule`, for one) still runs the guard, as before. The jobs below
  # need this one and accept it skipped; they never run after it failed.
  runners:
    name: runners
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: truvity/ci-actions/public-runners@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        with:
          runners: >-
            ${{ inputs.runner }} ${{ inputs.small-runner }} ${{ inputs.medium-runner }}
          visibility: ${{ github.event.repository.visibility }}

  # Cheap, and separate: a repository that pins an untagged commit of this
  # library is a repository nobody can say the CI version of. The action
  # needs no token (the tag list comes from `git ls-remote` on a public
  # repository) and no toolchain, so it runs on the smallest runner the
  # caller has and finishes in seconds: XSMALL in runner-sizes.yaml, and
  # small-runner (or runner) where the organisation has no XSMALL label
  # or the caller is not on the preview tier.
  #
  # `uses:` checks the action out for us, which is why there is no second
  # `actions/checkout` here and no reference to `github.job_workflow_sha`
  # (actionlint does not know that context and would red every caller).
  pins:
    name: pins
    needs: runners
    # A plain `needs` would skip this whenever the guard is skipped.
    if: ${{ !cancelled() && (needs.runners.result == 'success' || needs.runners.result == 'skipped') }}
    # runner-sizes.yaml; the literal is rendered by hack/runner-sizes.sh.
    runs-on: >-
      ${{ (inputs.runner != ''
           && (inputs.runner == vars.CI_RUNNER_LABEL_XSMALL || inputs.runner == vars.CI_RUNNER_LABEL_SMALL
               || inputs.runner == vars.CI_RUNNER_LABEL_MEDIUM || inputs.runner == vars.CI_RUNNER_LABEL_LARGE
               || inputs.runner == vars.CI_RUNNER_LABEL_XLARGE)
           && vars[format('CI_RUNNER_LABEL_{0}',
                fromJSON('{"#":"check/pins","*:pins":"XSMALL"}')[format('{0}:pins', github.repository)]
                || fromJSON('{"#":"check/pins","*:pins":"XSMALL"}')['*:pins']
                || 'MEDIUM')])
          || (inputs.small-runner != '' && inputs.small-runner || inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads workflow files only; no LFS objects needed.
          lfs: false
          fetch-depth: 1

      - uses: truvity/ci-actions/tagged-pins@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0

  # Opt-in, and report-only unless the caller asks for strict: the
  # component contract's checkable rules, one line each, in the job log
  # and the job summary. Always on a hosted runner, whatever the caller's
  # runner inputs say: it reads the checkout and nothing else, needs no
  # estate access, and needs jq, which a hosted runner guarantees and a
  # self-hosted image need not carry. Full history, because C5 compares
  # the CHANGELOG against the latest tag.
  policy-conformance:
    name: policy-conformance
    if: inputs.policy-conformance && !cancelled() && (needs.runners.result == 'success' || needs.runners.result == 'skipped')
    needs: runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads repository metadata for the rules; no LFS objects needed.
          lfs: false
          fetch-depth: 0

      - uses: truvity/ci-actions/policy-conformance@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        with:
          strict: ${{ inputs.policy-conformance-strict && 'true' || 'false' }}

  recipe:
    name: ${{ matrix.recipe }}
    needs: runners
    if: ${{ !cancelled() && (needs.runners.result == 'success' || needs.runners.result == 'skipped') }}
    # Resolved per matrix entry, so `name:` stays the recipe and the
    # status contexts do not move. Renaming a job renames the required
    # check and wedges every open PR — twice already.
    #
    # On the preview tier (`runner` is one of the organisation's
    # CI_RUNNER_LABEL_<SIZE> labels) the size comes from runner-sizes.yaml:
    # the row for this repository and recipe, else the "*" row for the
    # recipe, else MEDIUM; the label is CI_RUNNER_LABEL_<that size>. Anything
    # else (a hosted label, the stable tier, an organisation without that
    # size's variable) keeps the old resolution below: small-recipes,
    # medium-recipes, then `runner`. The literal is rendered by
    # hack/runner-sizes.sh; edit the table, not the literal.
    runs-on: >-
      ${{ (inputs.runner != ''
           && (inputs.runner == vars.CI_RUNNER_LABEL_XSMALL || inputs.runner == vars.CI_RUNNER_LABEL_SMALL
               || inputs.runner == vars.CI_RUNNER_LABEL_MEDIUM || inputs.runner == vars.CI_RUNNER_LABEL_LARGE
               || inputs.runner == vars.CI_RUNNER_LABEL_XLARGE)
           && vars[format('CI_RUNNER_LABEL_{0}',
                fromJSON('{"#":"check/recipe","*:vuln":"MEDIUM","truvity/gitops:ci-verify":"LARGE","truvity/gitops:lint":"LARGE","truvity/gitops:ci-verify-guard":"LARGE","truvity/gitops:ci-verify-pins":"LARGE","truvity/gitops:vuln":"LARGE","truvity/dms:test":"MEDIUM","truvity/dms:test-sdk-java":"MEDIUM","truvity/eudi:build":"MEDIUM","truvity/eudi:test":"MEDIUM","truvity/eudi:lint":"MEDIUM","truvity/docs:build":"MEDIUM","truvity/docs:lint":"MEDIUM","truvity/docs:test":"MEDIUM","truvity/keycloak:charts":"MEDIUM","truvity/keycloak:library":"MEDIUM","trust-form/wallet:ci":"XLARGE","trust-form/trustform-front:build":"XLARGE","trust-form/cra-ext-front:build":"MEDIUM","trust-form/cra-ext-front:lint":"MEDIUM","trust-form/internal-dashboard-backend:build":"MEDIUM","trust-form/internal-dashboard-backend:test":"MEDIUM","trust-form/internal-dashboard-backend:lint":"MEDIUM","trust-form/internal-dashboard-frontend:build":"MEDIUM","trust-form/internal-dashboard-frontend:typecheck":"MEDIUM","trust-form/internal-dashboard-frontend:lint":"MEDIUM","trust-form/openapi-contracts:lint":"MEDIUM","trust-form/public-api:lint":"MEDIUM","trust-form/schemas-library:build":"MEDIUM","trust-form/schemas-library:lint":"MEDIUM","trust-form/schemas-library:test":"MEDIUM","trust-form/tf-bughunter:build":"MEDIUM","trust-form/tf-config:lint":"MEDIUM","trust-form/wallet-mobile:lint":"MEDIUM","trust-form/wallet-mobile:test":"MEDIUM"}')[format('{0}:{1}', github.repository, matrix.recipe)]
                || fromJSON('{"#":"check/recipe","*:vuln":"MEDIUM","truvity/gitops:ci-verify":"LARGE","truvity/gitops:lint":"LARGE","truvity/gitops:ci-verify-guard":"LARGE","truvity/gitops:ci-verify-pins":"LARGE","truvity/gitops:vuln":"LARGE","truvity/dms:test":"MEDIUM","truvity/dms:test-sdk-java":"MEDIUM","truvity/eudi:build":"MEDIUM","truvity/eudi:test":"MEDIUM","truvity/eudi:lint":"MEDIUM","truvity/docs:build":"MEDIUM","truvity/docs:lint":"MEDIUM","truvity/docs:test":"MEDIUM","truvity/keycloak:charts":"MEDIUM","truvity/keycloak:library":"MEDIUM","trust-form/wallet:ci":"XLARGE","trust-form/trustform-front:build":"XLARGE","trust-form/cra-ext-front:build":"MEDIUM","trust-form/cra-ext-front:lint":"MEDIUM","trust-form/internal-dashboard-backend:build":"MEDIUM","trust-form/internal-dashboard-backend:test":"MEDIUM","trust-form/internal-dashboard-backend:lint":"MEDIUM","trust-form/internal-dashboard-frontend:build":"MEDIUM","trust-form/internal-dashboard-frontend:typecheck":"MEDIUM","trust-form/internal-dashboard-frontend:lint":"MEDIUM","trust-form/openapi-contracts:lint":"MEDIUM","trust-form/public-api:lint":"MEDIUM","trust-form/schemas-library:build":"MEDIUM","trust-form/schemas-library:lint":"MEDIUM","trust-form/schemas-library:test":"MEDIUM","trust-form/tf-bughunter:build":"MEDIUM","trust-form/tf-config:lint":"MEDIUM","trust-form/wallet-mobile:lint":"MEDIUM","trust-form/wallet-mobile:test":"MEDIUM"}')[format('*:{0}', matrix.recipe)]
                || 'MEDIUM')])
          || (contains(fromJSON(inputs.small-recipes), matrix.recipe)
           && inputs.small-runner != '')
          && inputs.small-runner
          || ((contains(fromJSON(inputs.medium-recipes), matrix.recipe)
               && inputs.medium-runner != '')
              && inputs.medium-runner || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Plain job env, deliberately NOT written through $GITHUB_ENV. Any
    # `echo "K=$V" >> $GITHUB_ENV` lets a value containing a newline
    # define FURTHER variables — CodeQL flags it, and it is right to.
    # Set here the value is passed, never parsed. Unset by every Truvity
    # caller, in which case this is an empty string and recipes behave
    # exactly as they did before the secret existed.
    env:
      GITLAB_TOKEN: ${{ secrets.gitlab-token }}
      # GitHub Packages wants a token to install even a public package.
      # The job's own, which reads only what the caller's `packages: read`
      # grants; a caller whose packages come from nowhere else ignores it.
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
      # The warm-cache reference, only for the recipes that build images
      # through the remote builders; empty everywhere else.
      CI_BUILDX_CACHE: ${{ contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe) && inputs.buildx-cache || '' }}
      # The bazel-remote address, from the input or the caller's org
      # variable; empty when neither is set.
      CI_BAZEL_REMOTE_CACHE: ${{ inputs.bazel-remote-cache || vars.CI_BAZEL_REMOTE_CACHE }}
    strategy:
      # Every recipe reports its own verdict, and one failure does not
      # hide the others — the point of separate jobs in the first place.
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(inputs.recipes) }}
    steps:
      # Opted in to the remote builders with no builders given: refuse
      # now, with the reason, instead of failing later in a `docker build`
      # with no daemon. The builders are only reachable from the CI
      # plane's runners, so the caller passes them together with an ARC
      # runner label.
      - name: Remote builders need remote-builders
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe) && inputs.remote-builders == ''
        run: |
          echo "::error::recipe '$RECIPE' is listed in remote-builder-recipes but remote-builders is empty; pass vars.CI_REMOTE_BUILDERS together with an ARC runner label as runner/small-runner/medium-runner."
          exit 1
        env:
          RECIPE: ${{ matrix.recipe }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: truvity/ci-actions/stable-mtimes@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        if: inputs.stable-mtimes

      - uses: truvity/ci-actions/setup-devbox@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        with:
          devbox-config: ${{ inputs.devbox-config }}
          proto: ${{ inputs.proto }}
          aws-config-file: ${{ inputs.aws-config-file }}
          go-cache-bucket: ${{ inputs.go-cache-bucket }}
          go-cache-region: ${{ inputs.go-cache-region }}
          go-cache-endpoint: ${{ inputs.go-cache-endpoint || vars.CI_GOCACHE_S3_ENDPOINT }}
          go-cache-path-style: ${{ inputs.go-cache-path-style || vars.CI_GOCACHE_S3_PATH_STYLE }}
          goproxy: ${{ inputs.goproxy || vars.CI_GOPROXY }}
          go-private: ${{ inputs.go-private }}
          codeartifact-domain: ${{ inputs.codeartifact-domain }}
          codeartifact-domain-owner: ${{ inputs.codeartifact-domain-owner }}
          codeartifact-region: ${{ inputs.codeartifact-region }}
          module-app-client-id: ${{ inputs.module-app-client-id }}
          module-app-private-key: ${{ secrets.module-app-private-key }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Registry override only when the cache answers a 2s ping —
      # fallback-not-dependency. npm_config_registry covers
      # npm and yarn classic (classic still FETCHES lockfile-resolved
      # URLs, so at worst it bypasses the cache); YARN_NPM_REGISTRY_SERVER
      # covers berry, whose npm protocol derives fetch URLs from the
      # configured registry at install time. The GITHUB_ENV writes carry
      # nothing but a URL that matched a strict pattern (no whitespace,
      # quotes or newlines), which is what the job-env doctrine above
      # actually guards against.
      - name: Point npm and yarn at the CI-plane cache
        # No runner test: the step asks the registry. A configured
        # `CI_NPM_REGISTRY` is probed wherever the job runs; while it is
        # unset the legacy in-cluster address is probed silently, which
        # answers on an ARC runner and is a quiet no-op anywhere else.
        if: inputs.node-cache
        env:
          NPM_REGISTRY: ${{ inputs.npm-registry || vars.CI_NPM_REGISTRY }}
        run: |
          set -euo pipefail
          # A value the RUNNER exports (CI_RUNNER_NPM_REGISTRY, from its pod
          # spec or task definition) wins over the input and the org variable:
          # a pool that reaches the registry by another name carries its own.
          # Unset, nothing changes. Only the source is logged here.
          runner_registry="${CI_RUNNER_NPM_REGISTRY:-}"
          runner_registry="${runner_registry//[[:space:]]/}"
          if [ -n "$runner_registry" ]; then
            NPM_REGISTRY="$runner_registry"
            echo "npm registry: from the runner (CI_RUNNER_NPM_REGISTRY)"
          elif [ -n "${NPM_REGISTRY:-}" ]; then
            echo "npm registry: from the input or organisation variable"
          else
            echo "npm registry: unset, the legacy in-cluster default is probed"
          fi
          # The address is the org variable `CI_NPM_REGISTRY` (input
          # `npm-registry`). LEGACY FALLBACK: while it is unset, the old
          # in-cluster name is probed exactly as before; delete the default
          # below once the variable is set org-wide.
          legacy=""
          [ -n "${NPM_REGISTRY:-}" ] || legacy=1
          registry="${NPM_REGISTRY:-http://npm-cache.ci-cache.svc}"
          registry="${registry%/}"
          re='^(https?)://([A-Za-z0-9.-]+)(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'
          if ! [[ "$registry" =~ $re ]]; then
            echo "::warning::npm registry is not a plain http(s) URL — direct npmjs for this job"
          elif curl -fsS --max-time 2 "$registry/-/ping" >/dev/null 2>&1; then
            # YARN_UNSAFE_HTTP_WHITELIST: berry refuses plain-http registries
            # outright (YN0081 "Unsafe http requests must be explicitly
            # whitelisted"), so an http registry is whitelisted by host; an
            # https one needs nothing. The value is matched against a strict
            # pattern above, so nothing but a URL can ride GITHUB_ENV.
            {
              echo "npm_config_registry=$registry"
              echo "YARN_NPM_REGISTRY_SERVER=$registry"
              if [ "${BASH_REMATCH[1]}" = http ]; then
                echo "YARN_UNSAFE_HTTP_WHITELIST=${BASH_REMATCH[2]}"
              fi
            } >> "$GITHUB_ENV"
            echo "npm cache: $registry answered — registry override active"
          elif [ -n "$legacy" ]; then
            # Nothing configured and the old address is silent: not a
            # fault, e.g. a GitHub-hosted runner. No warning.
            echo "npm cache: none configured, legacy address silent — direct npmjs for this job"
          else
            echo "::warning::npm cache unreachable — direct npmjs for this job"
          fi

      # Only the lint job. Build and test outputs ride GOCACHEPROG or the
      # plain Go cache, modules ride the proxy, nix rides the
      # read-through — golangci's analysis cache is the one thing nothing
      # else covers, and it is the slowest recipe in the estate.
      #
      # devbox.lock in the key: a toolchain bump strands a cache whose
      # objects reference the old nix store path, and that fails at exec
      # time rather than missing cleanly.
      #
      # Keyed on devbox.lock + go.sum, NOT on the commit, and saved only
      # when that exact key is missing (below). From v3.26.3 the key carried
      # the commit and every run saved a new ~25 MB to ~1.9 GB cache: the
      # biggest writer of Actions cache in the estate, and on a self-hosted
      # runner every byte of it crossed the NAT. Now the first run after a
      # dependency or toolchain bump saves one cache; later runs restore it.
      # The price is that the analysis of packages changed since that bump is
      # redone on every run until the next bump; golangci-lint invalidates
      # per package, so that is the changed packages only.
      #
      # s3-cache/restore reads the CI cache bucket on a self-hosted runner
      # when the caller passes go-cache-bucket (traffic stays inside the
      # region, none of it through the NAT) and GitHub's cache everywhere
      # else.
      - uses: truvity/ci-actions/s3-cache/restore@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        id: golangci-cache
        if: matrix.recipe == inputs.lint-recipe
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-
          bucket: ${{ inputs.go-cache-bucket }}
          region: ${{ inputs.go-cache-region }}
          endpoint: ${{ inputs.go-cache-endpoint || vars.CI_GOCACHE_S3_ENDPOINT }}
          path-style: ${{ inputs.go-cache-path-style || vars.CI_GOCACHE_S3_PATH_STYLE }}

      # The caller's own caches (`cache-paths`), from the CI cache bucket the
      # way the golangci-lint one is. The key is the OS, the architecture, the
      # recipe and the hash of `cache-key-files` (the usual lockfiles when
      # empty), so a change of a dependency starts a new cache and the newest
      # earlier one of the same recipe warms it. Nothing runs without
      # `cache-paths`.
      - uses: truvity/ci-actions/s3-cache/restore@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        id: caller-cache
        if: inputs.cache-paths != ''
        with:
          path: ${{ inputs.cache-paths }}
          key: caller-${{ runner.os }}-${{ runner.arch }}-${{ matrix.recipe }}-${{ inputs.cache-key-files != '' && hashFiles(inputs.cache-key-files) || hashFiles('**/gradle.lockfile', '**/yarn.lock', '**/package-lock.json', '**/pnpm-lock.yaml', '**/go.sum', 'devbox.lock') }}
          restore-keys: |
            caller-${{ runner.os }}-${{ runner.arch }}-${{ matrix.recipe }}-
          bucket: ${{ inputs.go-cache-bucket }}
          region: ${{ inputs.go-cache-region }}
          endpoint: ${{ inputs.go-cache-endpoint || vars.CI_GOCACHE_S3_ENDPOINT }}
          path-style: ${{ inputs.go-cache-path-style || vars.CI_GOCACHE_S3_PATH_STYLE }}

      # Through env, never spliced into the script: a ${{ }} expression is
      # pasted in before bash parses the line, so a value carrying a quote
      # or $( ) would execute.
      #
      # CAVEAT: devbox.json's own `env` WINS over anything set here, for
      # the same variable name, inside `devbox run`. Measured in one
      # caller across four runs (2026-08-16) with a deliberate conflict.
      - name: Caller-supplied environment
        if: inputs.env-json != '{}'
        run: |
          python3 -c 'import json,os; [print(f"{k}={v}") for k,v in json.loads(os.environ["ENV_JSON"]).items()]' \
            >> "$GITHUB_ENV"
        env:
          ENV_JSON: ${{ inputs.env-json }}

      # The remote BuildKit builders, for the recipes that opted in. The
      # registry login comes first: whatever it writes to
      # ~/.docker/config.json is forwarded to the builder when it pulls
      # base images and pushes the warm cache. The login uses the pool's
      # ambient pod identity, the same way integration.yaml's image lanes
      # do. "Plan the remote builders" fails by itself on an empty
      # `remote-builders`.
      - name: ECR registry to log into
        id: ecr
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe)
        env:
          REGISTRIES: ${{ inputs.ecr-registries }}
          CACHE: ${{ inputs.buildx-cache }}
        run: |
          set -euo pipefail
          # Which BuildKit cache the recipe gets: a runner that exports
          # CI_RUNNER_BUILDX_CACHE names the cache of ITS tier (a preview and a stable
          # runner each have the registry cache of their own account) and wins over the
          # input, the caller's organisation variable. It replaces the job-level
          # CI_BUILDX_CACHE for the steps after this one (GITHUB_ENV outranks the job's
          # env; the value is checked below to be one plain registry reference).
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf %s "$v"; }
          ref_re='^[a-z0-9][a-z0-9.-]*(:[0-9]+)?/[a-z0-9][a-z0-9._/-]*$'
          CACHE="$(trim "$CACHE")"
          runner="$(trim "${CI_RUNNER_BUILDX_CACHE:-}")"
          if [ -n "$runner" ]; then
            [[ "$runner" =~ $ref_re ]] || { echo "::error::CI_RUNNER_BUILDX_CACHE is not a registry reference (<registry>/<repository>, no tag)"; exit 1; }
            CACHE="$runner"
            echo "CI_BUILDX_CACHE=$CACHE" >> "$GITHUB_ENV"
            echo "buildx cache: $CACHE (from the runner's CI_RUNNER_BUILDX_CACHE)"
          elif [ -n "$CACHE" ]; then
            echo "buildx cache: $CACHE (from the input)"
          fi
          # <account>.dkr.ecr.<region>.amazonaws.com/<repo>: the account is
          # the first DNS label. A cache reference that is not an ECR one
          # leaves the registries empty and skips the login.
          if [ -z "$REGISTRIES" ] && [[ "$CACHE" =~ ^([0-9]+)\.dkr\.ecr\. ]]; then
            REGISTRIES="${BASH_REMATCH[1]}"
          fi
          echo "registries=$REGISTRIES" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe) && steps.ecr.outputs.registries != ''
        with:
          registries: ${{ steps.ecr.outputs.registries }}
          mask-password: "true"

      # A runner that gets the BuildKit client certificate as environment
      # variables (CI_BUILDKIT_TLS_CA_PEM, CI_BUILDKIT_TLS_CERT_PEM and
      # CI_BUILDKIT_TLS_KEY_PEM, e.g. container-task secrets) gets it written
      # to a fresh directory and exported as CI_BUILDKIT_TLS_DIR, which the
      # next step reads. With CI_BUILDKIT_TLS_DIR already set, or none of
      # them, it changes nothing; a half-set certificate fails here.
      - uses: truvity/ci-actions/setup-buildkit-tls@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe)

      # The CI plane's BuildKit builders as one remote-driver buildx builder
      # (`ci`): one node per `platforms=endpoint` entry, native builds on a
      # hot layer cache, no QEMU. The first node is the builder itself, the
      # rest are appended. Transport comes from the runner, not from here:
      # when the runner provides CI_BUILDKIT_TLS_DIR (a directory holding
      # ca.pem, cert.pem and key.pem; the step above writes one from the
      # CI_BUILDKIT_TLS_*_PEM variables) every node is dialled with mutual
      # TLS; without it the nodes are plain TCP, as before. An optional
      # CI_BUILDKIT_TLS_SERVERNAME overrides the certificate name the
      # builders are verified against (buildx defaults to the endpoint host).
      # Every entry is matched against a strict pattern before it can reach
      # a step output.
      - name: Plan the remote builders
        id: builders
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe)
        env:
          NODES: ${{ inputs.remote-builders }}
        run: |
          set -euo pipefail
          set -f
          fail() { echo "::error::$*"; exit 1; }
          # The list a RUNNER exports (CI_RUNNER_REMOTE_BUILDERS, same format)
          # wins over the input: a pool that reaches the builders by other
          # names carries its own. Whether builders are used at all stays the
          # caller's choice; unset, nothing changes. Only the source is logged.
          if [ -n "$(printf %s "${CI_RUNNER_REMOTE_BUILDERS:-}" | tr -d "[:space:]")" ]; then
            NODES="$CI_RUNNER_REMOTE_BUILDERS"
            echo "builders: nodes from the runner (CI_RUNNER_REMOTE_BUILDERS)"
          else
            echo "builders: nodes from the input"
          fi
          [ -n "${NODES//[[:space:]]/}" ] || fail "remote-builders is empty — set the org variable, export CI_RUNNER_REMOTE_BUILDERS from the runner, or skip this step"

          opts=""
          tls_dir="${CI_BUILDKIT_TLS_DIR:-}"
          if [ -n "$tls_dir" ]; then
            [[ "$tls_dir" =~ ^/[A-Za-z0-9._/-]+$ ]] || fail "CI_BUILDKIT_TLS_DIR is not a plain absolute path"
            for f in ca.pem cert.pem key.pem; do
              [ -r "$tls_dir/$f" ] || fail "CI_BUILDKIT_TLS_DIR is set but $tls_dir/$f is not readable"
            done
            opts="cacert=$tls_dir/ca.pem"$'\n'"cert=$tls_dir/cert.pem"$'\n'"key=$tls_dir/key.pem"
            servername="${CI_BUILDKIT_TLS_SERVERNAME:-}"
            if [ -n "$servername" ]; then
              [[ "$servername" =~ ^[A-Za-z0-9.-]+$ ]] || fail "CI_BUILDKIT_TLS_SERVERNAME is not a plain DNS name"
              opts+=$'\n'"servername=$servername"
            fi
            echo "builders: mutual TLS, credentials from $tls_dir"
          else
            echo "builders: plain TCP (CI_BUILDKIT_TLS_DIR is not set)"
          fi

          n=0; want=""; append=""; endpoint=""; platforms=""
          for entry in $NODES; do
            [[ "$entry" == *=* ]] || fail "builder entry '$entry' is not platforms=endpoint"
            p="${entry%%=*}"; e="${entry#*=}"
            [[ "$p" =~ ^[a-z0-9_./,-]+$ ]] || fail "builder platforms '$p' are not a platform list"
            [[ "$e" =~ ^(tcp|unix)://[][A-Za-z0-9._:/@-]+$ ]] || fail "builder endpoint '$e' is not a tcp:// or unix:// address"
            want+="${want:+,}$p"
            if [ "$n" = 0 ]; then
              endpoint="$e"; platforms="$p"
            else
              append+="- name: ci$n"$'\n'"  endpoint: $e"$'\n'"  platforms: $p"$'\n'
              if [ -n "$opts" ]; then
                append+="  driver-opts:"$'\n'
                while IFS= read -r o; do append+="    - $o"$'\n'; done <<<"$opts"
              fi
            fi
            n=$((n+1))
          done

          {
            echo "endpoint=$endpoint"
            echo "platforms=$platforms"
            echo "want=$want"
            echo "driver-opts<<EOF_OPTS"; printf '%s\n' "$opts"; echo "EOF_OPTS"
            echo "append<<EOF_APPEND"; printf '%s' "$append"; echo "EOF_APPEND"
          } >> "$GITHUB_OUTPUT"
          echo "builders: $n node(s), platforms $want"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe)
        with:
          driver: remote
          name: ci
          endpoint: ${{ steps.builders.outputs.endpoint }}
          platforms: ${{ steps.builders.outputs.platforms }}
          driver-opts: ${{ steps.builders.outputs.driver-opts }}
          append: ${{ steps.builders.outputs.append }}

      # Later steps (and the recipes' own `docker build`) reach the builder
      # through BUILDX_BUILDER. Fail here, with the reason, when a node does
      # not offer the platform it was declared for.
      - name: Check the builders offer their platforms
        if: contains(fromJSON(inputs.remote-builder-recipes), matrix.recipe)
        env:
          WANT: ${{ steps.builders.outputs.want }}
          GOT: ${{ steps.buildx.outputs.platforms }}
        run: |
          set -euo pipefail
          echo "BUILDX_BUILDER=ci" >> "$GITHUB_ENV"
          for p in ${WANT//,/ }; do
            case ",$GOT," in
              *",$p,"*) ;;
              *) echo "::error::builder ci does not offer $p (offers: $GOT)"; exit 1 ;;
            esac
          done

      - uses: truvity/ci-actions/recipe@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        with:
          recipe: ${{ matrix.recipe }}
          command: ${{ inputs.command }}
          devbox-config: ${{ inputs.devbox-config }}

      # The high-water mark, straight from the kernel. cgroup v2 keeps it
      # for free, so a job can report what it ACTUALLY needed instead of
      # leaving everyone to infer it from a snapshot — which is how the
      # estate ended up sizing runners at 10Gi against a measurement
      # taken on one node, and OOM-killing on another.
      #
      # Per recipe, because each recipe is its own job here: `lint` and
      # `build` have very different appetites and averaging them is how
      # the number stopped meaning anything.
      - name: peak memory
        if: always()
        # Reporting only: whatever is missing here, the step ends green.
        # `continue-on-error` is belt and braces for the arithmetic below.
        continue-on-error: true
        run: |
          # The cgroup v2 root, which is the job's own wherever the runner
          # has a private cgroup namespace (ARC pods).
          cg=/sys/fs/cgroup
          peak=$cg/memory.peak
          max=$cg/memory.max
          # Hosted runners are not in a memory-limited cgroup, and a
          # runner without cgroup v2 memory accounting (ECS Fargate
          # exposes no memory.peak to the task) has nothing to read.
          # Nothing to report and nothing to fail on: say so in the log
          # and stop. Fargate could be measured later through the task
          # metadata endpoint ($ECS_CONTAINER_METADATA_URI_V4/task/stats,
          # memory_stats.max_usage); that is not wired here.
          if [ ! -r "$peak" ]; then
            echo "peak memory: not available on this runner (no readable cgroup v2 memory.peak)"
            exit 0
          fi
          raw=$(cat "$peak" 2>/dev/null || true)
          case "$raw" in
            ''|*[!0-9]*) echo "peak memory: unreadable value '$raw' in $peak"; exit 0 ;;
          esac

          used=$(( raw / 1048576 ))
          limit=$(cat "$max" 2>/dev/null || echo max)

          # memory.events separates "filled the cgroup" from "was killed".
          # memory.peak counts reclaimable page cache, so touching the
          # limit is routine — the kernel evicts cache and moves on. What
          # matters is `max` (allocation stalled at the ceiling) and
          # `oom_kill` (it did not survive). Reporting only the peak would
          # make every cache-heavy job look like it is about to die.
          hits=0; kills=0
          if [ -r "$cg/memory.events" ]; then
            hits=$(awk '$1=="max"{print $2}' "$cg/memory.events")
            kills=$(awk '$1=="oom_kill"{print $2}' "$cg/memory.events")
          fi

          case "$limit" in
            max|''|*[!0-9]*) line="**${RECIPE}** peak ${used} MiB (no cgroup limit)" ;;
            *)
              limit=$(( limit / 1048576 ))
              pct=$(( used * 100 / limit ))
              line="**${RECIPE}** peak ${used} MiB of ${limit} MiB (${pct}%), ${hits} limit hits, ${kills} OOM kills"
              ;;
          esac

          # Both places on purpose. The summary is where a human looks;
          # the log is the only one a script can read, and sizing runners
          # means collecting this across many runs, not reading
          # it off a web page one at a time.
          echo "$line"
          echo "- $line" >> "$GITHUB_STEP_SUMMARY"

          # Allocation stalling at the ceiling is the actionable signal —
          # it precedes the kill, and the kill itself is invisible from
          # GitHub (the runner just stops, and the step reads as hung).
          if [ "${hits:-0}" -gt 0 ]; then
            echo "::warning::${RECIPE} hit its memory limit ${hits}x (peak ${used} MiB); raise the limit or lower GOMAXPROCS"
          fi
        env:
          RECIPE: ${{ matrix.recipe }}

      # if: always() — otherwise a failing lint kills the job before the
      # post step and the cache is never written, which is exactly when
      # someone is iterating and most wants it warm. cache-hit is true only
      # on an exact key, so the save runs when the devbox.lock + go.sum key
      # is missing and not otherwise (a restore-keys match is a miss here).
      - uses: truvity/ci-actions/s3-cache/save@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        if: always() && matrix.recipe == inputs.lint-recipe && steps.golangci-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-cache.outputs.cache-primary-key }}
          bucket: ${{ inputs.go-cache-bucket }}
          region: ${{ inputs.go-cache-region }}
          endpoint: ${{ inputs.go-cache-endpoint || vars.CI_GOCACHE_S3_ENDPOINT }}
          path-style: ${{ inputs.go-cache-path-style || vars.CI_GOCACHE_S3_PATH_STYLE }}

      # Saved also when the recipe failed, and only when the exact key was
      # missing (a restore-keys match is a miss here).
      - uses: truvity/ci-actions/s3-cache/save@4ac94844ffaf6f09829478979e61f421fe28d38a # v3.6.4
        if: always() && inputs.cache-paths != '' && steps.caller-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ steps.caller-cache.outputs.cache-primary-key }}
          bucket: ${{ inputs.go-cache-bucket }}
          region: ${{ inputs.go-cache-region }}
          endpoint: ${{ inputs.go-cache-endpoint || vars.CI_GOCACHE_S3_ENDPOINT }}
          path-style: ${{ inputs.go-cache-path-style || vars.CI_GOCACHE_S3_PATH_STYLE }}
