# The workhorse. One reusable workflow for every repository in both
# organizations, every language, either task runner, either runner flow.
#
# ONE JOB, RUN IN ORDER. The recipes run sequentially in a single job
# rather than fanning out, because the bootstrap dominates: nix plus
# devbox is ~36s, and six recipes previously meant six runners paying it
# six times — on ARC, six whole nodes (one-runner-per-node until
# INF-550) for a couple of minutes of actual work.
#
# Sequential also makes the work cheaper, not only the setup: `build`
# and `test` in the same workspace share the local Go build cache, so
# `test` stops recompiling what `build` just produced. The cost is
# honest and worth stating — wall-clock is now the SUM of the recipes
# rather than the slowest of them.
#
# It serves `moon` repositories too. A monorepo is the same shape with a
# different task runner and a one-item list: `command: moon`,
# `recipes: '["ci"]'`, `fetch-depth: 0`. That is why there is no
# separate moon-check.yaml any more.
name: check

on:
  workflow_call:
    inputs:
      recipes:
        description: >-
          JSON array of the recipes this repository wants, e.g.
          '["build","test","lint"]'. It is a SET, not a sequence — the
          ORDER is the canonical one below, so nine repositories cannot
          each invent their own. The working tree is checked for
          modifications after every one.

          A recipe not in the canonical list needs a step adding here.
          That is deliberate friction: the vocabulary is small and shared
          on purpose.
        required: true
        type: string
      command:
        description: >-
          Task runner in front of each recipe — `just` for the Justfile
          estate, `moon` for monorepos.
        required: false
        type: string
        default: just
      runner:
        description: >-
          Runner label. Hosted repos leave the default; ARC callers pass
          their scale-set name (vars.CI_RUNNER_LABEL).
        required: false
        type: string
        default: ubuntu-latest
      fetch-depth:
        description: >-
          0 for repositories whose task runner compares against the base
          ref — moon decides what is affected that way, and a shallow
          clone silently makes it run everything.
        required: false
        type: number
        default: 1
      proto:
        description: auto | true | false. Leave it alone; the action detects .prototools.
        required: false
        type: string
        default: auto
      aws-config-file:
        description: >-
          Workspace-relative path to a CI-shaped AWS config (e.g.
          aws-ci.ini). Resolved to an absolute path INSIDE the action,
          which is the only place that can: the github.workspace context
          is EMPTY when a caller evaluates it in `with:`.
        required: false
        type: string
        default: ''
      go-cache-bucket:
        description: ARC only — from the caller's org variable, never hard-coded here.
        required: false
        type: string
        default: ''
      go-cache-region:
        required: false
        type: string
        default: ''
      goproxy:
        required: false
        type: string
        default: ''
      env-json:
        description: >-
          Extra environment as a JSON object, for repo-specific values the
          shared workflow should not know about.
        required: false
        type: string
        default: '{}'
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: truvity/ci-workflows/.github/actions/setup-devbox@83db2219dc4de7c1cee3cd01e9c2cc85544e7fe9
        with:
          proto: ${{ inputs.proto }}
          aws-config-file: ${{ inputs.aws-config-file }}
          go-cache-bucket: ${{ inputs.go-cache-bucket }}
          go-cache-region: ${{ inputs.go-cache-region }}
          goproxy: ${{ inputs.goproxy }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # golangci-lint's analysis cache — the one thing no other cache
      # covers: build and test outputs ride GOCACHEPROG or the plain Go
      # cache, modules ride the proxy, nix rides the read-through. It was
      # missing from every Justfile consumer while moon-check had it, and
      # lint is the slowest recipe in the estate (119s on gitops).
      #
      # devbox.lock in the key: a toolchain bump strands a cache whose
      # objects reference the old nix store path, and that fails at exec
      # time rather than missing cleanly.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: golangci-cache
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: golangci-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-

      # Through env, never spliced into the script: a ${{ }} expression is
      # pasted in before bash parses the line, so a value carrying a quote
      # or $( ) would execute.
      #
      # CAVEAT worth knowing: devbox.json's own `env` WINS over anything
      # set here, for the same variable name, inside `devbox run`.
      # Measured in bar across four runs (2026-08-16) with a deliberate
      # conflict. Variables devbox.json does not set pass through.
      - name: Caller-supplied environment
        if: inputs.env-json != '{}'
        run: |
          python3 -c 'import json,os; [print(f"{k}={v}") for k,v in json.loads(os.environ["ENV_JSON"]).items()]' \
            >> "$GITHUB_ENV"
        env:
          ENV_JSON: ${{ inputs.env-json }}

      # A NAMED STEP PER RECIPE, each guarded on the caller's list. The
      # log then shows "build", "test", "lint" with their own durations
      # and their own ticks, rather than one opaque "Recipes" step — and
      # a red mark names what broke, which was the whole argument for
      # splitting recipes in the first place.
      #
      # The order here IS the estate's order. A caller supplies a set;
      # this decides the sequence, so build precedes test (and warms the
      # local Go build cache for it) everywhere, identically.
      - name: build
        if: contains(fromJSON(inputs.recipes), 'build')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: build, command: "${{ inputs.command }}" }

      - name: test
        if: contains(fromJSON(inputs.recipes), 'test')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: test, command: "${{ inputs.command }}" }

      - name: lint
        if: contains(fromJSON(inputs.recipes), 'lint')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: lint, command: "${{ inputs.command }}" }

      - name: lint-workflows
        if: contains(fromJSON(inputs.recipes), 'lint-workflows')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: lint-workflows, command: "${{ inputs.command }}" }

      - name: lint-provenance
        if: contains(fromJSON(inputs.recipes), 'lint-provenance')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: lint-provenance, command: "${{ inputs.command }}" }

      - name: chart-lint
        if: contains(fromJSON(inputs.recipes), 'chart-lint')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: chart-lint, command: "${{ inputs.command }}" }

      - name: leak-canary
        if: contains(fromJSON(inputs.recipes), 'leak-canary')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: leak-canary, command: "${{ inputs.command }}" }

      - name: verify-generate
        if: contains(fromJSON(inputs.recipes), 'verify-generate')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: verify-generate, command: "${{ inputs.command }}" }

      - name: vuln
        if: contains(fromJSON(inputs.recipes), 'vuln')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: vuln, command: "${{ inputs.command }}" }

      # Last on purpose: it regenerates, so anything it disturbs is its
      # own doing rather than an earlier recipe's.
      - name: drift-check
        if: contains(fromJSON(inputs.recipes), 'drift-check')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: drift-check, command: "${{ inputs.command }}" }

      # moon's single entrypoint. It is not one of the recipes above
      # because `moon ci` IS the whole sequence, decided by moon's task
      # graph rather than by this list.
      - name: ci
        if: contains(fromJSON(inputs.recipes), 'ci')
        uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with: { recipe: ci, command: "${{ inputs.command }}" }

      # if: always() — otherwise a failing build or test kills the job
      # before the post step, and the golangci cache is never written.
      # That is precisely when you are iterating and want it warm: the
      # old per-recipe jobs saved it because lint had a job of its own.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.golangci-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-cache.outputs.cache-primary-key }}
