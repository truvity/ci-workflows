# The workhorse. One reusable workflow for every repository in both
# organizations, every language, on either runner flow.
#
# It fans the caller's Justfile recipes out into PARALLEL jobs, one per
# recipe, each reported under its own name — so a red check says "lint"
# rather than "check", and the recipes no longer queue behind each other.
# The recipes already exist in every repo's Justfile; only CI was
# collapsing them into a single `just check`.
#
# Cost note: N recipes means N runners. On public repositories hosted
# minutes are free, so fan out freely. On ARC each job is currently a whole
# node (one-runner-per-node sizing, INF-550), so keep the list short there
# until density lands.
name: check

on:
  workflow_call:
    inputs:
      recipes:
        description: 'JSON array of Justfile recipes, e.g. ''["build","test","lint"]''.'
        required: true
        type: string
      command-prefix:
        description: >-
          Task runner in front of each recipe. `just` for the Justfile
          estate; `moon` for bar, whose entrypoint is `moon ci` and whose
          parallelism comes from its own task graph.
        required: false
        type: string
        default: just
      runner:
        description: >-
          Runner label. Hosted repos leave the default; ARC callers pass
          their scale-set name (vars.CI_RUNNER_LABEL).
        required: false
        type: string
        default: ubuntu-latest
      execution:
        description: >-
          Ignored, kept so pinned callers keep resolving (an unknown input
          is a hard error for a reusable workflow, so removing it would
          break every consumer on its next bump). The setup action now
          DETECTS whether nix and devbox are baked into the runner image
          instead of being told.
        required: false
        type: string
        default: hosted
      go-cache-bucket:
        description: ARC only — from the caller's org variable, never hard-coded here.
        required: false
        type: string
        default: ''
      go-cache-region:
        required: false
        type: string
        default: ''
      goproxy:
        required: false
        type: string
        default: ''
      env-json:
        description: >-
          Extra environment as a JSON object, for repo-specific values the
          shared workflow should not know about (e.g. AWS_CONFIG_FILE).
        required: false
        type: string
        default: '{}'
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  recipe:
    name: ${{ matrix.recipe }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # Every recipe reports its own verdict, and one failure does not hide
      # the others — the point of splitting them in the first place.
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(inputs.recipes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to a SHA in THIS repository, not @master: a caller's pin of
      # check.yaml has to determine the action too, or it is not a pin.
      - uses: truvity/ci-workflows/.github/actions/setup-devbox@52073e0888d4d63684d020bcedb3705663e93572
        with:
          go-cache-bucket: ${{ inputs.go-cache-bucket }}
          go-cache-region: ${{ inputs.go-cache-region }}
          goproxy: ${{ inputs.goproxy }}

      # Through env, not spliced into the script: a ${{ }} expression is
      # pasted in before bash parses the line, so a value carrying a quote
      # or $( ) would run as code. This workflow is public and callable by
      # repos we do not own.
      - name: Caller-supplied environment
        if: inputs.env-json != '{}'
        run: |
          python3 -c 'import json,os; [print(f"{k}={v}") for k,v in json.loads(os.environ["ENV_JSON"]).items()]' \
            >> "$GITHUB_ENV"
        env:
          ENV_JSON: ${{ inputs.env-json }}

      - run: devbox run -- "$COMMAND_PREFIX" "$RECIPE"
        env:
          COMMAND_PREFIX: ${{ inputs.command-prefix }}
          RECIPE: ${{ matrix.recipe }}
