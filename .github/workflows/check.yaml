# The workhorse. One reusable workflow for every repository in both
# organizations, every language, either task runner, either runner flow.
#
# ONE JOB PER RECIPE, in parallel. This shape was argued both ways in one
# day and the numbers settled it (Oleg, 2026-08-16). Measured on gitops:
# lint 119s, test 95s, build 76s, drift-check 42s, two trivial linters
# 36s each. Parallel is max ≈ 2min; the same recipes in sequence are
# sum ≈ 5min.
#
# Parallel costs MORE runner-minutes — the ~36s bootstrap and the module
# download are paid per job rather than once — and buys less wall-clock
# per pull request. That trade is worth it for a second reason that
# matters more as the estate grows: a job that does ONE thing can be
# sized for that one thing. A single job must be sized for the union of
# every recipe's peak CPU and peak memory at once, and six narrow
# runners pack onto nodes far better than one wide one.
#
# The counter-argument — six runners is six NODES — holds only while ARC
# is one-runner-per-node (INF-550). It stops holding the moment density
# lands, which is why this is the shape to build toward.
#
# It serves `moon` repositories too: a monorepo is `command: moon`,
# `recipes: '["ci"]'`, `fetch-depth: 0` — one job, because moon's task
# graph decides its own parallelism.
name: check

on:
  workflow_call:
    inputs:
      recipes:
        description: >-
          JSON array of recipes. Each becomes its OWN job, running in
          parallel and reporting under its own name, so a red mark says
          "lint" rather than "something". The working tree is checked for
          modifications after each one.
        required: true
        type: string
      command:
        description: Task runner in front of each recipe — just, moon.
        required: false
        type: string
        default: just
      node-cache:
        description: >-
          Probe the CI plane's npm read-through cache
          (npm-cache.ci-cache.svc, INF-581) and point npm and yarn at
          it for the job when it answers; when it does not, leave the
          defaults so a down cache degrades CI to slow, never to
          broken. Meaningful only on ARC runners — hosted runners
          cannot resolve the in-cluster name and take the fallback
          path by construction.
        required: false
        type: boolean
        default: false
      runner:
        description: >-
          Runner label. Hosted repos leave the default; ARC callers pass
          their scale-set name (vars.CI_RUNNER_LABEL_LARGE).

          This is the runner every recipe gets unless it is named in
          `small-recipes` below. It is deliberately the BIG one: an
          unlisted recipe, or one whose name is misspelled in that list,
          lands here and merely costs more, rather than landing on a
          runner too small for it and being OOM-killed — a failure that
          uploads no log and reads as a hang.
        required: false
        type: string
        default: ubuntu-latest
      small-recipes:
        description: >-
          JSON array of recipes that run on `small-runner` instead. Opt
          DOWN, never up: list only recipes whose peak memory you have
          measured, and leave anything unproven on the default.

          Recipes are not one population. On gitops the three linters
          peak at a flat ~4.0Gi while build and lint want 13-20Gi, so a
          single profile means an actionlint job over a handful of YAML
          files holds an entire 32Gi node for 34 seconds. The
          peak-memory line each job prints is the evidence for moving
          one here.
        required: false
        type: string
        default: '[]'
      small-runner:
        description: >-
          Scale-set label for `small-recipes` (vars.CI_RUNNER_LABEL_SMALL).
          Defaults to `runner`, so listing recipes without setting this
          changes nothing.
        required: false
        type: string
        default: ""
      medium-recipes:
        description: >-
          JSON array of recipes that run on `medium-runner` — the
          measured middle (2026-08-27 fleet survey): jobs peaking
          10-13.4Gi that held a 24Gi runner at ~50%. Same opt-DOWN
          rule as small-recipes: measured peaks only, promotion
          evidence is the peak line each job prints. A recipe listed
          in BOTH small and medium goes small (small wins ties).
        required: false
        type: string
        default: '[]'
      medium-runner:
        description: >-
          Scale-set label for `medium-recipes`
          (vars.CI_RUNNER_LABEL_MEDIUM). Defaults to `runner`, so
          listing recipes without setting this changes nothing.
        required: false
        type: string
        default: ""
      fetch-depth:
        description: >-
          0 for repositories whose task runner compares against the base
          ref — moon decides what is affected that way, and a shallow
          clone silently makes it run everything.
        required: false
        type: number
        default: 1
      lint-recipe:
        description: >-
          Which recipe gets the golangci-lint cache. Only that job
          restores and saves it, instead of every job restoring a blob
          most of them never read.
        required: false
        type: string
        default: lint
      proto:
        description: auto | true | false. Leave it alone; the action detects .prototools.
        required: false
        type: string
        default: auto
      aws-config-file:
        description: >-
          Workspace-relative path to a CI-shaped AWS config (e.g.
          aws-ci.ini). Resolved to an absolute path INSIDE the action,
          which is the only place that can: the github.workspace context
          is EMPTY when a caller evaluates it in `with:`.
        required: false
        type: string
        default: ''
      go-cache-bucket:
        description: ARC only — from the caller's org variable, never hard-coded here.
        required: false
        type: string
        default: ''
      go-cache-region:
        required: false
        type: string
        default: ''
      go-private:
        description: >-
          Module path prefix to fetch directly over git rather than
          through the proxy — e.g. "github.com/truvity". Requires the
          module-app-client-id input and module-app-private-key
          secret.
        required: false
        type: string
        default: ''
      module-app-client-id:
        description: >-
          Client id of a GitHub App with contents:read on the private
          module repositories. Public App metadata, hence an input.
          Required when go-private is set.
        required: false
        type: string
        default: ''
      goproxy:
        required: false
        type: string
        default: ''
      env-json:
        description: >-
          Extra environment as a JSON object, for repo-specific values the
          shared workflow should not know about.
        required: false
        type: string
        default: '{}'
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      gitlab-token:
        description: >-
          Read-only GitLab deploy token, exported to recipes as
          GITLAB_TOKEN. For repositories whose dependencies still live in
          GitLab's package or container registry while CI/CD is mid-move.

          OPTIONAL, and unset for every Truvity caller: a caller that
          passes nothing leaves it empty, which is indistinguishable from
          how recipes behaved before it existed. Only the trust-form
          organization supplies it today.
        required: false
      module-app-private-key:
        description: >-
          Private key for module-app-client-id. Declared explicitly
          rather than relying on `secrets: inherit`: the existing callers
          do not inherit, and a called workflow receives no secret it has
          not declared.
        required: false

# NO permissions block, deliberately. A reusable workflow's permissions
# block is a ceiling, not a floor: it CAPS what the caller grants and can
# never widen it. The `contents: read` that used to sit here silently
# stripped the `id-token: write` an AWS-touching caller granted, so
# zcbctl found no ACTIONS_ID_TOKEN_REQUEST_URL, decided it was on a
# laptop, and went looking for a kubeconfig that does not exist on a
# runner (go-core, 2026-08-20 — the same ceiling bug release-public
# shipped, one workflow over).
#
# With no block here, jobs inherit exactly what the caller grants, and
# the caller is the right owner of that decision: it knows whether it is
# public and whether its recipes reach AWS or the cluster. Callers
# declare, at workflow level:
#
#   permissions:
#     contents: read     # always — checkout
#     id-token: write    # ONLY if recipes reach AWS/k8s through zcbctl
#                        # (gitops docs/guides/add-repo-to-ci.md)
#
# Public repositories omit id-token: fork PRs never receive it, and
# nothing in a public repository's recipes should want it. A caller with
# NO permissions block hands its org-default token to every recipe —
# declare the block.

jobs:
  recipe:
    name: ${{ matrix.recipe }}
    # Resolved per matrix entry, so `name:` stays the recipe and the
    # status contexts do not move. Renaming a job renames the required
    # check and wedges every open PR — twice already.
    runs-on: >-
      ${{ (contains(fromJSON(inputs.small-recipes), matrix.recipe)
           && inputs.small-runner != '')
          && inputs.small-runner
          || ((contains(fromJSON(inputs.medium-recipes), matrix.recipe)
               && inputs.medium-runner != '')
              && inputs.medium-runner || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Plain job env, deliberately NOT written through $GITHUB_ENV. Any
    # `echo "K=$V" >> $GITHUB_ENV` lets a value containing a newline
    # define FURTHER variables — CodeQL flags it, and it is right to.
    # Set here the value is passed, never parsed. Unset by every Truvity
    # caller, in which case this is an empty string and recipes behave
    # exactly as they did before the secret existed.
    env:
      GITLAB_TOKEN: ${{ secrets.gitlab-token }}
    strategy:
      # Every recipe reports its own verdict, and one failure does not
      # hide the others — the point of separate jobs in the first place.
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(inputs.recipes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: truvity/ci-workflows/.github/actions/setup-devbox@7fd704edf91e696cdc9bd9b2eaad1d2ac4ab04c9
        with:
          proto: ${{ inputs.proto }}
          aws-config-file: ${{ inputs.aws-config-file }}
          go-cache-bucket: ${{ inputs.go-cache-bucket }}
          go-cache-region: ${{ inputs.go-cache-region }}
          goproxy: ${{ inputs.goproxy }}
          go-private: ${{ inputs.go-private }}
          module-app-client-id: ${{ inputs.module-app-client-id }}
          module-app-private-key: ${{ secrets.module-app-private-key }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Registry override only when the cache answers a 2s ping —
      # fallback-not-dependency (INF-583). npm_config_registry covers
      # npm and yarn classic (classic still FETCHES lockfile-resolved
      # URLs, so at worst it bypasses the cache); YARN_NPM_REGISTRY_SERVER
      # covers berry, whose npm protocol derives fetch URLs from the
      # configured registry at install time. The GITHUB_ENV writes are
      # fixed literals — nothing user-controlled rides them, which is
      # what the job-env doctrine above actually guards against.
      - name: Point npm and yarn at the CI-plane cache
        if: inputs.node-cache
        run: |
          set -euo pipefail
          if curl -fsS --max-time 2 http://npm-cache.ci-cache.svc/-/ping >/dev/null 2>&1; then
            # YARN_UNSAFE_HTTP_WHITELIST: berry refuses plain-http
            # registries outright (YN0081 "Unsafe http requests must be
            # explicitly whitelisted") — without it the override below
            # turns every berry install into a hard fail whenever the
            # cache answers the ping (bar, 2026-08-27). An in-cluster svc
            # hostname over http is the design here, not an accident, so
            # the whitelist names exactly that host.
            {
              echo "npm_config_registry=http://npm-cache.ci-cache.svc"
              echo "YARN_NPM_REGISTRY_SERVER=http://npm-cache.ci-cache.svc"
              echo "YARN_UNSAFE_HTTP_WHITELIST=npm-cache.ci-cache.svc"
            } >> "$GITHUB_ENV"
            echo "npm cache: npm-cache.ci-cache.svc answered — registry override active"
          else
            echo "::warning::npm cache unreachable — direct npmjs for this job"
          fi

      # Only the lint job. Build and test outputs ride GOCACHEPROG or the
      # plain Go cache, modules ride the proxy, nix rides the
      # read-through — golangci's analysis cache is the one thing nothing
      # else covers, and it is the slowest recipe in the estate.
      #
      # devbox.lock in the key: a toolchain bump strands a cache whose
      # objects reference the old nix store path, and that fails at exec
      # time rather than missing cleanly.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: golangci-cache
        if: matrix.recipe == inputs.lint-recipe
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: golangci-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-

      # Through env, never spliced into the script: a ${{ }} expression is
      # pasted in before bash parses the line, so a value carrying a quote
      # or $( ) would execute.
      #
      # CAVEAT: devbox.json's own `env` WINS over anything set here, for
      # the same variable name, inside `devbox run`. Measured in bar
      # across four runs (2026-08-16) with a deliberate conflict.
      - name: Caller-supplied environment
        if: inputs.env-json != '{}'
        run: |
          python3 -c 'import json,os; [print(f"{k}={v}") for k,v in json.loads(os.environ["ENV_JSON"]).items()]' \
            >> "$GITHUB_ENV"
        env:
          ENV_JSON: ${{ inputs.env-json }}

      - uses: truvity/ci-workflows/.github/actions/recipe@44fa84daf3675478a133d21f6a3f6f2ba349bd30
        with:
          recipe: ${{ matrix.recipe }}
          command: ${{ inputs.command }}

      # The high-water mark, straight from the kernel. cgroup v2 keeps it
      # for free, so a job can report what it ACTUALLY needed instead of
      # leaving everyone to infer it from a snapshot — which is how the
      # estate ended up sizing runners at 10Gi against a measurement
      # taken on one node, and OOM-killing on another (INF-550).
      #
      # Per recipe, because each recipe is its own job here: `lint` and
      # `build` have very different appetites and averaging them is how
      # the number stopped meaning anything.
      - name: peak memory
        if: always()
        run: |
          peak=/sys/fs/cgroup/memory.peak
          max=/sys/fs/cgroup/memory.max
          # Hosted runners are not in a memory-limited cgroup; nothing to
          # report and nothing to warn about.
          [ -r "$peak" ] || exit 0

          used=$(( $(cat "$peak") / 1048576 ))
          limit=$(cat "$max")

          # memory.events separates "filled the cgroup" from "was killed".
          # memory.peak counts reclaimable page cache, so touching the
          # limit is routine — the kernel evicts cache and moves on. What
          # matters is `max` (allocation stalled at the ceiling) and
          # `oom_kill` (it did not survive). Reporting only the peak would
          # make every cache-heavy job look like it is about to die.
          hits=0; kills=0
          if [ -r /sys/fs/cgroup/memory.events ]; then
            hits=$(awk '$1=="max"{print $2}' /sys/fs/cgroup/memory.events)
            kills=$(awk '$1=="oom_kill"{print $2}' /sys/fs/cgroup/memory.events)
          fi

          case "$limit" in
            max) line="**${RECIPE}** peak ${used} MiB (no cgroup limit)" ;;
            *)
              limit=$(( limit / 1048576 ))
              pct=$(( used * 100 / limit ))
              line="**${RECIPE}** peak ${used} MiB of ${limit} MiB (${pct}%), ${hits} limit hits, ${kills} OOM kills"
              ;;
          esac

          # Both places on purpose. The summary is where a human looks;
          # the log is the only one a script can read, and sizing runners
          # (INF-550) means collecting this across many runs, not reading
          # it off a web page one at a time.
          echo "$line"
          echo "- $line" >> "$GITHUB_STEP_SUMMARY"

          # Allocation stalling at the ceiling is the actionable signal —
          # it precedes the kill, and the kill itself is invisible from
          # GitHub (the runner just stops, and the step reads as hung).
          if [ "${hits:-0}" -gt 0 ]; then
            echo "::warning::${RECIPE} hit its memory limit ${hits}x (peak ${used} MiB); raise the limit or lower GOMAXPROCS"
          fi
        env:
          RECIPE: ${{ matrix.recipe }}

      # if: always() — otherwise a failing lint kills the job before the
      # post step and the cache is never written, which is exactly when
      # someone is iterating and most wants it warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && matrix.recipe == inputs.lint-recipe && steps.golangci-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci-cache.outputs.cache-primary-key }}
