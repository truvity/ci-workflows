# `devbox update` opened as a pull request — and, since v2.10.0, the
# ONE owner of a Go repository's toolchain triple. Two cadences, one
# owner (v2.10.3): callers run a DAILY cron; the full devbox update
# happens on full-update-day (Monday), the go directive is aligned
# every day. A stdlib CVE therefore reaches CI within a day — the
# cadence renovate's hourly directive bumps used to give (bar#641's
# review caught the regression) — without a second writer on go.mod.
#
# Renovate structurally cannot do this: devbox.json and devbox.lock are
# in its ignorePaths, because nix packages are resolved by devbox, not
# by a package manager Renovate understands.
#
# THE TRIPLE, and why one owner. Three things must agree in a Go repo:
# the go binary devbox ships, the Go golangci-lint was BUILT with, and
# the go.mod directive. golangci-lint refuses a module whose language
# version exceeds its build Go, and a directive can run ahead of the
# nixpkgs binary because GOTOOLCHAIN=auto downloads what go.mod names.
# Split ownership (renovate bumping the directive, devbox the binaries)
# produced the 2026-08-22 estate-wide lint panics. So: the directive is
# aligned HERE, in the same PR as the lock — compatible by construction,
# validated by the repository's own checks, auto-merged on green — and
# renovate's gomod manager leaves `go` alone (its config says so).
#
# The rule: language minor ≤ golangci's build minor; patch = the newest
# release of that line; never downward. When nixpkgs moves go and
# golangci together, the next weekly run carries the whole minor
# migration as one ordinary PR per repository.
#
# Promoted from truvity/workstation, the only copy in the estate that
# has ever succeeded — every other repository carried the pre-migration
# token form and had been dying at step one since 2026-07-27 without
# producing a single red mark (INF-556).
#
# CALLERS MUST PASS `secrets: inherit`, and the repository must already
# have a `dependencies` label — the final `gh pr create --label` fails
# without one, after the branch has been pushed.
#
#   jobs:
#     devbox-update:
#       uses: truvity/ci-workflows/.github/workflows/devbox-update.yaml@<sha>
#       secrets: inherit
name: devbox-update

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      base:
        required: false
        type: string
        default: master
      label:
        required: false
        type: string
        default: dependencies
      timeout-minutes:
        required: false
        type: number
        default: 30
      mode:
        description: >-
          auto | full | align. `auto` (the default, for a DAILY cron)
          runs the full `devbox update` only on full-update-day and
          aligns the go directive every day; the other six days touch
          nothing but go.mod, so a PR appears only when Go shipped a
          patch. `full` and `align` force a mode — a human dispatching
          after a Go release wants `align` today, not next Monday.
        required: false
        type: string
        default: auto
      full-update-day:
        description: ISO weekday (1 = Monday) on which `auto` runs the full devbox update.
        required: false
        type: string
        default: "1"
    secrets:
      # Declared, not merely inherited, so that callers in ANOTHER
      # organization can pass it explicitly — `secrets: inherit` does not
      # carry secrets across an org boundary (renovate.yaml learned this
      # 2026-08-19; devbox-update learned it 2026-08-23, the day the
      # first trust-form repositories called it). Same-org callers on
      # `secrets: inherit` keep working unchanged.
      RENOVATE_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # Checkout with the App token, not GITHUB_TOKEN: the default is
      # contents:read here, so the push below would 403.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: truvity/ci-workflows/.github/actions/setup-devbox@7fd704edf91e696cdc9bd9b2eaad1d2ac4ab04c9
        with:
          # Nothing here runs a repo recipe, so proto is dead weight.
          proto: "false"
          github-token: ${{ steps.token.outputs.token }}

      # The ARC runner image bakes nix, devbox and the build tools — not
      # the GitHub CLI the hosted image happens to preinstall. Gate on
      # detection, like setup-devbox does for nix: install only what is
      # missing, pinned, from the release tarball.
      - name: Ensure gh
        run: |
          command -v gh >/dev/null && { echo "gh present: $(gh --version | head -1)"; exit 0; }
          v=2.97.0
          # The ARC pool is arm64; hosted runners are amd64. A hardcoded
          # arch put an amd64 binary on an arm64 node: "Exec format error".
          case "$(uname -m)" in
            x86_64)          arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${arch}.tar.gz"
          mkdir -p /tmp/gh && tar xzf /tmp/gh.tgz -C /tmp/gh --strip-components=1
          echo "/tmp/gh/bin" >> "$GITHUB_PATH"
          echo "gh installed: v${v}"

      - name: Decide the mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
          FULL_DAY: ${{ inputs.full-update-day }}
        run: |
          case "$MODE" in
            full)  full=true ;;
            align) full=false ;;
            *)     [ "$(date -u +%u)" = "$FULL_DAY" ] && full=true || full=false ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE (weekday $(date -u +%u), full-update-day $FULL_DAY) -> full=$full"

      - if: steps.mode.outputs.full == 'true'
        run: devbox update

      # Prototyped on forks first (excavador/ci-workflows + gemaal,
      # 2026-08-23). Three lessons are encoded here: jq is the RUNNER's,
      # never `devbox run -- jq` (devbox re-quotes argv and mangles the
      # program — github-actions.md, environment traps); the directive
      # is MONOTONIC (the first prototype run downgraded 1.26.6 -> 1.26.5
      # and the repo's pre-push govulncheck refused the push); and that
      # pre-push hook is a feature — the repo's own gates vet the aligned
      # directive before it can become a PR.
      # Align the TOOLCHAIN directive — never the language directive.
      # v2.10.0–v2.10.3 collapsed both into one `go` line and thereby
      # RAISED a repository's language version (phoenix: 1.23 -> 1.26.7),
      # which activated go vet's printf analyzer and broke master. The
      # language version is a code-semantics decision for the
      # repository's team; the toolchain is the CVE channel and is
      # automation's to move. Rule: toolchain = newest patch of the
      # line golangci-lint was built against, never downward; the `go`
      # line is read only, and a language minor ABOVE the cap means a
      # human created a mismatch — report, touch nothing.
      #
      # jq is the RUNNER's (devbox re-quotes a program), the directives
      # are read from the file (a devbox init_hook may print to stdout).
      - name: Align go toolchain
        run: |
          set -euo pipefail
          [ -f go.mod ] || { echo "no go.mod — nothing to align"; exit 0; }

          lang=$(awk '/^go /{print $2; exit}' go.mod)
          tc=$(awk '/^toolchain /{sub(/^go/,"",$2); print $2; exit}' go.mod)
          tc=${tc:-$lang}
          if devbox run -- golangci-lint version >/tmp/glci 2>/dev/null; then
            built=$(grep -o 'built with go[0-9.]*' /tmp/glci | grep -o '[0-9][0-9.]*$')
          else
            built=$(devbox run -- go env GOVERSION | grep -o '[0-9][0-9.]*')
          fi
          cap=$(echo "$built" | cut -d. -f1-2)
          echo "language $lang, toolchain $tc; cap: go $cap line (golangci built with $built)"

          if [ "$(printf '%s\n%s\n' "$(echo "$lang" | cut -d. -f1-2)" "$cap" | sort -V | tail -1)" != "$cap" ]; then
            echo "::warning::language directive $lang is above the golangci-lint cap $cap — a human set this; not touching go.mod"
            exit 0
          fi

          latest=$(curl -fsS --max-time 30 'https://go.dev/dl/?mode=json&include=all' \
            | jq -r --arg m "go$cap." '[.[].version | select(startswith($m))] | first // empty' \
            || true)
          if [ -z "$latest" ]; then
            echo "go.dev unreachable — toolchain stays $tc this run"
            exit 0
          fi
          target=${latest#go}

          top=$(printf '%s\n%s\n' "$tc" "$target" | sort -V | tail -1)
          if [ "$top" = "$tc" ]; then
            echo "toolchain $tc already at or above $target — no change"
            exit 0
          fi
          echo "aligning toolchain $tc -> $target (language stays $lang)"
          if [ "$target" = "$lang" ]; then
            devbox run -- go mod edit -toolchain=none   # equal to the language version: the single line says it
          else
            devbox run -- go mod edit -toolchain="go$target"
          fi
          git diff -- go.mod

      - name: Open a pull request if anything moved
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE: ${{ inputs.base }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail

          if git diff --quiet -- devbox.json devbox.lock go.mod; then
            echo "devbox packages and go directive already current"
            exit 0
          fi

          # ONE fixed branch, force-pushed: a same-day re-run (or a daily
          # align after Monday's full update) UPDATES the open PR instead
          # of colliding with yesterday's branch name — renovate's shape.
          branch="chore/devbox-update"
          git config user.name "truvity-renovate[bot]"
          git config user.email "truvity-renovate[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add devbox.json devbox.lock
          [ -f go.mod ] && git add go.mod
          git commit -m "chore(deps): update devbox packages and align the go directive"
          # Inside devbox, so the repository's pre-push hooks (lefthook)
          # find the repository's tools. gitops's hooks call `just` bare
          # and died with "command not found" on the first aligned push
          # (2026-08-23) — the hooks are the safety net that vets the
          # aligned directive, so they must be able to run, not skipped.
          devbox run -- git push --force origin "$branch"

          # Self-creating label: the prototype found the old "must already
          # exist" prerequisite fails AFTER the branch is pushed, which is
          # the worst moment. --force is idempotent on an existing label.
          gh label create "$LABEL" --force --color 0366d6 --description "Dependency updates" >/dev/null

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            echo "open PR for $branch already exists — updated in place by the push"
            exit 0
          fi

          gh pr create \
            --title "chore(deps): update devbox packages and align the go directive" \
            --body "Automated \`devbox update\` (full on the configured weekday, go-directive alignment daily), with the go.mod directive aligned to the toolchain triple (language minor capped by golangci-lint's build Go, patch = newest of that line, never downward). Nix packages are outside Renovate's reach — devbox.json and devbox.lock are in its ignorePaths — and the go directive is owned here too, so the three can never disagree." \
            --base "$BASE" \
            --label "$LABEL"

          # Arm auto-merge ONLY where required checks exist. With none,
          # `--auto` merges IMMEDIATELY, unvalidated — phoenix#29 landed a
          # red lint/test that way on 2026-08-23 (migrated-profile repos
          # carry no required checks by a deliberate decision). Where
          # nothing gates the merge, a human does.
          #
          # The REST protection endpoint needs admin:read, which neither
          # the App token nor GITHUB_TOKEN carries — it 404'd on every
          # private repo and quietly left ALL their PRs for humans.
          # GraphQL refUpdateRule reflects effective protection for any
          # viewer; null means no protection at all.
          # shellcheck disable=SC2016  # $o/$r/$b are GraphQL variables, not shell
          gated=$(gh api graphql \
            -f query='query($o:String!,$r:String!,$b:String!){repository(owner:$o,name:$r){ref(qualifiedName:$b){refUpdateRule{requiredStatusCheckContexts}}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -f b="refs/heads/${BASE}" \
            --jq '.data.repository.ref.refUpdateRule.requiredStatusCheckContexts | length' 2>/dev/null || echo 0)
          if [ "${gated:-0}" -ge 1 ]; then
            gh pr merge --auto --rebase "$branch"
          else
            echo "no required status checks on ${BASE} — leaving the PR for a human to merge"
          fi
