# Tag-triggered release for the PRIVATE estate: artifacts to ECR in the
# stable account, reached by tag-scoped GitHub OIDC.
#
# The sibling of release-public.yaml, and a SEPARATE workflow rather
# than a flag on it — deliberately. A reusable workflow can narrow the
# caller's permissions but never widen them, so a merged workflow would
# have to declare the union and force every caller to hold it: GHCR
# callers would carry id-token, ECR callers would carry packages. Two
# workflows keep each caller's grant minimal.
#
# IDENTITY: tag-scoped GitHub OIDC, and NOT the Zitadel broker, even
# where the caller reaches its cluster that way. `id-token: write` mints
# a GitHub JWT, STS trades it for temporary credentials on a role whose
# trust policy pins the tag ref (repo:<org>/<repo>:ref:refs/tags/...).
# Two properties follow, and both are the reason:
#
#   1. The condition lives in AWS IAM — the same system that issues the
#      credential — not in a service we operate.
#   2. A release does not depend on our cluster being healthy, which is
#      exactly when a fix most needs shipping.
#
# A pod-identity association cannot express either: it is pool-level,
# so anything scheduled on that pool inherits it, and nothing about it
# is ref-aware.
#
# NOTHING PARTICULAR LIVES HERE. This repository is public: account ids,
# role ARNs and registry hosts arrive as inputs from the caller.
name: release-private

on:
  workflow_call:
    inputs:
      role-to-assume:
        description: >-
          Full ARN of the release role to assume. One role per project,
          trusting that project's tag refs only — so the ARN names both
          the account and the blast radius.
        required: true
        type: string
      ecr-registries:
        description: >-
          Comma-separated ECR account ids to log into. Name ONLY the
          registries this release publishes to: unlike a credential
          helper, which is lazy and consulted per push, this login is
          eager and FAILS on an account the role cannot reach.
        required: true
        type: string
      command:
        description: >-
          The release command, run inside devbox. Varies by project —
          plain goreleaser for some, a pipeline driver for others — so
          it is the caller's to state.
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: eu-central-1
      require-green-checks:
        description: >-
          Refuse to build unless every check run on the tagged commit
          has settled green. A stable artifact built from a commit whose
          tests never finished is the failure this exists to prevent.
        required: false
        type: boolean
        default: true
      strip-local-tools:
        description: >-
          Strip npm-backed local tooling (the cubic CLI) from a repo's
          .prototools before devbox materializes. Default true: on an ARC
          runner there is no npm until proto installs node, and the
          tool's proto plugin execs npm from devbox's init hook — bar's
          first two stable-tier tags died there. The edit is hidden from
          the index (assume-unchanged), so goreleaser's clean-tree gate
          still passes; the old "false, keeps the tree clean" default
          only ever held on hosted runners, which have npm.
        required: false
        type: string
        default: "true"
      proto:
        required: false
        type: string
        default: auto
      runner:
        description: >-
          Runner label. Hosted by default; the heavy private multi-arch
          releases pass the stable tier's scale set
          (vars.CI_RUNNER_LABEL_STABLE, INF-640). On an ARC runner the
          image builds go to the CI plane's warm builders
          (remote-builders) instead of QEMU, and the hosted-only steps
          skip themselves on `runner.environment`.
        required: false
        type: string
        default: ubuntu-latest
      remote-builders:
        description: >-
          ARC only. The CI plane's BuildKit nodes to register as the
          buildx builder, `platforms=endpoint` entries separated by
          whitespace — from the caller's org variable
          (vars.CI_REMOTE_BUILDERS_STABLE), never a literal here. See
          .github/actions/setup-remote-builders for the format.
        required: false
        type: string
        default: ""
      buildx-cache:
        description: >-
          Registry reference of the BuildKit warm cache, e.g. the
          stable account's ci/buildkit-cache — from the caller's org
          variable (vars.CI_BUILDX_CACHE_STABLE). Exported to the
          release command as CI_BUILDX_CACHE, which the projects'
          goreleaser configs turn into `--cache-from/--cache-to
          type=registry` per image; empty means no cache flags. The
          release role must be allowed to push to it.
        required: false
        type: string
        default: ""
      reclaim-disk:
        description: >-
          Reclaim ~30GB of preinstalled toolchains (dotnet, Android,
          GHC, CodeQL) before building. For GitHub-hosted runners whose
          ~14GB free no longer fits a multi-arch goreleaser publish —
          both bar releases died on `no space left on device` on
          2026-08-26. Leave false on ARC runners: their images carry
          none of those directories.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 30
      install-goreleaser-pro:
        description: >-
          Install the goreleaser-pro binary at job time (pinned version,
          verified). The Pro EULA forbids redistribution, so the binary
          must NOT be baked into the public runner image (INF-572) —
          fetching it here, on the licensee's own runner, is plain
          internal use. Callers that pass goreleaser-key set this.
        required: false
        type: boolean
        default: false
      openbao-issuer:
        description: >-
          The access-roster issuer that mints the token the OpenBAO login
          presents. Set it, with the three below, to read the
          goreleaser-pro licence at run time instead of passing it as a
          secret (docs/secrets.md).
        required: false
        type: string
        default: ""
      openbao-address:
        description: The OpenBAO API base URL — a private endpoint, so a self-hosted runner.
        required: false
        type: string
        default: ""
      openbao-namespace:
        description: The OpenBAO namespace the licence path lives in.
        required: false
        type: string
        default: ""
      openbao-ca:
        description: PEM of the CA that signed OpenBAO's certificate, where the runner's trust store does not cover it.
        required: false
        type: string
        default: ""
      goreleaser-licence-path:
        description: >-
          KV path holding the goreleaser-pro licence, read as the job
          itself. Empty keeps the `goreleaser-key` secret. While both are
          set the read may fail and the secret still stands behind it, so
          a first rollout cannot break a release.
        required: false
        type: string
        default: ""
    secrets:
      goreleaser-key:
        description: goreleaser-pro licence, for callers that use it.
        required: false

# NO permissions block, deliberately — the check.yaml rule. A reusable
# workflow's block is a CEILING on what the caller granted, not a floor:
# release-public.yaml's `contents: read` silently dropped the
# packages:write its callers granted, and integration.yaml's dropped the
# packages:read bar granted for GitHub Packages (bar#726). Jobs inherit
# exactly what the caller grants. Callers declare, at workflow level and
# on the calling job:
#
#   contents:  read   — checkout; this half publishes to ECR, not to
#                       GitHub Releases, so write is not needed
#   id-token:  write  — mint the GitHub JWT that STS trades for the role
#   checks:    read   — the gate reads the tagged commit's check runs;
#                       without it the token gets 403 rather than a
#                       verdict
#   packages:  read   — ONLY if the repo installs @truvity packages from
#                       GitHub Packages

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # GitHub Packages wants a token to install even a public package.
      # The job's own, which reads only what the caller's `packages: read`
      # grants; a caller whose packages come from nowhere else ignores it.
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the changelog from history; a shallow
          # clone gives it nothing to derive from.
          fetch-depth: 0

      - name: Reclaim runner disk
        # Hosted only, whatever the caller asked: an ARC runner has none
        # of these directories and no sudo to remove them with.
        if: inputs.reclaim-disk && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h / | tail -1

      # The filter and its regression test live in the SAME step on
      # purpose: a standalone copy of either drifts from the other, and
      # a test nothing executes cannot catch a reintroduced bug. Both
      # run on every release.
      - name: Require green checks on the tagged commit
        if: inputs.require-green-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # --slurp gives an array of PAGES: --paginate applies a filter
          # per page, so grouping without flattening keeps an older
          # page's cancelled run. max_by(.id) and never .started_at — a
          # QUEUED run has started_at=null, jq sorts null lowest, and
          # the gate would then pick an older COMPLETED run and release
          # on stale green.
          #
          # Two exclusions, both load-bearing:
          #
          # 1. Own run, BY RUN ID not by name. bar's copy matched
          #    `.name != "release"` and that broke the moment the job
          #    moved into a reusable workflow: the check run is then named
          #    "<caller-job> / <called-job>", so the filter stopped
          #    matching, the gate saw itself as pending, and every release
          #    refused itself. The run id cannot drift with a job name.
          #
          # 2. SIBLING release runs, by name. When two projects tag the
          #    SAME commit (a shared-monorepo release, e.g. eudi/v* and
          #    url-shortener/v* on one master SHA), each other's release
          #    job posts a check on that commit under a DIFFERENT run id —
          #    so the run-id filter alone leaves it in, still `pending`
          #    while the sibling builds, and the two gates deadlock each
          #    other. A release job's own success is never a prerequisite
          #    for a release, so every release-shaped check ("release" for
          #    an inline job, "release / release" for a reusable one) is
          #    dropped regardless of run id. Non-release CI is "check",
          #    "cluster-access", "moon / ci", "suite …" — none collide.
          #
          # 3. BOT runs, by name: "renovate / renovate" and "update / update"
          #    (devbox-update) run on a schedule against master and post a
          #    check on whatever commit is the tip — a tag that overlaps one
          #    would fail the gate on a job that says nothing about the
          #    commit's quality (bar, 2026-09-07). dms's inline gate already
          #    drops them.
          cat > /tmp/release-gate.jq <<'JQ'
          [.[].check_runs[]
            | select(((.details_url // "") | contains("/runs/" + $runid + "/")) | not)
            | select((.name == "release" or (.name | startswith("release /"))) | not)
            | select((.name | startswith("renovate /")) | not)
            | select((.name | startswith("update /")) | not)]
          | group_by(.name)
          | map(max_by(.id))
          | .[]
          | "\(.name)\t\(.conclusion // "pending")"
          JQ

          # The sample exercises BOTH exclusions on one commit:
          #   id 102 "release / release" — THIS run (runid 999), the
          #     reusable-workflow shape that broke the name-based filter,
          #     excluded by run id.
          #   id 103 "release" — a SIBLING project's release (runid 888),
          #     pending, the shared-commit cross-block; excluded by name.
          # Both must vanish, leaving only the real CI checks.
          sample='[{"check_runs":[{"id":100,"name":"check","details_url":"https://x/actions/runs/111/job/1","conclusion":"success"},
                                  {"id":101,"name":"suite","details_url":"https://x/actions/runs/111/job/2","conclusion":"cancelled"},
                                  {"id":102,"name":"release / release","details_url":"https://x/actions/runs/999/job/3","conclusion":null},
                                  {"id":103,"name":"release","details_url":"https://x/actions/runs/888/job/9","conclusion":null},
                                  {"id":104,"name":"renovate / renovate","details_url":"https://x/actions/runs/777/job/7","conclusion":"failure"},
                                  {"id":105,"name":"update / update","details_url":"https://x/actions/runs/666/job/6","conclusion":null}]},
                   {"check_runs":[{"id":200,"name":"check","details_url":"https://x/actions/runs/222/job/4","conclusion":null},
                                  {"id":201,"name":"suite","details_url":"https://x/actions/runs/222/job/5","conclusion":"success"}]}]'
          got=$(echo "$sample" | jq -r --arg runid "999" -f /tmp/release-gate.jq | sort | tr '\t' '=' | paste -sd' ' -)
          want='check=pending suite=success'
          [ "$got" = "$want" ] || { echo "::error::release gate self-test failed: got [$got] want [$want]"; exit 1; }
          echo "gate self-test PASS: newest-queued beats older success; pages flattened; own run and bot runs excluded"

          # curl, not gh: the ARC runner image ships no gh (bar's first two
          # tags on the stable tier died here with "gh: command not
          # found"); curl and jq it has. Pages fetched by hand into files,
          # then slurped — the same shape --paginate --slurp produced.
          rm -rf "$RUNNER_TEMP/checks" && mkdir -p "$RUNNER_TEMP/checks"
          page=1
          while :; do
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100&page=${page}" \
              -o "$RUNNER_TEMP/checks/page-${page}.json"
            total=$(jq -r '.total_count' "$RUNNER_TEMP/checks/page-${page}.json")
            [ $((page * 100)) -ge "$total" ] && break
            page=$((page + 1))
          done
          RUNS=$(jq -s -r --arg runid "${GITHUB_RUN_ID}" -f /tmp/release-gate.jq "$RUNNER_TEMP"/checks/page-*.json)
          echo "checks on ${GITHUB_SHA}:"
          while IFS= read -r line; do printf '  %s\n' "$line"; done <<< "$RUNS"

          if ! echo "$RUNS" | grep -qP '^check\tsuccess$'; then
            echo '::error::the tagged commit has no successful check run — releases build only from check-green commits'
            exit 1
          fi
          BAD=$(echo "$RUNS" | grep -vP '\t(success|neutral|skipped)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::not-green checks on the tagged commit:"; echo "$BAD"
            exit 1
          fi
          echo "all checks green on ${GITHUB_SHA}"

      - uses: truvity/ci-workflows/.github/actions/setup-devbox@326ee195d3140dd3bc60ea76f5d6b0664855accd # master 2026-09-17 (326ee19)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          proto: ${{ inputs.proto }}
          strip-local-tools: ${{ inputs.strip-local-tools }}

      # GitHub-hosted carries only buildx's default `docker` driver,
      # which cannot produce attestations — goreleaser's dockers_v2 asks
      # for them. setup-buildx-action creates a docker-container builder
      # that can; QEMU covers the non-native arch of a multi-platform
      # manifest. Hosted only: an ARC runner has no daemon for either.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: runner.environment != 'self-hosted'

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: runner.environment != 'self-hosted'

      # ARC: the CI plane's warm BuildKit builders as the buildx builder
      # (native builds on a hot layer cache; no QEMU). Inlined rather
      # than `uses:`-ing .github/actions/setup-remote-builders because a
      # reusable workflow can only reference an action by a commit that
      # already exists; the action is the same step for callers that run
      # their release inline (dms). Keep the two in step.
      - name: Register the remote builders
        if: runner.environment == 'self-hosted'
        env:
          NODES: ${{ inputs.remote-builders }}
        run: |
          set -euo pipefail
          [ -n "${NODES// /}" ] || { echo "::error::remote-builders is empty on an ARC runner — pass the org variable"; exit 1; }
          run() { if [ -f devbox.json ]; then devbox run -- "$@"; else "$@"; fi; }
          if plugin="$(run sh -c 'command -v docker-buildx' 2>/dev/null)" && [ -n "$plugin" ]; then
            mkdir -p ~/.docker/cli-plugins
            ln -sf "$plugin" ~/.docker/cli-plugins/docker-buildx
          fi
          run docker buildx rm ci 2>/dev/null || true
          first=1
          for entry in $NODES; do
            platforms="${entry%%=*}"; endpoint="${entry#*=}"
            if [ "$first" = 1 ]; then
              run docker buildx create --name ci --driver remote "$endpoint" --platform "$platforms"
              first=0
            else
              run docker buildx create --append --name ci --driver remote "$endpoint" --platform "$platforms"
            fi
          done
          run docker buildx use ci
          run docker buildx inspect --bootstrap ci | tee "$RUNNER_TEMP/buildx-ci.txt"
          for entry in $NODES; do
            platforms="${entry%%=*}"
          for p in ${platforms//,/ }; do
              grep -q "$p" "$RUNNER_TEMP/buildx-ci.txt" || { echo "::error::builder ci does not offer $p"; exit 1; }
            done
          done
          echo "BUILDX_BUILDER=ci" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      # The official action rather than a hand-rolled credential helper.
      # It consumes the role assumed directly above and writes the auth
      # entry that helm and oras read from ~/.docker/config.json — the
      # Docker credential store resolves a static `auths` entry exactly
      # as it resolves a credHelpers one.
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: ${{ inputs.ecr-registries }}
          mask-password: "true"

      # Job-time, never image-baked: the Pro EULA's no-distribution
      # clause covers the binary even though goreleaser hosts it on a
      # public releases page — public-from-the-vendor grants us no
      # redistribution right (INF-572).
      - name: Install goreleaser-pro
        if: inputs.install-goreleaser-pro
        env:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser-pro
          GORELEASER_VERSION: v2.17.1
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in x86_64) arch=x86_64 ;; aarch64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/goreleaser-pro"
          curl -fsSL "https://github.com/goreleaser/goreleaser-pro/releases/download/${GORELEASER_VERSION}/goreleaser-pro_Linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/goreleaser-pro" goreleaser
          # PATH, not /usr/local/bin: ARC runners have no sudo, and the
          # devbox-run Release step inherits the job PATH.
          echo "$RUNNER_TEMP/goreleaser-pro" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/goreleaser-pro/goreleaser" --version

      # The licence as something this job READS, not as a copy every
      # caller holds: the run's own OIDC identity exchanged at
      # access-roster, one login, one read of one path (docs/secrets.md).
      # The issuer's grants and one read-only policy decide it; no input
      # here can widen that.
      #
      # `continue-on-error` is the rollout, not the destination. A caller
      # that has proven the read drops its `goreleaser-key` secret, and
      # the fallback below then resolves to empty on its own.
      - name: Read the goreleaser licence from OpenBAO
        id: licence
        if: inputs.goreleaser-licence-path != ''
        continue-on-error: true
        uses: truvity/ci-workflows/.github/actions/openbao-secrets@e760edca07d033510353b754e19cae46cee465e0 # v2.27.0
        with:
          issuer: ${{ inputs.openbao-issuer }}
          address: ${{ inputs.openbao-address }}
          namespace: ${{ inputs.openbao-namespace }}
          ca-cert: ${{ inputs.openbao-ca }}
          path: ${{ inputs.goreleaser-licence-path }}

      - name: Release
        # The command reaches the shell through env and word-splits
        # there — an expression spliced into the script text would be
        # parsed as CODE, quotes and $() included (CodeQL alert 25).
        # SC2086: the split IS the contract — `command` is a word list
        # (every caller passes e.g. `go tool gemaalctl pipeline
        # release-stable --config …`), never one shell-quoted argument.
        run: |
          # shellcheck disable=SC2086
          devbox run -- $RELEASE_COMMAND
        env:
          RELEASE_COMMAND: ${{ inputs.command }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ steps.licence.outputs.value || secrets.goreleaser-key }}
          CI_BUILDX_CACHE: ${{ inputs.buildx-cache }}
          # No profiles on a runner: the default credential chain must
          # resolve the job's OIDC role from env. A stray AWS_PROFILE
          # overrides it and surfaces as a confusing 403 several layers
          # down, not as "wrong profile".
          GEMAAL_AWS_AMBIENT: "1"
