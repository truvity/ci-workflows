# Tag-triggered release for the PRIVATE estate: artifacts to ECR in the
# stable account, reached by tag-scoped GitHub OIDC.
#
# The sibling of release-public.yaml, and a SEPARATE workflow rather
# than a flag on it — deliberately. A reusable workflow can narrow the
# caller's permissions but never widen them, so a merged workflow would
# have to declare the union and force every caller to hold it: GHCR
# callers would carry id-token, ECR callers would carry packages. Two
# workflows keep each caller's grant minimal.
#
# IDENTITY: tag-scoped GitHub OIDC, and NOT the Zitadel broker, even
# where the caller reaches its cluster that way. `id-token: write` mints
# a GitHub JWT, STS trades it for temporary credentials on a role whose
# trust policy pins the tag ref (repo:<org>/<repo>:ref:refs/tags/...).
# Two properties follow, and both are the reason:
#
#   1. The condition lives in AWS IAM — the same system that issues the
#      credential — not in a service we operate.
#   2. A release does not depend on our cluster being healthy, which is
#      exactly when a fix most needs shipping.
#
# A pod-identity association cannot express either: it is pool-level,
# so anything scheduled on that pool inherits it, and nothing about it
# is ref-aware.
#
# NOTHING PARTICULAR LIVES HERE. This repository is public: account ids,
# role ARNs and registry hosts arrive as inputs from the caller.
name: release-private

on:
  workflow_call:
    inputs:
      lfs:
        description: >-
          Fetch Git LFS objects at checkout (needs git-lfs on the runner: the
          ARC image has it since ci-plane v6.7.0; GitHub-hosted runners have
          it). Set false for a repository whose LFS objects are not needed by
          this job.
        required: false
        type: boolean
        default: true
      role-to-assume:
        description: >-
          Full ARN of the release role to assume. One role per project,
          trusting that project's tag refs only — so the ARN names both
          the account and the blast radius.
        required: true
        type: string
      ecr-registries:
        description: >-
          Comma-separated ECR account ids to log into. Name ONLY the
          registries this release publishes to: unlike a credential
          helper, which is lazy and consulted per push, this login is
          eager and FAILS on an account the role cannot reach.
        required: true
        type: string
      command:
        description: >-
          The release command, run inside devbox. Varies by project —
          plain goreleaser for some, a pipeline driver for others — so
          it is the caller's to state.
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: eu-central-1
      require-green-checks:
        description: >-
          Refuse to build unless every check run on the tagged commit
          has settled green. A stable artifact built from a commit whose
          tests never finished is the failure this exists to prevent.
        required: false
        type: boolean
        default: true
      strip-local-tools:
        description: >-
          Strip npm-backed local tooling (the cubic CLI) from a repo's
          .prototools before devbox materializes. Default true: on an ARC
          runner there is no npm until proto installs node, and the
          tool's proto plugin execs npm from devbox's init hook — a
          private caller's first two stable-tier tags died there. The
          edit is hidden from the index (assume-unchanged), so
          goreleaser's clean-tree gate still passes; the old "false,
          keeps the tree clean" default only ever held on hosted
          runners, which have npm.
        required: false
        type: string
        default: "true"
      proto:
        required: false
        type: string
        default: auto
      runner:
        description: >-
          Runner label. Hosted by default; the heavy private multi-arch
          releases pass the stable tier's scale set
          (vars.CI_RUNNER_LABEL_STABLE). On an ARC runner the
          image builds go to the CI plane's warm builders
          (remote-builders) instead of QEMU: a non-empty `remote-builders`
          selects the builders, an empty one the hosted buildx and QEMU.
        required: false
        type: string
        default: ubuntu-latest
      npm-registry:
        description: >-
          Address of the CI plane's npm read-through registry, an
          http(s) URL with no query. Empty falls back to the CALLER's
          `vars.CI_NPM_REGISTRY` (a reusable workflow reads the caller
          repository's variables). It is probed with a 2s ping and used
          only when it answers. LEGACY: while both are empty the previous
          in-cluster address is probed instead, so a runner pool that
          has not yet been given the variable behaves exactly as before.
          A runner that exports `CI_RUNNER_NPM_REGISTRY` overrides both:
          its own value wins over this input and the variable.
        required: false
        type: string
        default: ''
      remote-builders:
        description: >-
          ARC only. The CI plane's BuildKit nodes to register as the
          buildx builder, `platforms=endpoint` entries separated by
          whitespace — from the caller's org variable
          (vars.CI_REMOTE_BUILDERS_STABLE), never a literal here. See
          For the format see the "Plan the remote builders" step: one
          `linux/arm64=tcp://host:port` entry per node; the transport is
          mutual TLS when the runner provides CI_BUILDKIT_TLS_DIR, plain
          TCP otherwise. A runner that exports `CI_RUNNER_REMOTE_BUILDERS`
          (same format) overrides which nodes are registered; a non-empty
          value here still selects the builders over QEMU.
        required: false
        type: string
        default: ""
      buildx-cache:
        description: >-
          Registry reference of the BuildKit warm cache, e.g. the
          stable account's ci/buildkit-cache — from the caller's org
          variable (vars.CI_BUILDX_CACHE_STABLE). A runner that exports
          `CI_RUNNER_BUILDX_CACHE` (the stable tier's Fargate runners do) wins
          over it. Exported to the
          release command as CI_BUILDX_CACHE, which the projects'
          goreleaser configs turn into `--cache-from/--cache-to
          type=registry` per image, and as CI_BUILDX_CACHE_FROM (the
          read reference); empty means no cache flags. The release
          role must be allowed to push to it: on a runner that exports
          `CI_RUNNER_CACHE_WRITES=release-credentials` the release role
          is the only writer.
        required: false
        type: string
        default: ""
      sbom-generator:
        description: >-
          The SBOM scanner image buildx runs for the image attestations,
          from the caller's org variable (vars.CI_SBOM_GENERATOR_STABLE: the
          stable account's pull-through copy of
          docker/buildkit-syft-scanner). Exported to the release command as
          GEMAAL_SBOM_GENERATOR, which gemaal turns into `--attest
          type=sbom,generator=<image>`; empty keeps buildx's default
          (Docker Hub, unauthenticated, rate-limited). The release role must
          be allowed to pull through the cache, and `ecr-registries` must
          include its account.
        required: false
        type: string
        default: ""
      reclaim-disk:
        description: >-
          Reclaim ~30GB of preinstalled toolchains (dotnet, Android,
          GHC, CodeQL) before building. For GitHub-hosted runners whose
          ~14GB free no longer fits a multi-arch goreleaser publish —
          two releases died on `no space left on device` on
          2026-08-26. Leave false on ARC runners: their images carry
          none of those directories.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 30
      install-goreleaser-pro:
        description: >-
          Install the goreleaser-pro binary at job time (pinned version,
          verified). The Pro EULA forbids redistribution, so the binary
          must NOT be baked into the public runner image —
          fetching it here, on the licensee's own runner, is plain
          internal use. Callers that pass goreleaser-key set this.
        required: false
        type: boolean
        default: false
      openbao-issuer:
        description: >-
          The access-roster issuer that mints the token the OpenBAO login
          presents. Set it, with the three below, to read the
          goreleaser-pro licence at run time instead of passing it as a
          secret (docs/secrets.md).
        required: false
        type: string
        default: ""
      openbao-address:
        description: The OpenBAO API base URL — a private endpoint, so a self-hosted runner.
        required: false
        type: string
        default: ""
      openbao-namespace:
        description: The OpenBAO namespace the licence path lives in.
        required: false
        type: string
        default: ""
      openbao-ca:
        description: PEM of the CA that signed OpenBAO's certificate, where the runner's trust store does not cover it.
        required: false
        type: string
        default: ""
      goreleaser-licence-path:
        description: >-
          KV path holding the goreleaser-pro licence, read as the job
          itself. Empty keeps the `goreleaser-key` secret. While both are
          set the read may fail and the secret still stands behind it, so
          a first rollout cannot break a release.
        required: false
        type: string
        default: ""
    secrets:
      goreleaser-key:
        description: goreleaser-pro licence, for callers that use it.
        required: false

# NO permissions block, deliberately — the check.yaml rule. A reusable
# workflow's block is a CEILING on what the caller granted, not a floor:
# release-public.yaml's `contents: read` silently dropped the
# packages:write its callers granted, and integration.yaml's dropped the
# packages:read a caller granted for GitHub Packages. Jobs inherit
# exactly what the caller grants. Callers declare, at workflow level and
# on the calling job:
#
#   contents:  read   — checkout; this half publishes to ECR, not to
#                       GitHub Releases, so write is not needed
#   id-token:  write  — mint the GitHub JWT that STS trades for the role
#   checks:    read   — the gate reads the tagged commit's check runs;
#                       without it the token gets 403 rather than a
#                       verdict
#   packages:  read   — ONLY if the repo installs @truvity packages from
#                       GitHub Packages

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # GitHub Packages wants a token to install even a public package.
      # The job's own, which reads only what the caller's `packages: read`
      # grants; a caller whose packages come from nowhere else ignores it.
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: ${{ inputs.lfs }}
          # goreleaser derives the changelog from history; a shallow
          # clone gives it nothing to derive from.
          fetch-depth: 0

      - name: Reclaim runner disk
        # Only where the hosted image's directories exist and sudo needs
        # no password; an ARC runner has neither, and the step says so.
        if: inputs.reclaim-disk
        run: |
          set -euo pipefail
          if ! sudo -n true 2>/dev/null || [ ! -d /usr/share/dotnet ]; then
            echo "reclaim-disk: no passwordless sudo or no hosted-image directories here — nothing to reclaim"
            exit 0
          fi
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h / | tail -1

      # The filter and its regression tests are the ci-actions
      # `require-green-checks` action's.
      - name: Require green checks on the tagged commit
        if: inputs.require-green-checks
        uses: truvity/ci-actions/require-green-checks@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
        with:
          token: ${{ github.token }}

      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          proto: ${{ inputs.proto }}
          strip-local-tools: ${{ inputs.strip-local-tools }}

      # Registry override only when the cache answers a 2s ping:
      # fallback-not-dependency, the same step check.yaml carries.
      # Release builds run `yarn install` on the host (about 150-400 MiB a
      # release) and the Node image builds. The write to GITHUB_ENV is
      # a URL that matched a strict pattern. YARN_UNSAFE_HTTP_WHITELIST: berry refuses
      # plain-http registries without it.
      - name: Point npm and yarn at the CI-plane cache
        # No runner test: the step asks the registry. A configured
        # `CI_NPM_REGISTRY` is probed wherever the job runs; while it is
        # unset the legacy in-cluster address is probed silently, which
        # answers on an ARC runner and is a quiet no-op anywhere else.
        env:
          NPM_REGISTRY: ${{ inputs.npm-registry || vars.CI_NPM_REGISTRY }}
        run: |
          set -euo pipefail
          # A value the RUNNER exports (CI_RUNNER_NPM_REGISTRY, from its pod
          # spec or task definition) wins over the input and the org variable:
          # a pool that reaches the registry by another name carries its own.
          # Unset, nothing changes. Only the source is logged here.
          runner_registry="${CI_RUNNER_NPM_REGISTRY:-}"
          runner_registry="${runner_registry//[[:space:]]/}"
          if [ -n "$runner_registry" ]; then
            NPM_REGISTRY="$runner_registry"
            echo "npm registry: from the runner (CI_RUNNER_NPM_REGISTRY)"
          elif [ -n "${NPM_REGISTRY:-}" ]; then
            echo "npm registry: from the input or organisation variable"
          else
            echo "npm registry: unset, the legacy in-cluster default is probed"
          fi
          # The address is the org variable `CI_NPM_REGISTRY` (input
          # `npm-registry`). LEGACY FALLBACK: while it is unset, the old
          # in-cluster name is probed exactly as before; delete the default
          # below once the variable is set org-wide.
          legacy=""
          [ -n "${NPM_REGISTRY:-}" ] || legacy=1
          registry="${NPM_REGISTRY:-http://npm-cache.ci-cache.svc}"
          registry="${registry%/}"
          re='^(https?)://([A-Za-z0-9.-]+)(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'
          if ! [[ "$registry" =~ $re ]]; then
            echo "::warning::npm registry is not a plain http(s) URL — direct npmjs for this job"
          elif curl -fsS --max-time 2 "$registry/-/ping" >/dev/null 2>&1; then
            # YARN_UNSAFE_HTTP_WHITELIST: berry refuses plain-http registries
            # outright (YN0081 "Unsafe http requests must be explicitly
            # whitelisted"), so an http registry is whitelisted by host; an
            # https one needs nothing. The value is matched against a strict
            # pattern above, so nothing but a URL can ride GITHUB_ENV.
            {
              echo "npm_config_registry=$registry"
              echo "YARN_NPM_REGISTRY_SERVER=$registry"
              if [ "${BASH_REMATCH[1]}" = http ]; then
                echo "YARN_UNSAFE_HTTP_WHITELIST=${BASH_REMATCH[2]}"
              fi
            } >> "$GITHUB_ENV"
            echo "npm cache: $registry answered — registry override active"
          elif [ -n "$legacy" ]; then
            # Nothing configured and the old address is silent: not a
            # fault, e.g. a GitHub-hosted runner. No warning.
            echo "npm cache: none configured, legacy address silent — direct npmjs for this job"
          else
            echo "::warning::npm cache unreachable — direct npmjs for this job"
          fi

      # GitHub-hosted carries only buildx's default `docker` driver,
      # which cannot produce attestations — goreleaser's dockers_v2 asks
      # for them. setup-buildx-action creates a docker-container builder
      # that can; QEMU covers the non-native arch of a multi-platform
      # manifest. Only without remote builders: with them there is no
      # daemon for either.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.remote-builders == ''

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.remote-builders == ''

      # ARC only (the hosted steps above skip themselves on ARC).
      # A runner that gets the BuildKit client certificate as environment
      # variables (CI_BUILDKIT_TLS_CA_PEM, CI_BUILDKIT_TLS_CERT_PEM and
      # CI_BUILDKIT_TLS_KEY_PEM, e.g. container-task secrets) gets it written
      # to a fresh directory and exported as CI_BUILDKIT_TLS_DIR, which the
      # next step reads. With CI_BUILDKIT_TLS_DIR already set, or none of
      # them, it changes nothing; a half-set certificate fails here.
      - uses: truvity/ci-actions/setup-buildkit-tls@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
        if: inputs.remote-builders != ''

      # The CI plane's BuildKit builders as one remote-driver buildx builder
      # (`ci`): one node per `platforms=endpoint` entry, native builds on a
      # hot layer cache, no QEMU. The first node is the builder itself, the
      # rest are appended. Transport comes from the runner, not from here:
      # when the runner provides CI_BUILDKIT_TLS_DIR (a directory holding
      # ca.pem, cert.pem and key.pem; the step above writes one from the
      # CI_BUILDKIT_TLS_*_PEM variables) every node is dialled with mutual
      # TLS; without it the nodes are plain TCP, as before. An optional
      # CI_BUILDKIT_TLS_SERVERNAME overrides the certificate name the
      # builders are verified against (buildx defaults to the endpoint host).
      # Every entry is matched against a strict pattern before it can reach
      # a step output.
      - name: Plan the remote builders
        id: builders
        if: inputs.remote-builders != ''
        env:
          NODES: ${{ inputs.remote-builders }}
        run: |
          set -euo pipefail
          set -f
          fail() { echo "::error::$*"; exit 1; }
          # The list a RUNNER exports (CI_RUNNER_REMOTE_BUILDERS, same format)
          # wins over the input: a pool that reaches the builders by other
          # names carries its own. Whether builders are used at all stays the
          # caller's choice; unset, nothing changes. Only the source is logged.
          if [ -n "$(printf %s "${CI_RUNNER_REMOTE_BUILDERS:-}" | tr -d "[:space:]")" ]; then
            NODES="$CI_RUNNER_REMOTE_BUILDERS"
            echo "builders: nodes from the runner (CI_RUNNER_REMOTE_BUILDERS)"
          else
            echo "builders: nodes from the input"
          fi
          [ -n "${NODES//[[:space:]]/}" ] || fail "remote-builders is empty — set the org variable, export CI_RUNNER_REMOTE_BUILDERS from the runner, or skip this step"

          opts=""
          tls_dir="${CI_BUILDKIT_TLS_DIR:-}"
          if [ -n "$tls_dir" ]; then
            [[ "$tls_dir" =~ ^/[A-Za-z0-9._/-]+$ ]] || fail "CI_BUILDKIT_TLS_DIR is not a plain absolute path"
            for f in ca.pem cert.pem key.pem; do
              [ -r "$tls_dir/$f" ] || fail "CI_BUILDKIT_TLS_DIR is set but $tls_dir/$f is not readable"
            done
            opts="cacert=$tls_dir/ca.pem"$'\n'"cert=$tls_dir/cert.pem"$'\n'"key=$tls_dir/key.pem"
            servername="${CI_BUILDKIT_TLS_SERVERNAME:-}"
            if [ -n "$servername" ]; then
              [[ "$servername" =~ ^[A-Za-z0-9.-]+$ ]] || fail "CI_BUILDKIT_TLS_SERVERNAME is not a plain DNS name"
              opts+=$'\n'"servername=$servername"
            fi
            echo "builders: mutual TLS, credentials from $tls_dir"
          else
            echo "builders: plain TCP (CI_BUILDKIT_TLS_DIR is not set)"
          fi

          n=0; want=""; append=""; endpoint=""; platforms=""
          for entry in $NODES; do
            [[ "$entry" == *=* ]] || fail "builder entry '$entry' is not platforms=endpoint"
            p="${entry%%=*}"; e="${entry#*=}"
            [[ "$p" =~ ^[a-z0-9_./,-]+$ ]] || fail "builder platforms '$p' are not a platform list"
            [[ "$e" =~ ^(tcp|unix)://[][A-Za-z0-9._:/@-]+$ ]] || fail "builder endpoint '$e' is not a tcp:// or unix:// address"
            want+="${want:+,}$p"
            if [ "$n" = 0 ]; then
              endpoint="$e"; platforms="$p"
            else
              append+="- name: ci$n"$'\n'"  endpoint: $e"$'\n'"  platforms: $p"$'\n'
              if [ -n "$opts" ]; then
                append+="  driver-opts:"$'\n'
                while IFS= read -r o; do append+="    - $o"$'\n'; done <<<"$opts"
              fi
            fi
            n=$((n+1))
          done

          {
            echo "endpoint=$endpoint"
            echo "platforms=$platforms"
            echo "want=$want"
            echo "driver-opts<<EOF_OPTS"; printf '%s\n' "$opts"; echo "EOF_OPTS"
            echo "append<<EOF_APPEND"; printf '%s' "$append"; echo "EOF_APPEND"
          } >> "$GITHUB_OUTPUT"
          echo "builders: $n node(s), platforms $want"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        if: inputs.remote-builders != ''
        with:
          driver: remote
          name: ci
          endpoint: ${{ steps.builders.outputs.endpoint }}
          platforms: ${{ steps.builders.outputs.platforms }}
          driver-opts: ${{ steps.builders.outputs.driver-opts }}
          append: ${{ steps.builders.outputs.append }}

      # Later steps (and the recipes' own `docker build`) reach the builder
      # through BUILDX_BUILDER. Fail here, with the reason, when a node does
      # not offer the platform it was declared for.
      - name: Check the builders offer their platforms
        if: inputs.remote-builders != ''
        env:
          WANT: ${{ steps.builders.outputs.want }}
          GOT: ${{ steps.buildx.outputs.platforms }}
        run: |
          set -euo pipefail
          echo "BUILDX_BUILDER=ci" >> "$GITHUB_ENV"
          for p in ${WANT//,/ }; do
            case ",$GOT," in
              *",$p,"*) ;;
              *) echo "::error::builder ci does not offer $p (offers: $GOT)"; exit 1 ;;
            esac
          done

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      # The official action rather than a hand-rolled credential helper.
      # It consumes the role assumed directly above and writes the auth
      # entry that helm and oras read from ~/.docker/config.json — the
      # Docker credential store resolves a static `auths` entry exactly
      # as it resolves a credHelpers one.
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ inputs.ecr-registries }}
          mask-password: "true"

      # Job-time, never image-baked: the Pro EULA's no-distribution
      # clause covers the binary even though goreleaser hosts it on a
      # public releases page — public-from-the-vendor grants us no
      # redistribution right.
      - name: Install goreleaser-pro
        if: inputs.install-goreleaser-pro
        env:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser-pro
          GORELEASER_VERSION: v2.17.1
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in x86_64) arch=x86_64 ;; aarch64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/goreleaser-pro"
          curl -fsSL "https://github.com/goreleaser/goreleaser-pro/releases/download/${GORELEASER_VERSION}/goreleaser-pro_Linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/goreleaser-pro" goreleaser
          # PATH, not /usr/local/bin: ARC runners have no sudo, and the
          # devbox-run Release step inherits the job PATH.
          echo "$RUNNER_TEMP/goreleaser-pro" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/goreleaser-pro/goreleaser" --version

      # The licence as something this job READS, not as a copy every
      # caller holds: the run's own OIDC identity exchanged at
      # access-roster, one login, one read of one path (docs/secrets.md).
      # The issuer's grants and one read-only policy decide it; no input
      # here can widen that.
      #
      # `continue-on-error` is the rollout, not the destination. A caller
      # that has proven the read drops its `goreleaser-key` secret, and
      # the fallback below then resolves to empty on its own.
      - name: Read the goreleaser licence from OpenBAO
        id: licence
        if: inputs.goreleaser-licence-path != ''
        continue-on-error: true
        uses: truvity/ci-actions/openbao-secrets@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
        with:
          issuer: ${{ inputs.openbao-issuer }}
          address: ${{ inputs.openbao-address }}
          namespace: ${{ inputs.openbao-namespace }}
          ca-cert: ${{ inputs.openbao-ca }}
          path: ${{ inputs.goreleaser-licence-path }}

      # Which BuildKit cache this job uses: the runner's own (CI_RUNNER_BUILDX_CACHE) over the
      # input. A stable runner names the stable registry account's, a preview runner the
      # devel account's, whatever organisation variable the caller passed. This runs after
      # the release role is assumed, so it keeps CI_BUILDX_CACHE (read and write) even on a
      # runner with CI_RUNNER_CACHE_WRITES=release-credentials.
      - name: Resolve the BuildKit cache
        id: bkcache
        env:
          CACHE: ${{ inputs.buildx-cache }}
        run: |
          set -euo pipefail
          # A runner that exports CI_RUNNER_BUILDX_CACHE names the BuildKit cache of ITS
          # tier (preview and stable runners each have the registry cache of their own
          # account) and wins over the input, the caller's organisation variable. Whether
          # a cache is used at all stays the caller's choice: the runner's value matters
          # only to a job that gets here. Either value must be <registry>/<repository>,
          # no tag, no space: it becomes an environment value and an ECR login.
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf %s "$v"; }
          ref_re='^[a-z0-9][a-z0-9.-]*(:[0-9]+)?/[a-z0-9][a-z0-9._/-]*$'
          cache="$(trim "$CACHE")"
          runner="$(trim "${CI_RUNNER_BUILDX_CACHE:-}")"
          if [ -n "$runner" ]; then
            [[ "$runner" =~ $ref_re ]] || { echo "::error::CI_RUNNER_BUILDX_CACHE is not a registry reference (<registry>/<repository>, no tag)"; exit 1; }
            cache="$runner"; echo "buildx cache: $cache (from the runner's CI_RUNNER_BUILDX_CACHE)"
          elif [ -n "$cache" ]; then
            [[ "$cache" =~ $ref_re ]] || { echo "::error::buildx-cache is not a registry reference (<registry>/<repository>, no tag)"; exit 1; }
            echo "buildx cache: $cache (from the input)"
          else
            echo "buildx cache: none"
          fi
          echo "ref=$cache" >> "$GITHUB_OUTPUT"

      - name: Release
        # The command reaches the shell through env and word-splits
        # there — an expression spliced into the script text would be
        # parsed as CODE, quotes and $() included (CodeQL alert 25).
        # SC2086: the split IS the contract — `command` is a word list
        # (every caller passes e.g. `go tool gemaalctl pipeline
        # release-stable --config …`), never one shell-quoted argument.
        run: |
          # shellcheck disable=SC2086
          devbox run -- $RELEASE_COMMAND
        env:
          RELEASE_COMMAND: ${{ inputs.command }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ steps.licence.outputs.value || secrets.goreleaser-key }}
          # Read AND write: this step runs after the release role was assumed, and that
          # role is what may push the cache on a tier whose own identity only pulls it
          # (CI_RUNNER_CACHE_WRITES=release-credentials). CI_BUILDX_CACHE_FROM is the
          # read reference for a consumer that reads without writing.
          CI_BUILDX_CACHE: ${{ steps.bkcache.outputs.ref }}
          CI_BUILDX_CACHE_FROM: ${{ steps.bkcache.outputs.ref }}
          GEMAAL_SBOM_GENERATOR: ${{ inputs.sbom-generator }}
          # No profiles on a runner: the default credential chain must
          # resolve the job's OIDC role from env. A stray AWS_PROFILE
          # overrides it and surfaces as a confusing 403 several layers
          # down, not as "wrong profile".
          GEMAAL_AWS_AMBIENT: "1"
