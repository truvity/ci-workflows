# This repository's own CI. One gate, and it is smaller than it was.
#
# Three case harnesses and a pin-staleness gate left on 2026-09-24 with
# the composite actions themselves (INF-971). What they tested now lives
# and is tested in truvity/ci-actions: discovery, caller parity and the
# cache wiring are properties of the actions, and `pins are current`
# existed only because a workflow here pinned an action here.
#
# That gate cannot come back, and should not. It asked whether a pin was
# older than the action file it named -- a question with no answer inside
# the pull request that introduces the action, because the commit to pin
# does not exist until the merge and rebase-merge rewrites it. Across
# repositories the question is simply not raised: an action change is one
# pull request THERE, and a pin bump is one pull request HERE, against a
# tag that already exists.
name: self-check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check`, the estate's one canonical required-context name (gitops
  # cfg/github.yaml merge-gate doctrine). Renamed from `lint` when this
  # repository gained a merge gate -- renaming a required job wedges every
  # open PR, so the name changed BEFORE the context became required.
  #
  # Since 2026-09-24 it is also the WHOLE gate: `review: none` on the
  # gitops row, so green here is what merges a pull request. A check that
  # is not run here is a check nobody runs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 1 again. The full history was here for `pins are
          # current`, which compared two commits in this repository; the
          # gates that remain read the working tree and the libraries'
          # remote tag lists, neither of which needs local history.
          fetch-depth: 1

      # A workflow with a syntax error does not go red -- GitHub declines to
      # run it, which reads as "no CI configured" rather than as a failure.
      # An estate-wide edit mangled runs-on in ten files on 2026-08-15 and it
      # surfaced only because sibling PRs could not satisfy a required check.
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

      # The rule this library asks of every caller, asked of itself: a pin
      # into the shared CI library must name a RELEASE. A pin to an
      # untagged commit works perfectly until somebody asks what version a
      # repository is on, and the `# v1.0.0` beside it is then a wish.
      #
      # It judges BOTH halves of the library now, which is the whole
      # reason it takes a list: every action pin in this repository points
      # at truvity/ci-actions, and a guard that knew only the old name
      # would pass over all nineteen of them in silence.
      - uses: truvity/ci-actions/tagged-pins@752ccce8a3a3163040d6c017921a642465dde09a # v1.0.0

      # The rule this library asks of every public caller, asked of itself
      # first. This repository is public and runs hosted, so the expected
      # answer is "ok" -- which is the point. A guard nobody runs is a
      # guard nobody knows is broken.
      - uses: truvity/ci-actions/public-runners@752ccce8a3a3163040d6c017921a642465dde09a # v1.0.0
        with:
          runners: ubuntu-latest
          visibility: ${{ github.event.repository.visibility }}

      # This repository is PUBLIC and its history cannot be unpublished.
      # Everything particular -- account ids, role ARNs, registry hosts,
      # bucket names, internal DNS -- belongs in the caller's org
      # variables. truvity/ci-actions carries its own copy of this, for
      # the same reason and over its own files.
      - name: leak canary
        run: ./hack/leak-canary.sh
