# Integration suites for a gemaal-shaped project — the shared shape of
# two private callers' integration workflows, which had grown into two
# copies of one pipeline (2026-09-07).
#
# One job per LANE: build the artifacts the lane tests (a snapshot
# through gemaal, or a chart alone), optionally install them into the
# CI tenant and migrate, run the suite, capture pod logs on failure,
# uninstall. There is no aggregate job: the required check the ruleset
# names has to live in the CALLER (see the bottom of this file).
#
# What is shared, and where it came from:
#   - devbox bootstrap, Go cache/proxy, private modules: setup-devbox;
#   - cluster and AWS access: the caller's own kubeconfig and aws.ini —
#     the SAME files a laptop uses. Their exec plugin and credential_process
#     are `accessctl`, which in a job exchanges the job's GitHub token at
#     access-issuer instead of a sign-in, so no second copy for CI
#     exists; then the identity proof one caller's cluster-access job ran;
#   - image builds: the CI plane's remote builders (setup-remote-builders)
#     with the warm registry cache, and CodeArtifact for the Node
#     bundles — the other caller's steps;
#   - phases with their own verdicts, log dump, uninstall-always — likewise;
#   - the warm-cache report — the first caller.
#
# NOTHING PARTICULAR LIVES HERE. This repository is public: registries,
# builders, cache, namespaces, server URLs and identities arrive from the
# caller, mostly from org variables.
#
# A lane's build/test commands are shell: a caller that needs an
# environment tweak puts it in the command (a moon caller drops
# CI/GITHUB_ACTIONS: `env CI= GITHUB_ACTIONS= devbox run -- moon run …`).
#
# TWO TIERS, one lane shape (docs/tiers.md has the full case):
#   - shared: a private repository's suites run on the estate's own
#     runners against the estate's own development cluster — everything
#     above, unchanged since the day it was written.
#   - kind: a PUBLIC repository's suites run on a GitHub-hosted runner
#     against a disposable kind cluster (truvity/ci-actions' `cluster`
#     action, mode: kind), because a public repository's pull requests
#     come from forks and must never reach the estate's own runners or
#     credentials (the same rule check.yaml and public-runners already
#     enforce). The tier follows `github.event.repository.visibility`,
#     not a caller's say-so — a public repository cannot opt into
#     `shared`, ever. `tier` lets a PRIVATE caller opt into `kind`
#     instead (proving the public path, or just not needing the shared
#     tenant), which is the only direction the override is allowed to go.
#
# The shared path below is BYTE-FOR-BYTE what it was before this tier
# split: same steps, same conditions, same inputs. It is not routed
# through the cluster action's own `mode: shared` — that mode resolves
# `kubectl` from bare PATH and always logs into ECR when
# `ecr-registries` is set, while this workflow calls `kubectl` through
# the caller's devbox (no bare kubectl on a self-hosted runner) and
# lets a lane opt out of ECR/builders/CodeArtifact with `images: false`.
# Making the two equivalent would mean teaching the action a devbox
# indirection and a per-matrix-lane images flag it has no way to know
# about — so a private caller's behaviour stays exactly what it was,
# and only the new kind branches are new code.
name: integration

on:
  workflow_call:
    inputs:
      lanes:
        description: >-
          JSON array of lanes, each a job. Keys: `name` (job suffix and
          release-name prefix), `build` (shell command; the lane's
          artifacts), `test` (shell command; the suite), optional
          `install` and `migrate` (shell commands, phases before the
          suite; when `install` is set the suite runs with
          GEMAAL_TEST_SKIP_DEPLOY/DESTROY), optional `uninstall` (shell
          command, always runs), optional `images` (boolean, default
          true: register the remote builders, log into ECR, mint the
          CodeArtifact token — off for a lane that builds no image).
        required: true
        type: string
      runner:
        description: >-
          Scale-set label for the lane jobs (vars.CI_RUNNER_LABEL_LARGE).
          Ignored on the kind tier, which always runs on `ubuntu-latest`
          (a disposable kind cluster has no reason to run anywhere else,
          and a public repository could not use a self-hosted label
          regardless — public-runners refuses it below). Relaxed from
          required to optional with a hosted default so a kind-tier
          caller need not pass a meaningless value; every existing
          shared-tier caller already passes its own label explicitly, so
          this changes nothing for them.
        required: false
        type: string
        default: ubuntu-latest
      tier:
        description: >-
          Force the tier instead of deriving it from the caller's
          repository visibility. `kind` is allowed for ANY caller — a
          private repository proving the public path, or one with no
          shared tenant to use. `shared` is refused for a public
          repository, always: see docs/tiers.md for why. Empty (the
          default) derives `kind` for a public repository and `shared`
          for a private one.
        required: false
        type: string
        default: ""
      policy-version:
        description: >-
          Release tag of truvity/policy whose hack/kind/ box the kind
          tier stands up (e.g. v0.8.1) — truvity/ci-actions' `cluster`
          action fetches it at this exact tag. Required when the tier is
          (or resolves to) kind; ignored on the shared tier.
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 60
      gemaal-namespace:
        description: >-
          The namespace the suites deploy into. Required on the shared
          tier (the CI tenant namespace); on the kind tier it is also the
          namespace truvity/ci-actions' `cluster` action installs into,
          and its own default (`e2e`) applies when this is left empty.
        required: false
        type: string
        default: ""
      gemaal-server:
        description: >-
          In-cluster gemaal server URL. Shared tier only — a kind lane's
          suite talks to the box directly and leaves this empty.
        required: false
        type: string
        default: ""
      aws-config-file:
        description: >-
          Repo-relative aws.ini, the one a laptop uses. Its [default] must
          carry no credential: in a job that would shadow the runner pool's
          identity for every call. Roles are named profiles.
        required: false
        type: string
        default: aws.ini
      kubeconfig:
        description: >-
          Repo-relative kubeconfig, the one a laptop uses, whose exec plugin
          is `accessctl kube-token`.
        required: false
        type: string
        default: kubeconfig
      expected-identity:
        description: >-
          Cluster identity `kubectl auth whoami` must report — for a job,
          `github:<owner>/<repo>`. Empty skips the proof. A wrong identity
          fails before any build.
        required: false
        type: string
        default: ""
      ecr-registries:
        description: ECR account ids to log into for the image lanes (the pool identity pushes snapshots).
        required: false
        type: string
        default: ""
      remote-builders:
        description: >-
          The CI plane's BuildKit nodes, `platforms=endpoint` entries
          separated by whitespace (vars.CI_REMOTE_BUILDERS). Required by
          every lane that builds images.
        required: false
        type: string
        default: ""
      buildx-cache:
        description: Registry reference of the BuildKit warm cache (vars.CI_BUILDX_CACHE); empty means no cache flags.
        required: false
        type: string
        default: ""
      cache-report:
        description: Append the warm cache's tags for this project to the job summary (needs buildx-cache and ECR read).
        required: false
        type: boolean
        default: false
      go-private:
        required: false
        type: string
        default: ""
      module-app-client-id:
        required: false
        type: string
        default: ""
      go-cache-server:
        description: >-
          Base URL of a truvity/ci-cache server. The CALLER passes it, as
          it does go-cache-bucket, and there is deliberately NO fallback to
          `vars.CI_GOCACHE_SERVER` here: a caller decides per workflow
          whether a Go cache applies at all, and reading the org variable
          inside this workflow took that decision away. A caller's security
          workflow passes no cache inputs on purpose and got one anyway,
          on a GitHub-hosted runner that can reach neither the binary nor
          the service. TAKES PRECEDENCE over go-cache-bucket when both are
          set, so a caller migrating from one to the other does not depend
          on the order of two conditions.
        required: false
        type: string
        default: ""
      go-cache-bucket:
        required: false
        type: string
        default: ""
      go-cache-region:
        required: false
        type: string
        default: ""
      goproxy:
        description: >-
          Go module proxy. Empty falls back to the CALLER's
          `vars.CI_GOPROXY` (a reusable workflow reads the caller
          repository's variables); both empty leaves Go's default. Applied
          only alongside go-cache-bucket, like the rest of the cache wiring.
        required: false
        type: string
        default: ""
      codeartifact-domain:
        description: Mint a CodeArtifact token (ambient identity) for the image lanes when set.
        required: false
        type: string
        default: ""
      codeartifact-domain-owner:
        required: false
        type: string
        default: ""
      codeartifact-region:
        required: false
        type: string
        default: ""
      node-cache:
        description: >-
          Node projects: cache the yarn fetch cache across runs and point
          npm/yarn at the CI plane's read-through registry when it
          answers (fallback, not dependency — same probe as check.yaml).
          Default true: the yarn cache is skipped without a root
          yarn.lock and the probe without a self-hosted runner, so it
          is a no-op for repositories without Node.
        required: false
        type: boolean
        default: true
      strip-local-tools:
        required: false
        type: string
        default: "true"
      proto:
        required: false
        type: string
        default: auto
    secrets:
      goreleaser-key:
        required: false
      module-app-private-key:
        required: false

# NO permissions block, deliberately — the check.yaml rule. A reusable
# workflow's block is a CEILING on what the caller granted: this one said
# `contents: read` + `id-token: write`, and the `packages: read` a caller
# granted for GitHub Packages never reached the job, whose install then
# answered 403. Jobs inherit exactly what the caller grants. Callers
# declare, at workflow level and on the calling job:
#
#   contents: read     # always — checkout
#   id-token: write    # the cluster and AWS through accessctl
#   packages: read     # ONLY if the repo installs @truvity packages from GitHub Packages

jobs:
  # A public repository runs on GitHub-hosted runners, always. This refuses
  # anything else BEFORE a job could land on the estate's own infrastructure,
  # which is why it hard-codes its own runner rather than taking the caller's.
  #
  # The runner group's "allow public repositories" setting is the hard stop
  # and stays off; this is the second lock, and it exists because the way a
  # public repository ends up on a self-hosted tier is not malice — it is
  # copying a private repository's caller, which currently succeeds silently.
  # A private caller passes immediately and pays a few seconds.
  #
  # This job now ALSO resolves the tier, once, so every lane job (the
  # matrix below) agrees on it rather than each re-deriving it. It is
  # named `tier` rather than `runners` for that reason; neither name is
  # a required-status context anywhere (the caller's fan-in is what a
  # ruleset names — see the bottom of this file), so renaming it here
  # carries no risk.
  tier:
    name: tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.resolve.outputs.tier }}
    steps:
      - uses: truvity/ci-actions/public-runners@73a8e54d28025275f2b2750ae4bfc56f008b36cb # v1.3.0
        with:
          runners: ${{ inputs.runner }}
          visibility: ${{ github.event.repository.visibility }}

      # Visibility decides, not the caller — a public repository asking
      # for `tier: shared` is refused here, before anything else runs,
      # the same way public-runners above refuses a self-hosted label.
      # A private repository may ask for `kind` freely: that direction
      # only ever trades the estate's shared tenant for a cheaper,
      # disposable one, never the other way round.
      - name: resolve tier
        id: resolve
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          FORCE_TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          case "$FORCE_TIER" in
            "")
              if [ "$VISIBILITY" = public ]; then tier=kind; else tier=shared; fi
              ;;
            kind)
              tier=kind
              ;;
            shared)
              if [ "$VISIBILITY" = public ]; then
                echo "::error::tier: shared is refused for a public repository — a public repository always runs the kind tier (see docs/tiers.md)."
                exit 1
              fi
              tier=shared
              ;;
            *)
              echo "::error::tier must be 'kind' or 'shared' (or empty to derive it from visibility) — got '$FORCE_TIER'"
              exit 1
              ;;
          esac
          echo "tier=$tier" >>"$GITHUB_OUTPUT"
          echo "resolved tier: $tier (visibility=$VISIBILITY, tier input='$FORCE_TIER')"

  suite:
    needs: tier
    name: integration-${{ matrix.name }}
    runs-on: ${{ needs.tier.outputs.tier == 'kind' && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.lanes) }}
    env:
      GEMAAL_TIER: ${{ needs.tier.outputs.tier }}
      GEMAAL_NAMESPACE: ${{ inputs.gemaal-namespace }}
      GEMAAL_SERVER: ${{ inputs.gemaal-server }}
      # Per lane and per attempt: parallel lanes must not share a
      # release, and a re-run must not inherit the previous attempt's.
      # Same shape truvity/ci-actions' `cluster` action falls back to
      # when a caller passes it no `release` of its own.
      GEMAAL_RELEASE: ${{ matrix.name }}-r${{ github.run_id }}-a${{ github.run_attempt }}
      GEMAAL_AWS_AMBIENT: "1"
      AWS_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.aws-config-file }}
      KUBECONFIG: ${{ github.workspace }}/${{ inputs.kubeconfig }}
      # GitHub Packages wants a token to install even a public package.
      # The job's own, which reads only what the caller's `packages: read`
      # grants; a caller whose packages come from nowhere else ignores it.
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
      # `images` absent means true. Compared as a STRING on purpose: the
      # expression language coerces a missing key to 0, and
      # `matrix.images == false` was true for every lane that did not
      # spell the key — no builders, no ECR login, dead snapshot builds
      # on the first run of every caller.
      LANE_IMAGES: ${{ format('{0}', matrix.images) == 'false' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the snapshot version from history.
          fetch-depth: 0

      - uses: truvity/ci-actions/setup-devbox@73a8e54d28025275f2b2750ae4bfc56f008b36cb # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          proto: ${{ inputs.proto }}
          strip-local-tools: ${{ inputs.strip-local-tools }}
          go-private: ${{ inputs.go-private }}
          module-app-client-id: ${{ inputs.module-app-client-id }}
          module-app-private-key: ${{ secrets.module-app-private-key }}
          go-cache-server: ${{ inputs.go-cache-server }}
          go-cache-bucket: ${{ inputs.go-cache-bucket }}
          go-cache-region: ${{ inputs.go-cache-region }}
          goproxy: ${{ inputs.goproxy || vars.CI_GOPROXY }}
          aws-config-file: ${{ inputs.aws-config-file }}

      # kind tier only. Launched in the BACKGROUND, right before Build:
      # the box takes minutes to come up (kind create, Gateway API CRDs,
      # CNPG, NATS, cert-manager, …) and the lane's Build step needs none
      # of that — only the registry the box publishes on localhost:5001,
      # which is up within the first few seconds and which the build
      # script itself waits for explicitly. So the two run side by side
      # instead of serially; "mode: wait" below blocks on it right before
      # Install, which DOES need the whole box.
      - name: "cluster (mode: kind, background)"
        if: needs.tier.outputs.tier == 'kind'
        uses: truvity/ci-actions/cluster@73a8e54d28025275f2b2750ae4bfc56f008b36cb # v1.3.0
        with:
          mode: kind
          background: "true"
          policy-version: ${{ inputs.policy-version }}
          namespace: ${{ inputs.gemaal-namespace }}
          release: ${{ env.GEMAAL_RELEASE }}

      # No root yarn.lock, nothing to cache: without this guard the
      # default-on input would make every non-Node repo save an empty
      # path and warn about it.
      - name: Cache the yarn fetch cache
        if: inputs.node-cache && hashFiles('yarn.lock') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      # The registry override is fixed literals into GITHUB_ENV; the
      # in-cluster http host is the design (YARN_UNSAFE_HTTP_WHITELIST
      # names exactly it, or berry refuses plain http — YN0081).
      - name: Point npm and yarn at the CI-plane cache
        # Self-hosted only: a GitHub-hosted runner can never resolve the
        # in-cluster name, and probing there would print the
        # "unreachable" warning on every job of every hosted caller.
        if: inputs.node-cache && runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if curl -fsS --max-time 2 http://npm-cache.ci-cache.svc/-/ping >/dev/null 2>&1; then
            {
              echo "npm_config_registry=http://npm-cache.ci-cache.svc"
              echo "YARN_NPM_REGISTRY_SERVER=http://npm-cache.ci-cache.svc"
              echo "YARN_UNSAFE_HTTP_WHITELIST=npm-cache.ci-cache.svc"
            } >> "$GITHUB_ENV"
            echo "npm cache: npm-cache.ci-cache.svc answered — registry override active"
          else
            echo "::warning::npm cache unreachable — direct npmjs for this job"
          fi

      # `accessctl` (the caller's devbox has it) exchanges the job's GitHub
      # token when kubectl first calls it, so there is nothing to warm and
      # no token handled by a step. The proof then pins the identity before
      # anything is built: a wrong tenant fails here, not as a mysterious
      # RBAC error later.
      - name: Identity proof
        if: inputs.expected-identity != '' && needs.tier.outputs.tier != 'kind'
        env:
          EXPECTED: ${{ inputs.expected-identity }}
        run: |
          set -euo pipefail
          # Three tries, with stderr kept so a real refusal is readable (the
          # first shared run lost one lane to a bare "exit status 1").
          # stderr to a file, never merged into the capture: devbox's own
          # "Info: Running script" chatter lands on stderr and would sit in
          # front of the JSON.
          for attempt in 1 2 3; do
            if out=$(devbox run -- kubectl auth whoami -o json 2>"$RUNNER_TEMP/whoami.err"); then break; fi
            echo "attempt $attempt:"; cat "$RUNNER_TEMP/whoami.err"
            [ "$attempt" = 3 ] && { echo "::error::kubectl auth whoami failed three times"; exit 1; }
            sleep 10
          done
          WHO=$(printf '%s' "$out" | sed -n '/^{/,$p' | devbox run -- jq -r .status.userInfo.username)
          echo "cluster identity: $WHO"
          [ "$WHO" = "$EXPECTED" ] || { echo "::error::expected cluster identity $EXPECTED, got $WHO"; exit 1; }

      # `&& needs.tier.outputs.tier != 'kind'` on all three of these: a
      # hard rule, not a per-lane courtesy. A kind lane builds into the
      # box's own local registry (SNAPSHOT_REGISTRY from the cluster
      # action above) and needs none of ECR, the CI plane's remote
      # builders or CodeArtifact — and must never reach them even if a
      # caller forgets to set `images: false` on a lane that happens to
      # build no image either way.
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        if: env.LANE_IMAGES == 'true' && inputs.ecr-registries != '' && needs.tier.outputs.tier != 'kind'
        with:
          registries: ${{ inputs.ecr-registries }}
          mask-password: "true"

      - uses: truvity/ci-actions/setup-remote-builders@73a8e54d28025275f2b2750ae4bfc56f008b36cb # v1.3.0
        if: env.LANE_IMAGES == 'true' && needs.tier.outputs.tier != 'kind'
        with:
          remote-builders: ${{ inputs.remote-builders }}

      # The image build's yarn install reads it as a BuildKit secret
      # (the projects' goreleaser configs); minted with the pool's
      # ambient identity. tail -n1 + CR strip: devbox prefixes Info
      # lines to stdout. A step OUTPUT, not GITHUB_ENV: the build step
      # is the only consumer, and CodeQL's environment-injection query
      # treats anything derived from inputs as untrusted for GITHUB_ENV.
      - name: Mint a CodeArtifact token
        id: codeartifact
        if: env.LANE_IMAGES == 'true' && inputs.codeartifact-domain != '' && needs.tier.outputs.tier != 'kind'
        env:
          CA_DOMAIN: ${{ inputs.codeartifact-domain }}
          CA_OWNER: ${{ inputs.codeartifact-domain-owner }}
          CA_REGION: ${{ inputs.codeartifact-region }}
        run: |
          set -euo pipefail
          TOKEN=$(devbox run -- aws codeartifact get-authorization-token --domain "$CA_DOMAIN" --domain-owner "$CA_OWNER" --region "$CA_REGION" --query authorizationToken --output text | tail -n1 | tr -d '\r')
          [ -n "$TOKEN" ] || { echo "::error::minted CodeArtifact token is empty"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # The command reaches the shell through env and is evaluated
      # there, never spliced into the script text: matrix values are
      # workflow-controlled constants from the caller, but the habit
      # costs nothing (CodeQL alert 25 in release-private).
      - name: Build (${{ matrix.name }})
        env:
          LANE_BUILD: ${{ matrix.build }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.goreleaser-key }}
          CI_BUILDX_CACHE: ${{ inputs.buildx-cache }}
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
        run: eval "$LANE_BUILD"

      - name: Warm-cache report
        if: always() && inputs.cache-report && env.LANE_IMAGES == 'true' && inputs.buildx-cache != ''
        env:
          CACHE_REF: ${{ inputs.buildx-cache }}
          LANE: ${{ matrix.name }}
        run: |
          set -uo pipefail
          repo="${CACHE_REF#*/}"; region="$(echo "$CACHE_REF" | sed -E 's/^[^.]+\.dkr\.ecr\.([^.]+)\..*/\1/')"
          {
            echo "### Warm cache ($LANE)"
            echo '| tag | digest | pushed |'
            echo '|---|---|---|'
            devbox run -- aws ecr describe-images --region "$region" --repository-name "$repo" --output json > "$RUNNER_TEMP/cache-images.json"
            # shellcheck disable=SC2016 # a jq program, not shell
            printf '%s\n' \
              '.imageDetails[] | . as $img | (.imageTags // [])[]' \
              '| select(contains($p))' \
              '| "| \(.) | \($img.imageDigest[7:19]) | \($img.imagePushedAt) |"' \
              > "$RUNNER_TEMP/cache-report.jq"
            devbox run -- jq -r --arg p "$LANE" -f "$RUNNER_TEMP/cache-report.jq" "$RUNNER_TEMP/cache-images.json"
          } >> "$GITHUB_STEP_SUMMARY" || echo "cache report failed (non-fatal)" >> "$GITHUB_STEP_SUMMARY"

      # kind tier only. Blocks on the background launch above — Install
      # is the first phase that needs the whole box (fixture and chart
      # installs land on real Services), not just the registry.
      - name: "cluster (mode: wait)"
        if: needs.tier.outputs.tier == 'kind'
        uses: truvity/ci-actions/cluster@73a8e54d28025275f2b2750ae4bfc56f008b36cb # v1.3.0
        with:
          mode: wait

      - name: Install (${{ matrix.name }})
        if: matrix.install != ''
        env:
          LANE_INSTALL: ${{ matrix.install }}
        run: eval "$LANE_INSTALL"

      - name: Migrate (${{ matrix.name }})
        if: matrix.migrate != ''
        env:
          LANE_MIGRATE: ${{ matrix.migrate }}
        run: eval "$LANE_MIGRATE"

      # SKIP_BUILD always: dist/ came from the build step. SKIP_DEPLOY and
      # SKIP_DESTROY only when the lane installed explicitly — a suite
      # without an install phase deploys and destroys from its own
      # TestMain (one caller's shape).
      - name: Suite (${{ matrix.name }})
        env:
          LANE_TEST: ${{ matrix.test }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMAAL_TEST_SKIP_BUILD: "true"
          GEMAAL_TEST_SKIP_DEPLOY: ${{ matrix.install != '' && '1' || '' }}
          GEMAAL_TEST_SKIP_DESTROY: ${{ matrix.install != '' && '1' || '' }}
        run: eval "$LANE_TEST"

      - name: Dump service pod logs
        if: failure()
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/dump-pod-logs.sh" <<'DUMP'
          set -uo pipefail
          found=0
          for pod in $(kubectl -n "$GEMAAL_NAMESPACE" get pods -o name | sed 's|^pod/||' | grep "^$GEMAAL_RELEASE" || true); do
            for c in $(kubectl -n "$GEMAAL_NAMESPACE" get "pod/$pod" -o jsonpath='{.spec.containers[*].name}'); do
              found=1
              echo "::group::$pod ($c)"
              kubectl -n "$GEMAAL_NAMESPACE" logs "pod/$pod" -c "$c" --tail=400 2>&1 || true
              echo "::endgroup::"
            done
          done
          [ "$found" = 1 ] || echo "::warning::no pods matched $GEMAAL_RELEASE -- nothing captured"
          DUMP
          devbox run -- bash "$RUNNER_TEMP/dump-pod-logs.sh"

      - name: Uninstall (${{ matrix.name }})
        if: always() && matrix.uninstall != ''
        env:
          LANE_UNINSTALL: ${{ matrix.uninstall }}
        run: eval "$LANE_UNINSTALL"

  # NO fan-in job here, deliberately. This file used to carry one, called
  # `integration`, described as "the one required check" — and it could
  # never be that. GitHub reports every job of a reusable workflow as
  # `<caller job> / <its own name>`, so it arrived at the consumer as
  # `integration / integration` and the bare `integration` its ruleset
  # required stayed "Expected — Waiting for status to be reported"
  # forever. It wedged every PR in one caller for a day while all six
  # real checks were green, because an
  # unsatisfiable required context is PENDING, not failing: nothing goes
  # red to tell you.
  #
  # A reusable workflow cannot supply a required status context to
  # anybody. The fan-in has to live in the caller, where the ruleset can
  # name it and where renaming a lane cannot silently move it. README's
  # "Required checks" section carries the snippet.
