# Renovate for a whole estate from ONE caller — a matrix of small jobs, one
# per enrolled repository. Nothing runs in, and nothing is held by, the
# repositories it updates.
#
# Why a matrix and not one long job: a single process over an estate made
# one repository's transient error red for all of them, reran everything to
# retry one, and grew toward its timeout with the estate (47 repositories,
# 47 minutes, one GitHub 504 in one repository turned the run red). Here a
# failure reds one repository's job; rerun failed jobs only.
#
# Why central and not a job inside each repository: every repository would
# again carry a workflow, a pin, and a way to reach an App key.
#
# SCOPE is an explicit list in the caller repository (`repositories-file`,
# `list`), not every repository the App can see. An enrolled repository the
# App cannot reach is an error annotation.
#
# ESTATE POLICY lives in the caller repository too (`global-config`): a
# renovate config every job loads as defaults under each repository's own
# `renovate.json`. The intended use is deciding major versions once for the
# estate — see docs/fleet.md.
#
# TOKENS come from one of two sources (`token-source`):
#
#   app-key        the caller holds each App's private key as a secret and
#                  every job mints with actions/create-github-app-token.
#   access-roster  the caller holds no key. Every job that needs a token
#                  exchanges its own GitHub OIDC identity token at an
#                  access-roster issuer for an installation token of a
#                  catalogue App, and the issuer's grants decide. Nothing
#                  to rotate, nothing to leak from the caller.
#
# Either way the jobs that mint declare `id-token: write`, so the caller
# must grant it (a called workflow can only narrow what its caller grants).
#
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     renovate:
#       uses: truvity/ci-workflows/.github/workflows/renovate-fleet.yaml@<sha> # vX.Y.Z
#       with:
#         estate: private
#         runner: ${{ vars.CI_RUNNER_LABEL_LARGE }}
#         list: renovate.private
#         token-source: access-roster
#         access-roster-issuer: https://access.example
#         github-app: renovate-private
#         approver-github-app: ci-automation
#
# or, with keys:
#
#       with:
#         client-id: ${{ vars.RENOVATE_CLIENT_ID }}
#       secrets:
#         RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
#
# Secrets are passed explicitly, always: a caller in another organisation
# cannot inherit, and a same-org caller holds exactly what it passes.
name: renovate-fleet

on:
  workflow_call:
    inputs:
      estate:
        description: "`public` or `private` — the only visibility this run may touch."
        required: true
        type: string
      runner:
        description: Where each repository's job runs. GitHub-hosted for the public estate; the pool label for the private one.
        required: false
        type: string
        default: ubuntu-latest
      token-source:
        description: >-
          Where tokens come from: `app-key` (the App keys passed as
          secrets, with the `*-client-id` inputs) or `access-roster`
          (installation tokens exchanged at `access-roster-issuer` for the
          job's GitHub OIDC token, with the `*-github-app` inputs).
        required: false
        type: string
        default: app-key
      access-roster-issuer:
        description: The access-roster issuer URL. Required when token-source is `access-roster`.
        required: false
        type: string
        default: ""
      github-app:
        description: >-
          The renovate App's catalogue id at the issuer. Required when
          token-source is `access-roster`.
        required: false
        type: string
        default: ""
      approver-github-app:
        description: >-
          Catalogue id of the approver App (token-source `access-roster`).
          Its token is asked for `pull_requests:write` on one repository.
          Empty disables the approval step.
        required: false
        type: string
        default: ""
      go-modules-github-app:
        description: >-
          Catalogue id of an App whose `contents:read` token may read
          private Go modules, for go.sum regeneration (token-source
          `access-roster`). Often the renovate App itself. Empty skips it.
        required: false
        type: string
        default: ""
      debug-oidc-claims:
        description: >-
          Print the discover job's GitHub OIDC claims (repository, ref,
          ref_type, event_name, workflow_ref, job_workflow_ref, sha) —
          never the token — to check them against an issuer's matchers.
        required: false
        type: boolean
        default: false
      client-id:
        description: The renovate App's client id. Required when token-source is `app-key`.
        required: false
        type: string
        default: ""
      repositories-file:
        description: YAML file in the caller repository holding the enrolment lists.
        required: false
        type: string
        default: fleet.yaml
      list:
        description: >-
          Dotted path to this job's list inside repositories-file, e.g.
          `renovate.private`. Empty processes every repository the App can
          see (not recommended beyond a first survey).
        required: false
        type: string
        default: ""
      global-config:
        description: >-
          Renovate config file in the caller repository, loaded by every job
          as defaults under each repository's own config. Empty for none.
        required: false
        type: string
        default: ""
      approver-client-id:
        description: >-
          Client id of an App that approves renovate's non-major PRs where a
          review is required, so native auto-merge can fire on green. Empty
          disables the approval step (token-source `app-key`).
        required: false
        type: string
        default: ""
      go-modules-client-id:
        description: Client id of an App that may read private Go modules, for go.sum regeneration. Empty skips it.
        required: false
        type: string
        default: ""
      filter:
        description: RE2 over `owner/name`; only matches are processed.
        required: false
        type: string
        default: ""
      require-check:
        description: >-
          Skip repositories whose default branch has no required status
          check — from EITHER a repository ruleset or classic branch
          protection; either one counts, and a source that cannot be read
          leaves the rule undecided and the repository kept. Keep `true`
          wherever the repositories automerge: with nothing gating a
          merge, auto-merge lands immediately and unvalidated. `false`
          suits an estate whose repositories do not automerge yet and
          review every dependency PR by hand.
        required: false
        type: boolean
        default: true
      allowed-commands:
        description: JSON array of exact commands the repositories' postUpgradeTasks may run (RENOVATE_ALLOWED_COMMANDS).
        required: false
        type: string
        default: "[]"
      max-parallel:
        description: >-
          Repositories processed at once. Every job spends the same App
          installation's API budget, so raise this with care.
        required: false
        type: number
        default: 4
      log-level:
        required: false
        type: string
        default: info
      timeout-minutes:
        description: Per repository.
        required: false
        type: number
        default: 30
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        description: The renovate App's private key. Required when token-source is `app-key`.
        required: false
      APPROVER_APP_PRIVATE_KEY:
        description: The approver App's private key. Required when approver-client-id is set.
        required: false
      GO_MODULES_APP_PRIVATE_KEY:
        description: The go-modules App's private key. Required when go-modules-client-id is set.
        required: false

permissions:
  contents: read

jobs:
  # Which repositories, and nothing else. Runs on a GitHub-hosted runner in
  # every estate: it only reads the API and one file from the caller.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # token-source access-roster, and debug-oidc-claims
    outputs:
      repositories: ${{ steps.discover.outputs.repositories }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.list != ''
        with:
          sparse-checkout: ${{ inputs.repositories-file }}
          sparse-checkout-cone-mode: false

      - name: Read the enrolment list
        id: enrolled
        if: inputs.list != ''
        uses: truvity/ci-actions/enrolment-list@62eecede955676a2c0fb760dd185521528886d0b # v1.10.0
        with:
          file: ${{ inputs.repositories-file }}
          list: ${{ inputs.list }}

      # Once, here: every other job needs this one.
      - name: Check the token inputs
        uses: truvity/ci-actions/token-inputs@62eecede955676a2c0fb760dd185521528886d0b # v1.10.0
        with:
          source: ${{ inputs.token-source }}
          access-roster-issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          id: ${{ inputs.client-id }}
          id-name: client-id
          secret-name: RENOVATE_APP_PRIVATE_KEY
          has-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY != '' }}
          extra-keys: |
            approver-client-id|APPROVER_APP_PRIVATE_KEY|${{ secrets.APPROVER_APP_PRIVATE_KEY != '' }}|${{ inputs.approver-client-id }}
            go-modules-client-id|GO_MODULES_APP_PRIVATE_KEY|${{ secrets.GO_MODULES_APP_PRIVATE_KEY != '' }}|${{ inputs.go-modules-client-id }}
          warn-app-key-if: ${{ format('{0}{1}{2}', inputs.github-app, inputs.approver-github-app, inputs.go-modules-github-app) }}
          warn-app-key: the *-github-app inputs are read only with token-source access-roster
          warn-access-roster-if: ${{ format('{0}{1}', inputs.approver-client-id, inputs.go-modules-client-id) }}
          warn-access-roster: the *-client-id inputs are read only with token-source app-key

      # What an issuer's `github` matchers compare, as GitHub put it in
      # this job's identity token. The token is minted for a throwaway
      # audience, so it is good for nothing if it ever leaked, and only
      # its claims are printed.
      - name: Print this job's OIDC claims
        if: inputs.debug-oidc-claims
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: oidc-claims

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Not narrowed to repositories: discovery has to see all of them to
      # list them. Not narrowed in permissions either, although it only
      # reads: the required-check rule's fallback, GraphQL's
      # refUpdateRule, answers for the VIEWER, so a token weaker than the
      # matrix jobs' could find no required check where they would, and
      # skip the whole estate.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}

      - uses: truvity/ci-actions/fleet-discover@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        id: discover
        with:
          token: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          estate: ${{ inputs.estate }}
          filter: ${{ inputs.filter }}
          repositories: ${{ steps.enrolled.outputs.names }}
          require-check: ${{ inputs.require-check && 'true' || 'false' }}

  renovate:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # token-source access-roster
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    name: ${{ matrix.repository }}
    steps:
      - name: Name the repository
        id: repo
        env:
          REPO: ${{ matrix.repository }}
        run: |
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
          echo "artifact=renovate-report-${REPO//\//__}" >> "$GITHUB_OUTPUT"

      # A token for THIS repository only: the job holds no more reach than
      # the one repository it updates.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: key-token
        if: inputs.token-source == 'app-key'
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}

      # Every permission the grant allows: renovate's own list.
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: roster-token
        if: inputs.token-source == 'access-roster'
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.github-app }}
          repositories: ${{ steps.repo.outputs.name }}

      # The caller's estate policy, when there is one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.global-config != ''
        with:
          path: caller
          sparse-checkout: ${{ inputs.global-config }}
          sparse-checkout-cone-mode: false

      # renovate 44 uses RegExp.escape — a Node 24+ API.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The gomod manager shells out to bare `go` for go.sum regeneration;
      # `stable` suffices since go self-fetches whatever a go.mod names.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # yarn/pnpm shims for lockfile regeneration; each shim fetches the
      # version the target repository's `packageManager` pins.
      - name: Enable corepack
        run: corepack enable

      - name: Mint a token for reading private Go modules
        id: module-key-token
        if: inputs.token-source == 'app-key' && inputs.go-modules-client-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.go-modules-client-id }}
          private-key: ${{ secrets.GO_MODULES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Any module of the organisation may be required, so not narrowed to
      # repositories; read-only is the narrowing.
      - name: Exchange a token for reading private Go modules
        id: module-roster-token
        if: inputs.token-source == 'access-roster' && inputs.go-modules-github-app != ''
        uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.go-modules-github-app }}
          permissions: contents:read

      - name: Let go reach private modules
        if: steps.module-key-token.outputs.token != '' || steps.module-roster-token.outputs.github-token != ''
        env:
          MODULE_TOKEN: ${{ steps.module-key-token.outputs.token || steps.module-roster-token.outputs.github-token }}
        run: |
          set -euo pipefail
          git config --global \
            "url.https://x-access-token:$MODULE_TOKEN@github.com/.insteadOf" \
            "https://github.com/"

      - name: Locate the estate policy
        id: policy
        env:
          GLOBAL_CONFIG: ${{ inputs.global-config }}
        run: |
          set -euo pipefail
          if [ -n "$GLOBAL_CONFIG" ]; then
            f="$GITHUB_WORKSPACE/caller/$GLOBAL_CONFIG"
            [ -f "$f" ] || { echo "::error::$GLOBAL_CONFIG not found in the caller repository"; exit 1; }
            echo "file=$f" >> "$GITHUB_OUTPUT"
          fi
          echo "report=$RUNNER_TEMP/renovate-report.json" >> "$GITHUB_OUTPUT"

      # One repository. No autodiscovery, no onboarding PR, config required.
      # The report records every dependency with its available updates,
      # majors included, whatever the policy decided to open.
      - name: Run renovate
        env:
          GOPRIVATE: github.com/${{ github.repository_owner }}/*
          RENOVATE_TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: '["${{ matrix.repository }}"]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_CONFIG_FILE: ${{ steps.policy.outputs.file }}
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPORT_PATH: ${{ steps.policy.outputs.report }}
          RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed-commands }}
          LOG_LEVEL: ${{ inputs.log-level }}
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ steps.key-token.outputs.token || steps.roster-token.outputs.github-token }}
        # renovate: datasource=npm depName=renovate
        run: npx --yes renovate@44.44.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.repo.outputs.artifact }}
          path: ${{ steps.policy.outputs.report }}
          if-no-files-found: ignore
          retention-days: 14

      # Renovate cannot approve its own PRs. Where the default branch
      # requires a review, a non-major PR would sit green and unmergeable;
      # an approval from a SECOND App is what lets native auto-merge fire.
      # Only PRs that still need a review, only non-major, only once.
      - name: Mint the approver token
        id: approver-key
        if: inputs.token-source == 'app-key' && inputs.approver-client-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.approver-client-id }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}

      # Approving is pull_requests: write, and that is all it asks for.
      - name: Exchange the approver token
        id: approver-roster
        if: inputs.token-source == 'access-roster' && inputs.approver-github-app != ''
        uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        with:
          issuer: ${{ inputs.access-roster-issuer }}
          github-app: ${{ inputs.approver-github-app }}
          repositories: ${{ steps.repo.outputs.name }}
          permissions: pull_requests:write

      - name: Approve non-major renovate PRs that need a review
        if: steps.approver-key.outputs.token != '' || steps.approver-roster.outputs.github-token != ''
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: approve-renovate
          token: ${{ steps.approver-key.outputs.token || steps.approver-roster.outputs.github-token }}
          repository: ${{ matrix.repository }}
          api-url: ${{ github.api_url }}

  # The decision table: which major versions exist, for which package, in
  # which repositories — built from every job's report, whether or not the
  # policy let renovate open a PR for them.
  majors:
    needs: [discover, renovate]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: renovate-report-*
          path: reports

      - name: Available majors across the estate
        uses: truvity/ci-actions/fleet-step@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          step: available-majors
