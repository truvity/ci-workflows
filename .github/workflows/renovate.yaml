# Self-hosted Renovate, daily.
#
# SAME-ORG callers pass `secrets: inherit`; CROSS-ORG callers must pass
# the key explicitly (see the secrets: block below). A called workflow
# receives NONE
# of the caller's secrets otherwise — `vars` resolve, secrets do not —
# and the failure is the ugly kind: create-github-app-token reports
# "'client-id' … must be set to a non-empty string", which reads like a
# malformed workflow rather than a missing entitlement.
#
#   jobs:
#     renovate:
#       uses: truvity/ci-workflows/.github/workflows/renovate.yaml@<sha>
#       secrets: inherit
#
# TWO entitlement gates, both silent (INF-556). The repository must be
# in scope for `RENOVATE_CLIENT_ID` and `RENOVATE_APP_PRIVATE_KEY`, AND
# the App must be installed on it — the second yields
# `Failed to create token for "<repo>": Not Found`, which looks like a
# missing repository. Gate 1 is a `gh api` call; gate 2 needs an
# Organization Owner.
name: renovate

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      log-level:
        required: false
        type: string
        default: info
      timeout-minutes:
        required: false
        type: number
        default: 30
      allowed-commands:
        description: >-
          JSON array of shell commands renovate's postUpgradeTasks may
          run (RENOVATE_ALLOWED_COMMANDS). Empty by default: a repo that
          wants regeneration-in-branch (gitops: render + golden after a
          pin bump, so the PR is born green) allowlists its exact
          commands here — the runner image's devbox makes the toolchain
          available.
        required: false
        type: string
        default: "[]"

    secrets:
      # Declared, not merely inherited, so that callers in ANOTHER
      # organization can pass it explicitly.
      #
      # `secrets: inherit` does not carry secrets across an org boundary.
      # Measured 2026-08-19: trust-form callers reached this workflow
      # with `vars` resolving correctly and every secret empty, and it
      # made no difference whether the secret was set at organization or
      # at repository level. The same-org callers keep working unchanged
      # — `inherit` fills a declared secret of the same name.
      RENOVATE_APP_PRIVATE_KEY:
        description: The Renovate App's private key.
        required: false

      # Declared, not just referenced: a reusable workflow can only read
      # secrets it declares, even under `secrets: inherit`, and actionlint
      # catches the omission before the run does.
      GO_MODULES_APP_PRIVATE_KEY:
        description: >-
          Private key for the go-modules App, used to let go.sum
          regeneration fetch private modules. Optional: public repos have
          no private module dependencies and skip the step entirely.
        required: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # client-id + vars.RENOVATE_CLIENT_ID, never app-id +
      # secrets.RENOVATE_APP_ID. The org migrated to the client-id form
      # and RENOVATE_APP_ID no longer exists as a secret; the old form is
      # what killed devbox-update across the whole public estate for
      # three weeks without a single red mark.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # npx, NOT renovatebot/github-action: the action runs renovate as a
      # DOCKER CONTAINER, and the ARC runners are daemonless by doctrine
      # (client-only docker; builds go to the remote builders) — every
      # renovate run on the pool died on the missing socket from the
      # moment the private estate rerouted to ARC (2026-08-25), and the
      # hourly bar cron surfaced it. Direct node execution needs no
      # daemon, runs identically on hosted runners, and is also what
      # makes postUpgradeTasks usable at all: in container mode they
      # would execute inside renovate's image, which carries none of the
      # runner's toolchain (devbox).
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          # renovate 44 uses RegExp.escape — a Node 24+ API; 22 dies with
          # "RegExp.escape is not a function" before scanning anything.
          node-version: 24

      # Renovate's gomod manager shells out to bare `go` for artifact
      # updates (go.sum regeneration) — postUpgradeTasks go through the
      # caller's devbox, but the manager does not, and the ARC runner
      # image carries no toolchains ("spawn go ENOENT" killed gitops'
      # renovate/all-minor-patch branch, 2026-08-26). `stable` suffices
      # for every repo: with GOTOOLCHAIN=auto (the default), go
      # self-fetches whatever newer toolchain a go.mod directive asks
      # for. cache off — there is no checkout to key a cache on.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Same shape for the JS managers: renovate shells out to bare
      # `yarn` for lockfile regeneration ("spawn yarn ENOENT" killed
      # bar's renovate/all-minor-patch branch, 2026-08-27, the run after
      # the daemonless fix finally let renovate reach that far).
      # corepack ships with Node and puts the yarn/pnpm shims on PATH;
      # each shim fetches the exact version the target repo's
      # package.json `packageManager` field pins (bar: yarn@4.18.0), so
      # no version is hardcoded here.
      - name: Enable corepack (yarn/pnpm shims for lockfile regeneration)
        run: corepack enable

      # Renovate's gomod manager regenerates go.sum by shelling out to
      # `go get -t ./...`. In a repo that imports PRIVATE truvity modules
      # that command fails at the first one and aborts the whole tidy, so
      # go.sum is left missing entries for the PUBLIC modules too. The PR
      # then lands red as
      #
      #   missing go.sum entry for module providing package
      #   github.com/go-git/go-git/v5
      #
      # which names a public package while the cause is a private one --
      # the reason this went undiagnosed. Every Go security PR in every
      # private repo has been red since at least 2026-08-27 (core, api,
      # go-core), while the JS PRs beside them stayed green, because npm
      # dependencies are public.
      #
      # Same mechanism setup-devbox already uses for the build: a token
      # from the go-modules App plus a git rewrite. Both credentials are
      # ORGANIZATION-level with visibility:private, so every private repo
      # already has them and no caller has to pass anything. Public repos
      # resolve the variable empty, skip the step, and want nothing from
      # it -- they have no private module dependencies by definition.
      - name: Mint a token for reading private Go modules
        id: module-token
        if: vars.GO_MODULES_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GO_MODULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.GO_MODULES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Let go reach private modules
        if: steps.module-token.outputs.token != ''
        env:
          MODULE_TOKEN: ${{ steps.module-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # GOPRIVATE only, never the token, through GITHUB_ENV: a value
          # containing a newline there can define further variables.
          printf 'GOPRIVATE=github.com/%s/*\n' "$OWNER" >> "$GITHUB_ENV"
          git config --global \
            "url.https://x-access-token:$MODULE_TOKEN@github.com/.insteadOf" \
            "https://github.com/"

      - name: Run renovate
        env:
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed-commands }}
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # renovate: datasource=npm depName=renovate
        run: npx --yes renovate@44.44.0
