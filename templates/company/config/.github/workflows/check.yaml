# The check caller of a company CONFIGURATION repository: the one that holds the company's authored
# `tenant/` tree,
# carried as `.github/workflows/check.yaml`. Copy it verbatim into a new
# repository; docs/company.md says what to set up around it.
#
# Its substance is the truvity/ci-actions caller-parity kit `company-config-check.yaml`:
# comment lines, blank lines and the pinned ref of the shared workflow are
# ignored by that check, so this prose is yours to rewrite and the pin is
# renovate's to move. hack/templates-cases.sh holds this file to the kit.
#
# The company's own settings are repository VARIABLES, not text in this
# file, so every company's copy is the same:
#
#   TENANT_INPUTS  the digest-pinned artifact the platform publishes for this
#                  company, `<registry>/<name>@sha256:<hex>`
#   CHART_PROFILE  the `aws:<account>:<role>` audience of a role that may read
#                  the private charts, and nothing else
#
# The trigger is `pull_request`, never `pull_request_target`: nothing here
# dispatches to another repository or needs a token that can, so a candidate
# runs with the read-only token of its own pull request. A pull request from
# a fork FAILS the shared workflow's company jobs; it is not skipped,
# because a skipped required check is green.
#
# The pin below is a release that carries the company inputs
# (`company-kind`, `tenant-inputs`, `chart-profile`, `tenant-validate`). The kit is still
# `enabled: false` in kits.yaml: it is switched on, in a change of its own,
# once TENANT_INPUTS can be a moving tag whose signature is verified.
#
# `tenant-validate: true` runs truvity/policy's tenant validator on the
# `tenant/` bundle (its shape, schemas and pin). Still NOT validated by a
# green run: the chart gate (`chart-gate` is off) and the platform's
# registration check, which the validator does not run and the fetched
# `tenant-inputs` do not feed. The shared workflow says so in its output.
#
# TENANT_INPUTS is read as a digest-pinned reference, which is what the
# `tenant-inputs` action accepts today. Resolving a moving tag to a digest
# and verifying its signature is a separate step that is not built yet; this
# variable's meaning changes with it.
#
# The fan-in job `check` is the context a branch ruleset requires: a
# reusable workflow cannot supply one, and a skipped call must not hand
# anyone a green required check, so it is strict "success".
name: check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  company:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@facfaac2996bd732fdc891b4282c81046b29be9c # v6.4.0
    with:
      company-kind: config
      tenant-inputs: ${{ vars.TENANT_INPUTS }}
      chart-profile: ${{ vars.CHART_PROFILE }}
      tenant-validate: true

  check:
    needs: company
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.company.result }}" = "success" ]'
